<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CODEX-05 AS-IS / TO-BE 비교</title>
  <style>
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:#0f172a;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
    .bar{height:48px;display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #334155;background:#111827}
    .bar div{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;letter-spacing:.02em}
    .bar .as{color:#cbd5e1;border-right:1px solid #334155}
    .bar .to{color:#c4b5fd}
    .note{position:fixed;z-index:5;left:50%;top:53px;transform:translateX(-50%);background:rgba(15,23,42,.9);border:1px solid #475569;border-radius:999px;padding:5px 12px;font-size:11px;color:#cbd5e1;pointer-events:none}
    .compare{height:calc(100% - 48px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;min-width:0}
    iframe{width:100%;height:100%;border:0;background:#fff}
    iframe:first-child{border-right:2px solid #475569}
    .changed-key{margin-left:10px;padding:3px 8px;border-radius:999px;background:#fff200;color:#292300;font-size:11px;font-weight:900;box-shadow:0 0 0 2px rgba(255,242,0,.3)}
  </style>
</head>
<body>
  <div class="bar"><div class="as">AS-IS · 현재 원본</div><div class="to">TO-BE · 1~11페이지 반영 / A~D 체계로 통일 <span class="changed-key">노란 형광 = 변경된 내용</span></div></div>
  <div class="note">좌우 화면은 각각 독립 스크롤 · TO-BE는 기존 10페이지를 정리해 총 16페이지이며, 새 9~11페이지는 같은 A~D를 세 관점으로 설명합니다</div>
  <main class="compare">
    <iframe title="AS-IS 현재 원본" src="CODEX-05-전략발표_AS-IS.html"></iframe>
    <iframe title="TO-BE 논리 보정 검토본" src="CODEX-05-전략발표_TO-BE.html"></iframe>
  </main>
</body>
</html>
