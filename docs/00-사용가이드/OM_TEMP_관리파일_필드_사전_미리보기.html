  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;main id=&quot;om-field-dictionary&quot;&gt;
  &lt;header class=&quot;fd-hero&quot;&gt;
    &lt;span class=&quot;viz-badge&quot;&gt;3번 가이드 보조 문서 · 실제 스키마 기준&lt;/span&gt;
    &lt;h1&gt;OpenMetadata 커스터마이징 관리 파일 필드 사전&lt;/h1&gt;
    &lt;p&gt;Manifest와 Registry 같은 관리 파일에서 각 필드가 무엇을 뜻하고, 누가 언제 작성하며, 검사기가 어떤 판단에 사용하는지 설명합니다.&lt;/p&gt;
    &lt;a class=&quot;btn&quot; href=&quot;OM_TEMP_커밋별_Manifest_등록_가이드_미리보기.html&quot;&gt;← 3번 · 검사 전 사전환경 설정으로 돌아가기&lt;/a&gt;
  &lt;/header&gt;

  &lt;section class=&quot;fd-scope&quot; aria-label=&quot;문서 사용 범위&quot;&gt;
    &lt;article class=&quot;card&quot;&gt;
      &lt;strong&gt;기준 코드&lt;/strong&gt;
      &lt;p&gt;&lt;code&gt;harness/acgh/schema&lt;/code&gt;의 실제 JSON Schema와 &lt;code&gt;om-temp-1.13.0&lt;/code&gt; 등록 파일을 기준으로 작성했습니다.&lt;/p&gt;
    &lt;/article&gt;
    &lt;article class=&quot;card&quot;&gt;
      &lt;strong&gt;읽는 방법&lt;/strong&gt;
      &lt;p&gt;필드의 뜻만 보지 말고 &lt;b&gt;작성 시점&lt;/b&gt;, &lt;b&gt;실제 사용&lt;/b&gt;, &lt;b&gt;문제 시 결과&lt;/b&gt;를 함께 확인합니다.&lt;/p&gt;
    &lt;/article&gt;
    &lt;article class=&quot;card&quot;&gt;
      &lt;strong&gt;자동·수동 구분&lt;/strong&gt;
      &lt;p&gt;Git이 계산하는 SHA·변경 경로와 담당자가 판단하는 업무 조건·담당자·중요도를 구분합니다.&lt;/p&gt;
    &lt;/article&gt;
  &lt;/section&gt;

  &lt;nav class=&quot;fd-toc&quot; aria-label=&quot;필드 사전 목차&quot;&gt;
    &lt;a href=&quot;#manifest&quot;&gt;Manifest&lt;/a&gt;
    &lt;a href=&quot;#registry&quot;&gt;Registry&lt;/a&gt;
    &lt;a href=&quot;#contracts&quot;&gt;Contracts&lt;/a&gt;
    &lt;a href=&quot;#inventory&quot;&gt;변경 목록·공용 파일&lt;/a&gt;
    &lt;a href=&quot;#policy&quot;&gt;경로·위험 정책&lt;/a&gt;
    &lt;a href=&quot;#locks&quot;&gt;Candidate·Patch lock&lt;/a&gt;
    &lt;a href=&quot;#results&quot;&gt;검사 결과&lt;/a&gt;
  &lt;/nav&gt;

  &lt;section class=&quot;fd-section&quot; id=&quot;manifest&quot;&gt;
    &lt;div class=&quot;fd-heading&quot;&gt;
      &lt;span&gt;01&lt;/span&gt;
      &lt;div&gt;
        &lt;h2&gt;Manifest&lt;/h2&gt;
        &lt;p&gt;BANK-OM 한 기능의 코드 변경 범위, 업그레이드 감시 범위, 동작 검사 연결과 여러 commit 사용 정책을 기록합니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;fd-example&quot;&gt;
      &lt;strong&gt;BANK-OM-001 실제 구조&lt;/strong&gt;
      &lt;pre&gt;&lt;code&gt;schema_version: 1
customization_id: BANK-OM-001
status: active
kind: core-patch
title: 기준코드(InstanceCode)

implementation:
  allowed_changed_paths: [...]
  required_changed_paths: [...]

upgrade_watch:
  paths: [...]

assurance:
  contracts: [CONTRACT-INSTANCE-CODE]
  direct_tests: []

series:
  allowed: false
  depends_on: []&lt;/code&gt;&lt;/pre&gt;
    &lt;/div&gt;

    &lt;details class=&quot;fd-group&quot; open&gt;
      &lt;summary&gt;기본 식별 필드&lt;/summary&gt;
      &lt;div class=&quot;fd-fields&quot;&gt;
        &lt;article&gt;
          &lt;h3&gt;&lt;code&gt;schema_version&lt;/code&gt; &lt;span&gt;필수&lt;/span&gt;&lt;/h3&gt;
          &lt;p&gt;&lt;b&gt;의미&lt;/b&gt; 관리 파일 형식의 버전입니다. 현재 허용값은 숫자 &lt;code&gt;1&lt;/code&gt;뿐입니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;작성&lt;/b&gt; 파일을 처음 만들 때 생성기가 기록하며, 담당자가 임의로 올리지 않습니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;사용·결과&lt;/b&gt; 검사기가 어떤 스키마로 읽을지 결정합니다. 값이 다르면 파일 구조 검증이 실패합니다.&lt;/p&gt;
        &lt;/article&gt;
        &lt;article&gt;
          &lt;h3&gt;&lt;code&gt;customization_id&lt;/code&gt; &lt;span&gt;필수&lt;/span&gt;&lt;/h3&gt;
          &lt;p&gt;&lt;b&gt;의미&lt;/b&gt; 하나의 업무 기능을 코드·Manifest·Contract·검사 결과에서 같은 대상으로 연결하는 번호입니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;작성&lt;/b&gt; 관리 담당자가 미사용 번호를 발급합니다. 형식은 &lt;code&gt;BANK-OM-001&lt;/code&gt;처럼 최소 세 자리 숫자입니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;사용·결과&lt;/b&gt; Registry와 commit 메시지의 ID를 대조합니다. 미등록·불일치·중복이면 검사를 중단합니다.&lt;/p&gt;
        &lt;/article&gt;
        &lt;article&gt;
          &lt;h3&gt;&lt;code&gt;status&lt;/code&gt; &lt;span&gt;현재 명시&lt;/span&gt;&lt;/h3&gt;
          &lt;p&gt;&lt;b&gt;의미&lt;/b&gt; 기능을 현재 검사·유지할지 나타냅니다. 값은 &lt;code&gt;active&lt;/code&gt; 또는 &lt;code&gt;retired&lt;/code&gt;입니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;작성&lt;/b&gt; 최초 등록은 보통 &lt;code&gt;active&lt;/code&gt;, 기능 폐기 승인 뒤 &lt;code&gt;retired&lt;/code&gt;로 바꿉니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;사용·결과&lt;/b&gt; Registry의 상태와 같아야 합니다. 서로 다르면 등록자료 연결 검증이 실패합니다.&lt;/p&gt;
        &lt;/article&gt;
        &lt;article&gt;
          &lt;h3&gt;&lt;code&gt;kind&lt;/code&gt; &lt;span&gt;필수&lt;/span&gt;&lt;/h3&gt;
          &lt;p&gt;&lt;b&gt;의미&lt;/b&gt; 변경 유형입니다. &lt;code&gt;core-patch&lt;/code&gt;는 공식 코드 결합 변경, &lt;code&gt;extension&lt;/code&gt;은 분리 확장, &lt;code&gt;governance&lt;/code&gt;는 검사기·정책 변경입니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;작성&lt;/b&gt; 코드 구조를 확인한 개발자와 관리 담당자가 선택합니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;사용·결과&lt;/b&gt; 허용된 세 값 외의 문자열은 스키마 검증에서 실패합니다.&lt;/p&gt;
        &lt;/article&gt;
        &lt;article&gt;
          &lt;h3&gt;&lt;code&gt;title&lt;/code&gt; &lt;span&gt;설명&lt;/span&gt;&lt;/h3&gt;
          &lt;p&gt;&lt;b&gt;의미&lt;/b&gt; 사람이 BANK-OM 기능을 알아보기 위한 이름입니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;작성&lt;/b&gt; 업무 기능을 처음 등록할 때 정합니다. 예: &lt;code&gt;기준코드(InstanceCode)&lt;/code&gt;.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;사용·결과&lt;/b&gt; 보고서와 검토 화면의 설명에 사용합니다. ID나 코드 검사를 대신하지 않습니다.&lt;/p&gt;
        &lt;/article&gt;
      &lt;/div&gt;
    &lt;/details&gt;

    &lt;details class=&quot;fd-group&quot; open&gt;
      &lt;summary&gt;&lt;code&gt;implementation&lt;/code&gt; · 실제 코드 변경 범위&lt;/summary&gt;
      &lt;div class=&quot;fd-intro&quot;&gt;
        &lt;p&gt;&lt;code&gt;implementation&lt;/code&gt;은 “이 BANK-OM이 실제로 어떤 파일을 변경했는가”를 묶는 상위 항목입니다. 직접 파일 경로를 쓰는 자리가 아니라 아래 세 목록을 담습니다.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fd-fields&quot;&gt;
        &lt;article&gt;
          &lt;h3&gt;&lt;code&gt;allowed_changed_paths&lt;/code&gt; &lt;span&gt;필수&lt;/span&gt;&lt;/h3&gt;
          &lt;p&gt;&lt;b&gt;의미&lt;/b&gt; 최초 등록 기준에서 이 BANK-OM commit이 실제로 변경한 파일 전체입니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;작성&lt;/b&gt; Git diff로 자동 추출한 뒤 기능별 소유 관계를 사람이 검토합니다. 현재 OM_TEMP 등록은 폴더가 아니라 실제 파일 경로를 사용합니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;사용·결과&lt;/b&gt; 실제 commit이 목록 밖 파일을 바꾸면 BLOCK, 목록의 파일이 최종 코드에서 공식 원본과 같으면 담당자 확인이 필요합니다.&lt;/p&gt;
        &lt;/article&gt;
        &lt;article&gt;
          &lt;h3&gt;&lt;code&gt;required_changed_paths&lt;/code&gt; &lt;span&gt;운영상 필수&lt;/span&gt;&lt;/h3&gt;
          &lt;p&gt;&lt;b&gt;의미&lt;/b&gt; 해당 파일이 없거나 공식 원본과 같으면 커스터마이징의 필수 구현이 빠졌다고 즉시 판단할 수 있는 파일입니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;작성&lt;/b&gt; Git이 자동 결정하지 않습니다. 개발자와 기능 책임자가 전용 Resource·Schema처럼 역할이 명확한 파일을 선택합니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;사용·결과&lt;/b&gt; 파일 소실 또는 공식 원본과 동일하면 BLOCK입니다. 활성 Manifest에서 목록이 비어 있어도 현재 유지 검사에서 BLOCK입니다.&lt;/p&gt;
        &lt;/article&gt;
        &lt;article&gt;
          &lt;h3&gt;&lt;code&gt;candidate_additional_paths&lt;/code&gt; &lt;span&gt;필요할 때&lt;/span&gt;&lt;/h3&gt;
          &lt;p&gt;&lt;b&gt;의미&lt;/b&gt; 최초 snapshot 등록 뒤 같은 BANK-OM ID의 후속 commit이 새로 변경한 파일입니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;작성&lt;/b&gt; 후속 commit diff에서 생성하고 같은 기능의 연장인지 사람이 승인합니다. 별도 기능이면 새 BANK-OM ID를 발급합니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;사용·결과&lt;/b&gt; 최초 snapshot 재구성에서는 제외하지만 현재 후보의 변경 범위·유지 검사에는 포함합니다. BANK-OM-007은 후속 파일 2개가 등록돼 있습니다.&lt;/p&gt;
        &lt;/article&gt;
      &lt;/div&gt;
    &lt;/details&gt;

    &lt;details class=&quot;fd-group&quot; open&gt;
      &lt;summary&gt;&lt;code&gt;upgrade_watch&lt;/code&gt; · 공식 버전 변경 영향 확인&lt;/summary&gt;
      &lt;div class=&quot;fd-intro&quot;&gt;
        &lt;p&gt;&lt;code&gt;upgrade_watch&lt;/code&gt;는 새 공식 버전에서 무엇이 바뀌면 이 BANK-OM을 다시 검토해야 하는지 기록하는 상위 항목입니다.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fd-fields&quot;&gt;
        &lt;article&gt;
          &lt;h3&gt;&lt;code&gt;paths&lt;/code&gt;&lt;/h3&gt;
          &lt;p&gt;&lt;b&gt;의미&lt;/b&gt; 공식 업그레이드 전후에 변경 여부를 비교할 파일 경로입니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;작성&lt;/b&gt; Manifest 생성기가 실제 변경 경로를 포함하고, 커스터마이징이 직접 의존하지만 수정하지 않은 파일은 제안 결과를 사람이 검토해 추가합니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;사용·결과&lt;/b&gt; 새 공식 버전에서 경로가 바뀌면 자동 통과시키지 않고 담당자 검토 대상으로 표시합니다.&lt;/p&gt;
        &lt;/article&gt;
        &lt;article&gt;
          &lt;h3&gt;&lt;code&gt;configuration_keys&lt;/code&gt;&lt;/h3&gt;
          &lt;p&gt;&lt;b&gt;의미&lt;/b&gt; 파일 전체가 아니라 특정 설정 이름의 구조·값 변화를 살필 때 사용합니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;작성&lt;/b&gt; 커스터마이징이 특정 설정 키에 의존할 때 개발자가 추가합니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;사용·결과&lt;/b&gt; 키가 삭제되거나 값의 자료형이 바뀌면 업그레이드 영향 검토가 필요합니다.&lt;/p&gt;
        &lt;/article&gt;
        &lt;article&gt;
          &lt;h3&gt;&lt;code&gt;dependencies&lt;/code&gt;&lt;/h3&gt;
          &lt;p&gt;&lt;b&gt;의미&lt;/b&gt; 라이브러리·모듈 등 코드 경로 외의 의존 대상을 기록합니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;작성&lt;/b&gt; 의존성 변경이 기능 동작에 영향을 줄 수 있을 때 개발자가 추가합니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;사용·결과&lt;/b&gt; 새 공식 버전에서 의존 대상이 바뀌면 담당자 검토 대상으로 표시합니다.&lt;/p&gt;
        &lt;/article&gt;
      &lt;/div&gt;
    &lt;/details&gt;

    &lt;details class=&quot;fd-group&quot; open&gt;
      &lt;summary&gt;&lt;code&gt;assurance&lt;/code&gt; · 동작 검사 연결&lt;/summary&gt;
      &lt;div class=&quot;fd-callout&quot;&gt;
        &lt;strong&gt;assurance는 무엇인가?&lt;/strong&gt;
        &lt;p&gt;코드 파일이 남았다는 사실만으로는 기능 정상 여부를 알 수 없으므로, 어떤 업무 Contract와 기술 test로 정상 동작을 확인할지 연결하는 상위 항목입니다. 제품 코드를 수정하는 설정은 아닙니다.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fd-fields&quot;&gt;
        &lt;article&gt;
          &lt;h3&gt;&lt;code&gt;contracts&lt;/code&gt;&lt;/h3&gt;
          &lt;p&gt;&lt;b&gt;의미&lt;/b&gt; &lt;code&gt;contracts.yaml&lt;/code&gt;에 정의한 업무 정상 조건의 ID 목록입니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;작성&lt;/b&gt; 기능 책임자가 정상 조건을 정하고 개발자가 해당 Contract ID를 연결합니다. 예: &lt;code&gt;CONTRACT-INSTANCE-CODE&lt;/code&gt;.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;사용·결과&lt;/b&gt; 존재하지 않는 Contract, Registry와 다른 연결, Contract의 역방향 BANK-OM 연결 누락은 BLOCK입니다. 활성 기능에 Contract가 없으면 현재 유지 검사도 BLOCK합니다.&lt;/p&gt;
        &lt;/article&gt;
        &lt;article&gt;
          &lt;h3&gt;&lt;code&gt;direct_tests&lt;/code&gt;&lt;/h3&gt;
          &lt;p&gt;&lt;b&gt;의미&lt;/b&gt; 업무 Contract에서 파생된 test가 아닌 별도 기술 test 목록입니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;작성&lt;/b&gt; 업무 조건과 직접 연결되지 않는 회귀·구조 검사가 필요할 때 개발자가 추가합니다. 현재 OM_TEMP 7개 Manifest는 빈 목록입니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;사용·결과&lt;/b&gt; 실제 실행 대상은 &lt;code&gt;direct_tests&lt;/code&gt;와 Contract의 &lt;code&gt;required_tests&lt;/code&gt;를 합친 목록입니다. 같은 test를 양쪽에 중복 등록하면 BLOCK입니다.&lt;/p&gt;
        &lt;/article&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fd-formula&quot;&gt;
        실제 필수 test = &lt;code&gt;assurance.direct_tests&lt;/code&gt; + 연결된 Contract의 &lt;code&gt;required_tests&lt;/code&gt;
      &lt;/div&gt;
    &lt;/details&gt;

    &lt;details class=&quot;fd-group&quot;&gt;
      &lt;summary&gt;&lt;code&gt;series&lt;/code&gt; · 같은 ID의 여러 commit과 선행 관계&lt;/summary&gt;
      &lt;div class=&quot;fd-fields&quot;&gt;
        &lt;article&gt;
          &lt;h3&gt;&lt;code&gt;allowed&lt;/code&gt;&lt;/h3&gt;
          &lt;p&gt;&lt;b&gt;의미&lt;/b&gt; 같은 BANK-OM ID가 여러 commit으로 이어지는 것을 허용할지 나타냅니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;작성&lt;/b&gt; 단일 commit이면 &lt;code&gt;false&lt;/code&gt;, 같은 기능의 후속 보완을 별도 commit으로 유지해야 하면 검토 후 &lt;code&gt;true&lt;/code&gt;로 둡니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;사용·결과&lt;/b&gt; &lt;code&gt;false&lt;/code&gt;인데 같은 ID commit이 여러 개면 적용 이력 검사가 실패합니다.&lt;/p&gt;
        &lt;/article&gt;
        &lt;article&gt;
          &lt;h3&gt;&lt;code&gt;depends_on&lt;/code&gt;&lt;/h3&gt;
          &lt;p&gt;&lt;b&gt;의미&lt;/b&gt; 이 기능보다 먼저 적용돼야 하는 다른 BANK-OM ID입니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;작성&lt;/b&gt; 실제 코드 선행 관계가 있을 때 개발자가 등록합니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;사용·결과&lt;/b&gt; 미등록 ID, 자기 자신 참조, 순환 의존, 선행 순서 오류가 있으면 적용 순서 검사가 실패합니다. 실제 commit SHA와 적용 순서는 Patch-lock에 기록합니다.&lt;/p&gt;
        &lt;/article&gt;
      &lt;/div&gt;
    &lt;/details&gt;

    &lt;details class=&quot;fd-group&quot; open&gt;
      &lt;summary&gt;공식 버전 업그레이드 때 기존 Manifest를 어떻게 처리하나?&lt;/summary&gt;
      &lt;div class=&quot;fd-callout&quot;&gt;
        &lt;strong&gt;결론&lt;/strong&gt;
        &lt;p&gt;기존 업무 기능을 새 공식 버전에 맞춘 것이라면 BANK-OM ID는 유지합니다. 새 버전 등록 폴더에는 같은 ID의 Manifest를 복사해 새 후보 기준으로 다시 검토하지만, 새 기능 ID를 발급하거나 빈 Manifest를 처음부터 다시 만드는 것은 아닙니다.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fd-fields&quot;&gt;
        &lt;article&gt;
          &lt;h3&gt;기존 파일 안에서 충돌만 해결&lt;/h3&gt;
          &lt;p&gt;&lt;b&gt;ID&lt;/b&gt; 기존 &lt;code&gt;BANK-OM-001&lt;/code&gt;을 그대로 사용합니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;Manifest&lt;/b&gt; 변경 경로·필수 파일·Contract가 그대로라면 내용도 그대로 유지합니다. 실제 OM_TEMP의 1.13.0과 1.13.1 BANK-OM-001 Manifest는 동일합니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;commit&lt;/b&gt; 해결된 commit 메시지에 &lt;code&gt;Customization-ID: BANK-OM-001&lt;/code&gt;을 남깁니다.&lt;/p&gt;
        &lt;/article&gt;
        &lt;article&gt;
          &lt;h3&gt;해결하면서 새 파일이 추가됨&lt;/h3&gt;
          &lt;p&gt;&lt;b&gt;같은 기능이면&lt;/b&gt; 같은 ID를 유지하고 새 경로를 &lt;code&gt;candidate_additional_paths&lt;/code&gt;에 추가합니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;필수 파일이면&lt;/b&gt; &lt;code&gt;required_changed_paths&lt;/code&gt;에도 추가하고, 공식 변경 영향을 다시 볼 경로는 &lt;code&gt;upgrade_watch.paths&lt;/code&gt;에 반영합니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;동작 조건이 달라지면&lt;/b&gt; 연결된 Contract와 test를 갱신합니다.&lt;/p&gt;
        &lt;/article&gt;
        &lt;article&gt;
          &lt;h3&gt;같은 ID의 별도 후속 commit을 추가&lt;/h3&gt;
          &lt;p&gt;&lt;b&gt;정책&lt;/b&gt; 동일 후보 이력에 같은 ID commit이 둘 이상 남으면 &lt;code&gt;series.allowed: true&lt;/code&gt;가 필요합니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;주의&lt;/b&gt; 충돌을 해결한 뒤 &lt;code&gt;git cherry-pick --continue&lt;/code&gt;로 하나의 적용 commit이 만들어진 것만으로는 별도 후속 commit이 하나 더 생긴 것이 아닙니다.&lt;/p&gt;
          &lt;p&gt;&lt;b&gt;patch-replay일 때&lt;/b&gt; Patch-lock의 revision과 &lt;code&gt;source_commits&lt;/code&gt;, 충돌 해결 기록도 함께 갱신합니다.&lt;/p&gt;
        &lt;/article&gt;
        &lt;article&gt;
          &lt;h3&gt;새 ID가 필요한 경우&lt;/h3&gt;
          &lt;p&gt;충돌 해결을 넘어 독립적인 업무 기능·독립 배포·독립 Contract가 생긴 경우에만 새 BANK-OM ID와 새 Manifest를 만듭니다.&lt;/p&gt;
          &lt;p&gt;하나의 해결 commit에 여러 BANK-OM ID를 함께 넣지 않습니다. 현재 검사는 제품 코드 commit마다 정확히 하나의 &lt;code&gt;Customization-ID&lt;/code&gt;를 요구합니다.&lt;/p&gt;
        &lt;/article&gt;
      &lt;/div&gt;
    &lt;/details&gt;
  &lt;/section&gt;

  &lt;section class=&quot;fd-section&quot; id=&quot;registry&quot;&gt;
    &lt;div class=&quot;fd-heading&quot;&gt;
      &lt;span&gt;02&lt;/span&gt;
      &lt;div&gt;
        &lt;h2&gt;Registry&lt;/h2&gt;
        &lt;p&gt;검사 대상 BANK-OM 전체와 기준 소스, 담당자, 중요도, Manifest·Contract 연결을 한곳에서 관리합니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;details class=&quot;fd-group&quot; open&gt;
      &lt;summary&gt;&lt;code&gt;source&lt;/code&gt; · 등록 기준 코드&lt;/summary&gt;
      &lt;div class=&quot;fd-fields&quot;&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;repository&lt;/code&gt;·&lt;code&gt;snapshot_sha&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;&lt;b&gt;의미&lt;/b&gt; 행내 변경을 분석한 저장소와 고정 commit SHA입니다.&lt;/p&gt;&lt;p&gt;&lt;b&gt;작성&lt;/b&gt; Git에서 자동 확인합니다.&lt;/p&gt;&lt;p&gt;&lt;b&gt;결과&lt;/b&gt; 다른 SHA를 검사 결과와 섞지 않도록 기준을 고정합니다.&lt;/p&gt;&lt;/article&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;upstream_repository&lt;/code&gt;·&lt;code&gt;upstream_tag&lt;/code&gt;·&lt;code&gt;upstream_sha&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;&lt;b&gt;의미&lt;/b&gt; 비교 기준 공식 OpenMetadata 저장소·버전·commit입니다.&lt;/p&gt;&lt;p&gt;&lt;b&gt;작성&lt;/b&gt; 공식 tag가 가리키는 SHA를 확인해 기록합니다.&lt;/p&gt;&lt;p&gt;&lt;b&gt;결과&lt;/b&gt; 공식 기준을 찾지 못하거나 후보 이력과 맞지 않으면 검사할 수 없습니다.&lt;/p&gt;&lt;/article&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;changed_path_count&lt;/code&gt;·&lt;code&gt;diff_inventory&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;&lt;b&gt;의미&lt;/b&gt; 공식 원본과 행내 snapshot 사이의 전체 변경 파일 수와 파일 목록 경로입니다.&lt;/p&gt;&lt;p&gt;&lt;b&gt;작성&lt;/b&gt; Git diff로 생성합니다.&lt;/p&gt;&lt;p&gt;&lt;b&gt;결과&lt;/b&gt; 실제 diff와 목록·Manifest가 다르면 등록자료 검증이 실패합니다.&lt;/p&gt;&lt;/article&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;ancestry_preserved&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;&lt;b&gt;의미&lt;/b&gt; 행내 snapshot의 Git 이력 안에 공식 원본 commit이 실제 조상으로 남아 있는지 나타냅니다.&lt;/p&gt;&lt;p&gt;&lt;b&gt;작성&lt;/b&gt; Git 포함 관계로 계산합니다.&lt;/p&gt;&lt;p&gt;&lt;b&gt;결과&lt;/b&gt; &lt;code&gt;false&lt;/code&gt;이면 일반 조상 기반 검사 대신 snapshot 재구성 절차가 필요하며 Registry 준비 상태는 배포 승인을 차단합니다.&lt;/p&gt;&lt;/article&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;unregistered_findings&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;&lt;b&gt;의미&lt;/b&gt; 어느 BANK-OM에도 아직 귀속하지 못한 변경 파일과 처리 방안입니다.&lt;/p&gt;&lt;p&gt;&lt;b&gt;작성&lt;/b&gt; 자동 발견 뒤 담당자가 분류·사유·조치를 정합니다.&lt;/p&gt;&lt;p&gt;&lt;b&gt;결과&lt;/b&gt; &lt;code&gt;remove&lt;/code&gt;·&lt;code&gt;register&lt;/code&gt;·&lt;code&gt;block&lt;/code&gt; 상태가 남아 있으면 준비 검사가 BLOCK입니다.&lt;/p&gt;&lt;/article&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;limitations&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;&lt;b&gt;의미&lt;/b&gt; 현재 등록자료로 증명하지 못하는 범위를 기록합니다.&lt;/p&gt;&lt;p&gt;&lt;b&gt;작성&lt;/b&gt; 분석 담당자가 사실에 근거해 작성합니다.&lt;/p&gt;&lt;p&gt;&lt;b&gt;결과&lt;/b&gt; 자동 판정값은 아니지만 책임자가 결과 범위를 과대해석하지 않도록 함께 읽습니다.&lt;/p&gt;&lt;/article&gt;
      &lt;/div&gt;
    &lt;/details&gt;
    &lt;details class=&quot;fd-group&quot; open&gt;
      &lt;summary&gt;&lt;code&gt;entries&lt;/code&gt; · BANK-OM별 관리 항목&lt;/summary&gt;
      &lt;div class=&quot;fd-fields&quot;&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;customization_id&lt;/code&gt;·&lt;code&gt;title&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;Manifest와 같은 ID, 사람이 이해할 기능 이름입니다. ID 중복 또는 Manifest ID 불일치는 실패합니다.&lt;/p&gt;&lt;/article&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;owner&lt;/code&gt;·&lt;code&gt;owner_status&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;기능과 결과를 책임지는 조직·담당자와 배정 여부입니다. &lt;code&gt;pending&lt;/code&gt;이면 Registry 준비 검사가 BLOCK합니다. 현재 OM_TEMP 7개는 아직 &lt;code&gt;UNASSIGNED&lt;/code&gt;입니다.&lt;/p&gt;&lt;/article&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;status&lt;/code&gt;·&lt;code&gt;criticality&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;활성·폐기 상태와 장애 영향도입니다. 중요도는 &lt;code&gt;low&lt;/code&gt;·&lt;code&gt;medium&lt;/code&gt;·&lt;code&gt;high&lt;/code&gt;·&lt;code&gt;critical&lt;/code&gt; 중 하나이며 test 재시도 승인 기준 등에 사용됩니다.&lt;/p&gt;&lt;/article&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;manifest&lt;/code&gt;·&lt;code&gt;contracts&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;해당 ID의 Manifest 파일 경로와 Contract ID 목록입니다. Manifest·Registry·Contracts의 양방향 연결이 다르면 실패합니다.&lt;/p&gt;&lt;/article&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;provenance&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;&lt;code&gt;source-snapshot&lt;/code&gt;은 최초 snapshot에 있던 기능, &lt;code&gt;candidate-follow-up&lt;/code&gt;은 이후 후보 보강입니다. 최초 재구성과 현재 후보 검사 범위를 구분할 때 사용합니다.&lt;/p&gt;&lt;/article&gt;
      &lt;/div&gt;
    &lt;/details&gt;
  &lt;/section&gt;

  &lt;section class=&quot;fd-section&quot; id=&quot;contracts&quot;&gt;
    &lt;div class=&quot;fd-heading&quot;&gt;
      &lt;span&gt;03&lt;/span&gt;
      &lt;div&gt;
        &lt;h2&gt;Contracts&lt;/h2&gt;
        &lt;p&gt;기능이 정상이라고 판단할 업무 조건과 이를 확인할 필수 Python pytest를 연결합니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;fd-example&quot;&gt;
      &lt;pre&gt;&lt;code&gt;- id: CONTRACT-INSTANCE-CODE
  title: InstanceCode CRUD, search, and index round-trip
  invariant: CRUD와 재색인 뒤에도 codeGroup/codeValue가 동일하다.
  required_tests:
    - tests/bank/contracts/test_instance_code.py::test_crud_search_roundtrip
  customization_ids: [BANK-OM-001]&lt;/code&gt;&lt;/pre&gt;
    &lt;/div&gt;
    &lt;div class=&quot;fd-fields&quot;&gt;
      &lt;article&gt;&lt;h3&gt;&lt;code&gt;id&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;Contract의 고유 번호입니다. &lt;code&gt;CONTRACT-...&lt;/code&gt; 형식을 사용하며 중복되면 실패합니다.&lt;/p&gt;&lt;/article&gt;
      &lt;article&gt;&lt;h3&gt;&lt;code&gt;title&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;검토 화면에서 Contract를 식별하는 이름입니다. 판정 조건 자체는 &lt;code&gt;invariant&lt;/code&gt;에 적습니다.&lt;/p&gt;&lt;/article&gt;
      &lt;article&gt;&lt;h3&gt;&lt;code&gt;invariant&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;버전이 바뀌어도 반드시 유지돼야 하는 업무 동작을 한 문장으로 적습니다. Git이 생성하지 못하며 기능 책임자가 정의합니다.&lt;/p&gt;&lt;/article&gt;
      &lt;article&gt;&lt;h3&gt;&lt;code&gt;required_tests&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;정상 조건을 확인할 pytest 파일·함수 선택자입니다. 파일이나 함수가 없으면 BLOCK, Python 문법을 읽지 못하면 ANALYSIS ERROR입니다. 실제 실행 성공은 별도 검사에서 확인합니다.&lt;/p&gt;&lt;/article&gt;
      &lt;article&gt;&lt;h3&gt;&lt;code&gt;customization_ids&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;이 Contract가 보호하는 BANK-OM ID 목록입니다. Manifest에서 Contract를 참조했는데 이 역방향 목록에 ID가 없으면 BLOCK입니다.&lt;/p&gt;&lt;/article&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;fd-section&quot; id=&quot;inventory&quot;&gt;
    &lt;div class=&quot;fd-heading&quot;&gt;
      &lt;span&gt;04&lt;/span&gt;
      &lt;div&gt;&lt;h2&gt;공용 파일 소유정보와 전체 변경 목록&lt;/h2&gt;&lt;p&gt;여러 기능이 함께 수정한 파일과 공식 원본 대비 모든 변경 경로를 기록합니다.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;fd-fields&quot;&gt;
      &lt;article&gt;
        &lt;h3&gt;&lt;code&gt;shared-path-owners.yaml&lt;/code&gt;&lt;/h3&gt;
        &lt;p&gt;&lt;b&gt;구조&lt;/b&gt; 파일 경로를 key로, 해당 파일을 수정한 BANK-OM ID 목록을 value로 적습니다.&lt;/p&gt;
        &lt;p&gt;&lt;b&gt;예시&lt;/b&gt; &lt;code&gt;Entity.java: [BANK-OM-001, BANK-OM-002]&lt;/code&gt;&lt;/p&gt;
        &lt;p&gt;&lt;b&gt;사용·결과&lt;/b&gt; 한 공용 파일을 한 기능에 잘못 귀속하지 않도록 합니다. 실제 중복 소유와 목록이 다르면 snapshot 재구성 검사가 실패합니다.&lt;/p&gt;
      &lt;/article&gt;
      &lt;article&gt;
        &lt;h3&gt;&lt;code&gt;source-diff-paths.txt&lt;/code&gt;&lt;/h3&gt;
        &lt;p&gt;&lt;b&gt;구조&lt;/b&gt; 공식 원본과 행내 snapshot 사이에서 다른 root 기준 파일 경로를 한 줄에 하나씩 적습니다.&lt;/p&gt;
        &lt;p&gt;&lt;b&gt;작성&lt;/b&gt; Git diff로 생성합니다. OM_TEMP 1.13.0 등록본은 111개입니다.&lt;/p&gt;
        &lt;p&gt;&lt;b&gt;사용·결과&lt;/b&gt; 실제 diff, 모든 Manifest 범위, 공용 파일 소유정보가 전체 변경을 빠짐없이 설명하는지 확인합니다.&lt;/p&gt;
      &lt;/article&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;fd-section&quot; id=&quot;policy&quot;&gt;
    &lt;div class=&quot;fd-heading&quot;&gt;
      &lt;span&gt;05&lt;/span&gt;
      &lt;div&gt;&lt;h2&gt;Repository layout과 Sensitive zones&lt;/h2&gt;&lt;p&gt;변경 파일이 어느 영역에 속하고 어느 수준의 검토가 필요한지 정하는 경로 정책입니다.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;details class=&quot;fd-group&quot; open&gt;
      &lt;summary&gt;&lt;code&gt;repository-layout.yaml&lt;/code&gt;&lt;/summary&gt;
      &lt;div class=&quot;fd-fields&quot;&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;upstream_base_sha&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;경로 정책을 작성한 공식 기준 commit입니다. 다른 공식 버전에서는 경로 체계를 다시 검토합니다.&lt;/p&gt;&lt;/article&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;path_grammar&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;root 상대경로, 대소문자, Unicode 정규화, symlink·submodule·LFS 처리처럼 경로 해석 방식을 고정합니다.&lt;/p&gt;&lt;/article&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;upstream_owned_roots&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;공식 OpenMetadata 제품 코드 영역입니다. 예: &lt;code&gt;openmetadata-service/**&lt;/code&gt;.&lt;/p&gt;&lt;/article&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;bank_governance_roots&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;행내 검사 정책·test·문서 영역입니다. 제품 코드 커스터마이징과 분리합니다.&lt;/p&gt;&lt;/article&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;platform_extension_roots&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;공식 코드와 분리한 행내 확장 영역입니다.&lt;/p&gt;&lt;/article&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;unknown_path_policy&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;어느 영역에도 속하지 않는 경로를 처리하는 방식입니다. 현재는 추측하지 않고 &lt;code&gt;analysis_error&lt;/code&gt;로 중단합니다.&lt;/p&gt;&lt;/article&gt;
      &lt;/div&gt;
    &lt;/details&gt;
    &lt;details class=&quot;fd-group&quot; open&gt;
      &lt;summary&gt;&lt;code&gt;sensitive-zones.yaml&lt;/code&gt;&lt;/summary&gt;
      &lt;div class=&quot;fd-fields&quot;&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;frozen&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;일반 변경에서 금지한 경로입니다. 변경하면 BLOCK입니다.&lt;/p&gt;&lt;/article&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;protected&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;보안·인증·설정처럼 별도 승인이 필요한 경로입니다. 변경하면 APPROVAL 대상입니다.&lt;/p&gt;&lt;/article&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;watched&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;DB migration·ingestion처럼 주의 깊게 봐야 할 경로입니다. 변경 사실을 결과에 표시해 담당자가 확인합니다.&lt;/p&gt;&lt;/article&gt;
      &lt;/div&gt;
    &lt;/details&gt;
  &lt;/section&gt;

  &lt;section class=&quot;fd-section&quot; id=&quot;locks&quot;&gt;
    &lt;div class=&quot;fd-heading&quot;&gt;
      &lt;span&gt;06&lt;/span&gt;
      &lt;div&gt;&lt;h2&gt;Candidate lock과 Patch-lock&lt;/h2&gt;&lt;p&gt;검사 대상을 고정하는 자료와 patch-replay 방식의 재적용 순서를 고정하는 자료입니다.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;details class=&quot;fd-group&quot; open&gt;
      &lt;summary&gt;Candidate lock · 모든 전략에서 검사 대상 고정&lt;/summary&gt;
      &lt;div class=&quot;fd-fields&quot;&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;integration_strategy&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;&lt;code&gt;vendor-merge&lt;/code&gt; 또는 &lt;code&gt;patch-replay&lt;/code&gt; 중 이번 업그레이드 방식을 기록합니다. Manifest마다 쓰지 않고 후보 전체에 한 번 기록합니다.&lt;/p&gt;&lt;/article&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;upstream.repository&lt;/code&gt;·&lt;code&gt;base_sha&lt;/code&gt;·&lt;code&gt;target_sha&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;어느 공식 저장소의 어느 버전에서 어느 버전으로 올리는지 고정합니다.&lt;/p&gt;&lt;/article&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;candidate.repository&lt;/code&gt;·&lt;code&gt;commit_sha&lt;/code&gt;·&lt;code&gt;tree_sha&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;검사할 행내 저장소와 정확한 commit·전체 파일 상태를 고정합니다.&lt;/p&gt;&lt;/article&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;candidate.artifact_digest&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;검사 대상 코드로 만든 이미지·패키지의 SHA-256입니다. Git SHA와 다른 값이며 실제 배포 산출물 일치 확인에 사용합니다.&lt;/p&gt;&lt;/article&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;patch_source_lock_digest&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;&lt;code&gt;patch-replay&lt;/code&gt;일 때만 필수입니다. 어떤 Patch-lock을 사용했는지 digest로 고정합니다.&lt;/p&gt;&lt;/article&gt;
      &lt;/div&gt;
    &lt;/details&gt;
    &lt;details class=&quot;fd-group&quot;&gt;
      &lt;summary&gt;Patch-lock · patch-replay 선택 시에만 사용&lt;/summary&gt;
      &lt;div class=&quot;fd-fields&quot;&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;source_release_tag&lt;/code&gt;·&lt;code&gt;source_release_sha&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;커스터마이징 commit을 가져올 이전 행내 릴리스 기준을 고정합니다.&lt;/p&gt;&lt;/article&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;patch_series[].id&lt;/code&gt;·&lt;code&gt;revision&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;적용할 BANK-OM ID와 해당 변경 묶음의 개정 번호입니다.&lt;/p&gt;&lt;/article&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;source_commits&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;그 ID에 속한 실제 Git commit SHA를 적용 순서대로 기록합니다. branch 이름이나 latest를 사용하지 않습니다.&lt;/p&gt;&lt;/article&gt;
        &lt;article&gt;&lt;h3&gt;&lt;code&gt;depends_on&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;먼저 적용돼야 하는 BANK-OM ID입니다. 목록 자체가 적용 순서이므로 선행 ID가 앞에 있어야 합니다.&lt;/p&gt;&lt;/article&gt;
      &lt;/div&gt;
      &lt;p class=&quot;fd-note&quot;&gt;현재 OM_TEMP의 기본 전략은 vendor-merge이므로 Patch-lock은 초기 등록 필수 파일이 아닙니다.&lt;/p&gt;
    &lt;/details&gt;
  &lt;/section&gt;

  &lt;section class=&quot;fd-section&quot; id=&quot;results&quot;&gt;
    &lt;div class=&quot;fd-heading&quot;&gt;
      &lt;span&gt;07&lt;/span&gt;
      &lt;div&gt;&lt;h2&gt;검사 결과 JSON·YAML&lt;/h2&gt;&lt;p&gt;어떤 입력으로 어떤 검사를 실행했고 왜 그 판정이 나왔는지 나중에 다시 확인할 수 있게 보존합니다.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;fd-fields&quot;&gt;
      &lt;article&gt;&lt;h3&gt;&lt;code&gt;canonical_payload.verdict&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;전체 기계 판정입니다. 값은 &lt;code&gt;pass&lt;/code&gt;·&lt;code&gt;approval&lt;/code&gt;·&lt;code&gt;block&lt;/code&gt;·&lt;code&gt;analysis_error&lt;/code&gt;입니다.&lt;/p&gt;&lt;/article&gt;
      &lt;article&gt;&lt;h3&gt;&lt;code&gt;gates[].name&lt;/code&gt;·&lt;code&gt;verdict&lt;/code&gt;·&lt;code&gt;reasons&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;각 검사 이름, 개별 판정과 구체적인 이유입니다. 책임자는 번호보다 이 이유를 보고 조치합니다.&lt;/p&gt;&lt;/article&gt;
      &lt;article&gt;&lt;h3&gt;&lt;code&gt;inputs&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;검사한 저장소·commit·tree·artifact와 정책 digest 등 판정 입력입니다. 현재 코드와 다른 결과를 재사용하지 못하게 합니다.&lt;/p&gt;&lt;/article&gt;
      &lt;article&gt;&lt;h3&gt;&lt;code&gt;harness_version&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;결과를 만든 검사기 코드 버전입니다.&lt;/p&gt;&lt;/article&gt;
      &lt;article&gt;&lt;h3&gt;&lt;code&gt;result_digest&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;판정 본문이 바뀌지 않았는지 확인하는 SHA-256입니다. 설정 파일 digest나 배포 artifact digest와 서로 다른 값입니다.&lt;/p&gt;&lt;/article&gt;
      &lt;article&gt;&lt;h3&gt;&lt;code&gt;observational_metadata.run_id&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;실행을 찾기 위한 실행 번호입니다. 판정 본문 digest에는 포함되지 않는 관찰 정보입니다.&lt;/p&gt;&lt;/article&gt;
      &lt;article&gt;&lt;h3&gt;&lt;code&gt;expected_exit_code&lt;/code&gt;&lt;/h3&gt;&lt;p&gt;자동화가 반환해야 할 종료 코드입니다. 0·1·2·3 중 하나이며 결과 파일의 verdict와 명령 종료 상태를 맞추는 데 사용합니다.&lt;/p&gt;&lt;/article&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;footer class=&quot;fd-footer&quot;&gt;
    &lt;strong&gt;관리 원칙&lt;/strong&gt;
    &lt;p&gt;Git은 SHA와 변경 경로를 계산할 수 있지만, 업무 정상 조건·담당자·중요도·필수 파일은 결정하지 못합니다. 자동 생성값은 Git 근거로 재생성하고, 업무 판단값은 담당자 승인 기록과 함께 관리합니다.&lt;/p&gt;
    &lt;a class=&quot;btn&quot; href=&quot;OM_TEMP_커밋별_Manifest_등록_가이드_미리보기.html&quot;&gt;← 3번 가이드로 돌아가기&lt;/a&gt;
  &lt;/footer&gt;
&lt;/main&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
