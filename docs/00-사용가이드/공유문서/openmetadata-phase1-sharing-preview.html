  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;om-guide-v3&quot; data-artifact-status=&quot;current&quot;&gt;
  &lt;header class=&quot;om-hero&quot;&gt;
    &lt;span class=&quot;viz-badge&quot;&gt;1차 공유문서 · 현행본&lt;/span&gt;
    &lt;h1&gt;공식 OpenMetadata를 업데이트하면서 행내 기능을 유지하는 방법&lt;/h1&gt;
    &lt;p&gt;새 공식 버전과 기존 행내 커스터마이징을 하나의 코드로 합친 뒤, 누락된 기능과 승인되지 않은 변경이 없는지 검사하는 반복 절차입니다.&lt;/p&gt;
    &lt;div class=&quot;om-now&quot; role=&quot;status&quot;&gt;
      &lt;span&gt;&lt;strong&gt;이번 검토 범위&lt;/strong&gt; 목적 · 브랜치 전략&lt;/span&gt;
      &lt;span&gt;&lt;strong&gt;대표 사례&lt;/strong&gt; BANK-OM-001 · InstanceCode&lt;/span&gt;
      &lt;span&gt;&lt;strong&gt;다음 페이지&lt;/strong&gt; 검사기가 무엇을 판단하는지 먼저 확인&lt;/span&gt;
    &lt;/div&gt;
  &lt;/header&gt;

  &lt;aside class=&quot;om-page-scope&quot; aria-label=&quot;이 페이지가 답하는 질문과 범위&quot;&gt;
    &lt;div&gt;&lt;strong&gt;이 페이지가 답하는 질문&lt;/strong&gt;&lt;p&gt;공식 OpenMetadata를 계속 업데이트하면서 행내 커스터마이징을 어떤 branch 흐름으로 유지할 것인가?&lt;/p&gt;&lt;/div&gt;
    &lt;div&gt;&lt;strong&gt;여기서 답하지 않는 것&lt;/strong&gt;&lt;p&gt;Manifest 작성법, 검사기별 입력·판정 방법, 현재 검사 대상 코드의 실제 결과는 뒤 페이지에서 설명합니다.&lt;/p&gt;&lt;/div&gt;
    &lt;div&gt;&lt;strong&gt;읽고 나면&lt;/strong&gt;&lt;p&gt;2번에서 각 검사기가 이 흐름의 어느 위험을 확인하는지 봅니다.&lt;/p&gt;&lt;/div&gt;
  &lt;/aside&gt;
  &lt;p class=&quot;om-internal-scope&quot;&gt;&lt;strong&gt;우리 내부에서 정한 관리 방식:&lt;/strong&gt; &lt;code&gt;BANK-OM&lt;/code&gt; ID, OpenMetadata 포크·커스텀·릴리즈 브랜치와 이 반복 절차는 OpenMetadata가 기본 제공하는 화면이나 규칙이 아니라, 공식 코드를 행내 커스터마이징과 함께 유지하기 위해 이 프로젝트에서 정한 운영 방식입니다.&lt;/p&gt;

  &lt;section class=&quot;om-progress om-phase1-progress&quot; aria-label=&quot;1차 공유문서 구성&quot;&gt;
    &lt;article class=&quot;om-progress-done&quot;&gt;
      &lt;span&gt;1차 · 목적&lt;/span&gt;
      &lt;strong&gt;왜 필요한가&lt;/strong&gt;
      &lt;p&gt;자체 제품 개발이 아니라 공식 OpenMetadata와 행내 기능을 함께 유지하는 목적을 설명합니다.&lt;/p&gt;
    &lt;/article&gt;
    &lt;article&gt;
      &lt;span&gt;1차 · 브랜치 역할&lt;/span&gt;
      &lt;strong&gt;무엇을 어디에 보관하나&lt;/strong&gt;
      &lt;p&gt;공식 코드만 담은 OpenMetadata 포크 브랜치, BANK-OM을 합치는 커스텀 브랜치와 실제 운영에 쓰는 릴리즈 브랜치의 역할을 봅니다.&lt;/p&gt;
    &lt;/article&gt;
    &lt;article&gt;
      &lt;span&gt;1차 · 반복 절차&lt;/span&gt;
      &lt;strong&gt;어떻게 업그레이드하나&lt;/strong&gt;
      &lt;p&gt;새 공식 버전 병합, 충돌 해결, 검사, 배포할 코드 확정까지의 반복 흐름을 봅니다.&lt;/p&gt;
    &lt;/article&gt;
  &lt;/section&gt;

  &lt;nav class=&quot;viz-controls om-toc&quot; aria-label=&quot;가이드 목차&quot;&gt;
    &lt;a class=&quot;btn&quot; href=&quot;#purpose&quot;&gt;1. 우리의 목적&lt;/a&gt;
    &lt;a class=&quot;btn&quot; href=&quot;#branch&quot;&gt;2. 브랜치 전략&lt;/a&gt;
  &lt;/nav&gt;

  &lt;section id=&quot;purpose&quot; class=&quot;om-section&quot;&gt;
    &lt;div class=&quot;om-section-title&quot;&gt;
      &lt;span&gt;01&lt;/span&gt;
      &lt;div&gt;
        &lt;h2&gt;우리의 목적&lt;/h2&gt;
        &lt;p&gt;자체 제품을 새로 만드는 것이 아니라, 공식 OpenMetadata를 안전하게 계속 사용하는 것이 목적입니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;viz-grid om-purpose-grid&quot;&gt;
      &lt;article class=&quot;card&quot;&gt;
        &lt;span class=&quot;text-muted&quot;&gt;유지할 것&lt;/span&gt;
        &lt;strong&gt;공식 OpenMetadata&lt;/strong&gt;
        &lt;p&gt;공식 기능과 보안 업데이트를 계속 반영합니다.&lt;/p&gt;
      &lt;/article&gt;
      &lt;article class=&quot;card&quot;&gt;
        &lt;span class=&quot;text-muted&quot;&gt;보호할 것&lt;/span&gt;
        &lt;strong&gt;등록된 행내 기능&lt;/strong&gt;
        &lt;p&gt;각 기능을 BANK-OM ID별 독립 변경 기록으로 관리합니다.&lt;/p&gt;
      &lt;/article&gt;
      &lt;article class=&quot;card&quot;&gt;
        &lt;span class=&quot;text-muted&quot;&gt;증명할 것&lt;/span&gt;
        &lt;strong&gt;병합 후 생존과 실제 동작&lt;/strong&gt;
        &lt;p&gt;공식 버전 병합 뒤 BANK-OM 코드가 남았는지와 행내 환경 동작을 서로 다른 검사로 확인합니다.&lt;/p&gt;
      &lt;/article&gt;
    &lt;/div&gt;

    &lt;div class=&quot;om-repo-role&quot;&gt;
      &lt;div&gt;
        &lt;span&gt;현재 업그레이드·검사를 진행하는 코드 저장소&lt;/span&gt;
        &lt;strong&gt;easyseop/OM_TEMP&lt;/strong&gt;
        &lt;p&gt;공식 1.13.0과 BANK-OM-001~007을 바탕으로 1.13.1 검사 대상 코드를 만들고, 충돌·해결·검사를 연습합니다. 현재 결과는 BANK-OM 변경을 하나씩 적용해 충돌 위치를 확인한 연습 결과입니다. 아래에 설명하는 정식 병합 절차 전체를 완료했다는 뜻은 아닙니다.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;span&gt;검사 기준과 결과를 관리하는 저장소&lt;/span&gt;
        &lt;strong&gt;easyseop/openmetadata-test&lt;/strong&gt;
        &lt;p&gt;직원용 OpenMetadata 화면이 아니라, 각 BANK-OM의 변경 파일과 검사 기준을 기록한 Manifest, 검사기, 검사 결과, 가이드와 인수인계 문서를 관리합니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;branch&quot; class=&quot;om-section&quot;&gt;
    &lt;div class=&quot;om-section-title&quot;&gt;
      &lt;span&gt;02&lt;/span&gt;
      &lt;div&gt;
        &lt;h2&gt;브랜치 전략&lt;/h2&gt;
        &lt;p&gt;정식 운영에서는 직전 행내 코드에 새 공식 버전을 병합하는 방식을 사용합니다. 이 방식을 이 문서와 설정 파일에서는 &lt;code&gt;vendor-merge&lt;/code&gt;라고 부릅니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;p class=&quot;om-reading-order-note&quot;&gt;&lt;code&gt;fork/om-&amp;lt;version&amp;gt;&lt;/code&gt; OpenMetadata 포크 브랜치에는 행내 변경이 없는 공식 코드만 보관하고, &lt;code&gt;custom/om-&amp;lt;version&amp;gt;&lt;/code&gt; 커스텀 브랜치에는 공식 코드와 BANK-OM 변경을 함께 보관합니다. 검증과 운영 승인이 끝나면 &lt;code&gt;release/om-&amp;lt;version&amp;gt;&lt;/code&gt; 릴리즈 브랜치를 같은 commit으로 갱신하고 실제 운영 배포에 사용합니다. BANK-OM ID와 Manifest 작성 방법은 &lt;a href=&quot;../OM_TEMP_커밋별_Manifest_등록_가이드_미리보기.html&quot; target=&quot;_top&quot;&gt;3번 · 검사 전 사전환경 설정&lt;/a&gt;에서 설명합니다.&lt;/p&gt;

    &lt;div class=&quot;om-branch-legend&quot; aria-label=&quot;브랜치 색상 구분&quot;&gt;
      &lt;span class=&quot;om-swatch om-core-swatch&quot;&gt;&lt;/span&gt;&lt;span&gt;공식 버전과 OpenMetadata 포크 브랜치 · 공식 코드만 유지&lt;/span&gt;
      &lt;span class=&quot;om-swatch om-custom-swatch&quot;&gt;&lt;/span&gt;&lt;span&gt;BANK-OM 변경과 커스텀 브랜치 · 행내 변경 적용&lt;/span&gt;
    &lt;/div&gt;

    &lt;div class=&quot;om-branch-visual&quot;&gt;
      &lt;svg class=&quot;om-branch-svg&quot; viewBox=&quot;0 0 940 880&quot; role=&quot;img&quot; aria-labelledby=&quot;om-branch-title om-branch-desc&quot;&gt;
        &lt;title id=&quot;om-branch-title&quot;&gt;OpenMetadata 버전별 커스터마이징 반복 Cycle&lt;/title&gt;
        &lt;desc id=&quot;om-branch-desc&quot;&gt;새 공식 코드의 변경이 행내 기능에 미칠 영향을 T42로 먼저 확인하고, 오른쪽의 직전 행내 코드와 다음 버전의 custom branch에서 병합한다. 같은 코드 구간을 양쪽이 다르게 수정했다면 이 병합 지점에서 Git 충돌이 발생한다. 병합과 충돌 해결을 마친 최종 코드에서 plan, 담당자 승인, apply로 등록자료를 반영한 뒤 검사를 실행한다. 검사를 통과한 코드에는 검증 완료 표시를 붙인 뒤 다음 공식 버전에서 같은 과정을 반복한다.&lt;/desc&gt;
        &lt;defs&gt;
          &lt;marker id=&quot;om-arrow-core&quot; markerWidth=&quot;9&quot; markerHeight=&quot;9&quot; refX=&quot;8&quot; refY=&quot;4.5&quot; orient=&quot;auto&quot;&gt;
            &lt;path d=&quot;M0,0 L9,4.5 L0,9 z&quot; fill=&quot;var(--viz-series-1)&quot;/&gt;
          &lt;/marker&gt;
          &lt;marker id=&quot;om-arrow-custom&quot; markerWidth=&quot;9&quot; markerHeight=&quot;9&quot; refX=&quot;8&quot; refY=&quot;4.5&quot; orient=&quot;auto&quot;&gt;

            &lt;path d=&quot;M0,0 L9,4.5 L0,9 z&quot; fill=&quot;var(--viz-series-2)&quot;/&gt;
          &lt;/marker&gt;
          &lt;marker id=&quot;om-arrow-fail&quot; markerWidth=&quot;9&quot; markerHeight=&quot;9&quot; refX=&quot;8&quot; refY=&quot;4.5&quot; orient=&quot;auto&quot;&gt;

          &lt;/marker&gt;
        &lt;/defs&gt;

        &lt;path class=&quot;om-svg-path om-svg-core-line&quot; marker-end=&quot;url(#om-arrow-core)&quot; d=&quot;M410 92 C360 106 304 116 270 135&quot;/&gt;
        &lt;path class=&quot;om-svg-path om-svg-core-line&quot; d=&quot;M270 213 L270 235&quot;/&gt;
        &lt;path class=&quot;om-svg-path om-svg-core-line&quot; marker-end=&quot;url(#om-arrow-core)&quot; d=&quot;M280 269 C300 282 362 287 400 295&quot;/&gt;
        &lt;path class=&quot;om-svg-path om-svg-custom-line&quot; marker-end=&quot;url(#om-arrow-custom)&quot; d=&quot;M680 223 C680 260 572 278 530 295&quot;/&gt;
        &lt;path class=&quot;om-svg-path om-svg-custom-line&quot; marker-end=&quot;url(#om-arrow-custom)&quot; d=&quot;M465 415 L465 455&quot;/&gt;
        &lt;path class=&quot;om-svg-path om-svg-neutral-line&quot; marker-end=&quot;url(#om-arrow-core)&quot; d=&quot;M465 525 L465 565&quot;/&gt;

    &lt;div class=&quot;om-branch-after&quot;&gt;
      &lt;p&gt;&lt;strong&gt;그림에서 무엇과 무엇이 합쳐지나?&lt;/strong&gt; 새 공식 코드만 담은 OpenMetadata 포크 브랜치와, 직전 공식 코드에 BANK-OM 변경을 적용한 커스텀 브랜치가 합쳐집니다. 결과는 새 공식 버전과 행내 기능이 함께 들어 있는 다음 버전의 커스텀 브랜치입니다.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;왜 T42를 병합 전에 실행하나?&lt;/strong&gt; 새 공식 버전이 Manifest의 &lt;code&gt;watch&lt;/code&gt; 경로를 바꿨는지 먼저 찾아, 영향을 받을 BANK-OM ID와 검토할 파일을 병합 전에 알기 위해서입니다. 결과가 &lt;code&gt;APPROVAL&lt;/code&gt;이면 담당자가 영향 내용을 확인합니다. 새 공식 버전과 최종 커스텀 브랜치가 확정된 뒤 준비도구의 &lt;code&gt;plan → 담당자 승인 → apply&lt;/code&gt;로 필요한 Manifest와 파생 등록자료를 갱신합니다. T42가 Git 충돌을 해결하거나 등록자료를 직접 수정하는 것은 아닙니다.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Git 충돌은 어디서 발생하나?&lt;/strong&gt; 양쪽 코드가 같은 부분을 서로 다르게 수정했을 때 ③ 병합 단계에서 발생합니다. 담당자가 어느 내용을 유지할지 확인해 다음 &lt;code&gt;custom&lt;/code&gt; branch에서 수정하고, 그 해결 내용을 Git 변경 기록으로 남깁니다.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;충돌 해결 때 새 BANK-OM을 만드는가?&lt;/strong&gt; 기존 기능을 새 공식 버전에 맞춘 것이라면 같은 BANK-OM ID를 사용합니다. 기존 Manifest를 새 버전 등록 묶음으로 복사해 다시 검토하고, 해결 과정에서 변경 범위나 검증 기준이 달라진 항목만 갱신합니다. 별도 업무 기능이 생겼을 때만 새 ID와 Manifest를 만듭니다.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;검사 BLOCK은 무엇이 다른가?&lt;/strong&gt; Git 병합은 끝났지만 Manifest 범위, 필수 구현, 테스트 또는 승인 조건을 통과하지 못한 경우입니다. 이때도 다음 &lt;code&gt;custom&lt;/code&gt; branch를 보완하지만 Git 병합 충돌과는 다른 문제입니다.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;검사를 통과하면 바로 배포하는가?&lt;/strong&gt; 아닙니다. 먼저 검사에 통과한 정확한 코드에 검증 완료 태그를 붙입니다. 전체 빌드, 행내 API·화면·DB 테스트, Release lock, 담당자 승인과 실제 배포 파일 일치를 확인한 뒤 릴리즈 브랜치가 같은 commit을 가리키게 합니다. 실제 운영 배포는 이 릴리즈 브랜치를 사용합니다.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;현재 OM_TEMP 연습은 이 그림과 완전히 같은가?&lt;/strong&gt; 아닙니다. 현재는 어느 BANK-OM에서 충돌하는지 확인하기 위해 변경 기록을 하나씩 적용했습니다. 따라서 BANK-OM별 충돌 진단 결과는 있지만, 위 정식 병합 절차 전체를 검증한 결과는 아닙니다.&lt;/p&gt;
    &lt;/div&gt;

      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {

          return;
        }

  const openTooltip = (trigger) =&gt; {

  document.addEventListener(&quot;pointerout&quot;, handleLeave);
