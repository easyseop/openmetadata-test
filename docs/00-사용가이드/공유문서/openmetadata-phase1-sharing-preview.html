  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;om-guide-v3&quot; data-artifact-status=&quot;review-draft&quot;&gt;
  &lt;nav class=&quot;guide-pagination&quot; aria-label=&quot;가이드 페이지 이동&quot;&gt;
    &lt;span class=&quot;guide-page-link is-disabled&quot; aria-disabled=&quot;true&quot;&gt;
      &lt;small&gt;← 이전 가이드&lt;/small&gt;
      &lt;strong&gt;첫 페이지&lt;/strong&gt;
    &lt;/span&gt;
    &lt;div class=&quot;guide-page-current&quot;&gt;
      &lt;small&gt;전체 5개 중&lt;/small&gt;
      &lt;strong&gt;1 · 목적과 브랜치 전략&lt;/strong&gt;
    &lt;/div&gt;
    &lt;a class=&quot;guide-page-link is-next&quot; href=&quot;openmetadata-phase2-verifier-table-preview.html&quot; target=&quot;_top&quot;&gt;
      &lt;small&gt;다음 가이드 →&lt;/small&gt;
      &lt;strong&gt;검사기 원리&lt;/strong&gt;
    &lt;/a&gt;
  &lt;/nav&gt;

  &lt;header class=&quot;om-hero&quot;&gt;
    &lt;span class=&quot;viz-badge&quot;&gt;1차 공유문서 검토본&lt;/span&gt;
    &lt;h1&gt;공식 업그레이드 뒤에도 행내 기능을 잃지 않는 방법&lt;/h1&gt;
    &lt;p&gt;공식 원본 위에 BANK-OM 변경을 다시 적용하고, 검사기로 누락·혼합·동작 여부를 단계별 확인합니다.&lt;/p&gt;
    &lt;div class=&quot;om-now&quot; role=&quot;status&quot;&gt;
      &lt;span&gt;&lt;strong&gt;이번 검토 범위&lt;/strong&gt; 목적 · 브랜치 전략&lt;/span&gt;
      &lt;span&gt;&lt;strong&gt;대표 사례&lt;/strong&gt; BANK-OM-001 · InstanceCode&lt;/span&gt;
      &lt;span&gt;&lt;strong&gt;다음 페이지&lt;/strong&gt; 검사기가 무엇을 판단하는지 먼저 확인&lt;/span&gt;
    &lt;/div&gt;
  &lt;/header&gt;

  &lt;section class=&quot;om-progress om-phase1-progress&quot; aria-label=&quot;1차 공유문서 구성&quot;&gt;
    &lt;article class=&quot;om-progress-done&quot;&gt;
      &lt;span&gt;1차 · 검토 중&lt;/span&gt;
      &lt;strong&gt;왜 필요한가&lt;/strong&gt;
      &lt;p&gt;자체 제품 개발이 아니라 공식 OpenMetadata와 행내 기능을 함께 유지하는 목적을 설명합니다.&lt;/p&gt;
    &lt;/article&gt;
    &lt;article&gt;
      &lt;span&gt;1차 · 검토 중&lt;/span&gt;
      &lt;strong&gt;무엇을 관리해야 하나&lt;/strong&gt;
      &lt;p&gt;BANK-OM ID와 변경 기록이 branch 전략에서 어떤 역할을 하는지 먼저 봅니다.&lt;/p&gt;
    &lt;/article&gt;
    &lt;article&gt;
      &lt;span&gt;1차 · 검토 중&lt;/span&gt;
      &lt;strong&gt;어떻게 업그레이드하나&lt;/strong&gt;
      &lt;p&gt;공식 원본에서 제품 작업 브랜치, 검사 후보, 승인·행내 반영까지의 흐름을 도식으로 봅니다.&lt;/p&gt;
    &lt;/article&gt;
  &lt;/section&gt;

  &lt;nav class=&quot;viz-controls om-toc&quot; aria-label=&quot;가이드 목차&quot;&gt;
    &lt;a class=&quot;btn&quot; href=&quot;#purpose&quot;&gt;1. 우리의 목적&lt;/a&gt;
    &lt;a class=&quot;btn&quot; href=&quot;#branch&quot;&gt;2. 브랜치 전략&lt;/a&gt;
    &lt;a class=&quot;btn&quot; href=&quot;#appendix&quot;&gt;부록 · 가장 많이 묻는 질문&lt;/a&gt;
  &lt;/nav&gt;

  &lt;section id=&quot;purpose&quot; class=&quot;om-section&quot;&gt;
    &lt;div class=&quot;om-section-title&quot;&gt;
      &lt;span&gt;01&lt;/span&gt;
      &lt;div&gt;
        &lt;h2&gt;우리의 목적&lt;/h2&gt;
        &lt;p&gt;자체 제품을 새로 만드는 것이 아니라, 공식 OpenMetadata를 안전하게 계속 사용하는 것이 목적입니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;viz-grid om-purpose-grid&quot;&gt;
      &lt;article class=&quot;card&quot;&gt;
        &lt;span class=&quot;text-muted&quot;&gt;유지할 것&lt;/span&gt;
        &lt;strong&gt;공식 OpenMetadata&lt;/strong&gt;
        &lt;p&gt;공식 기능과 보안 업데이트를 계속 반영합니다.&lt;/p&gt;
      &lt;/article&gt;
      &lt;article class=&quot;card&quot;&gt;
        &lt;span class=&quot;text-muted&quot;&gt;보호할 것&lt;/span&gt;
        &lt;strong&gt;등록된 행내 기능&lt;/strong&gt;
        &lt;p&gt;각 기능을 BANK-OM ID별 독립 변경 기록으로 관리합니다.&lt;/p&gt;
      &lt;/article&gt;
      &lt;article class=&quot;card&quot;&gt;
        &lt;span class=&quot;text-muted&quot;&gt;증명할 것&lt;/span&gt;
        &lt;strong&gt;재적용과 실제 동작&lt;/strong&gt;
        &lt;p&gt;코드 재적용 결과와 행내 환경 동작을 서로 다른 검사로 확인합니다.&lt;/p&gt;
      &lt;/article&gt;
    &lt;/div&gt;

    &lt;div class=&quot;om-repo-role&quot;&gt;
      &lt;div&gt;
        &lt;span&gt;행내 배포를 준비하는 OpenMetadata 코드&lt;/span&gt;
        &lt;strong&gt;easyseop/OpenMetadata&lt;/strong&gt;
        &lt;p&gt;&lt;code&gt;codex/bank-vendor-1.13.1-rebuild&lt;/code&gt; 브랜치의 &lt;code&gt;849ae756…&lt;/code&gt;에 11개 활성 BANK-OM 변경이 적용돼 있습니다. 아직 운영 배포가 확인된 코드라고 표현하지 않습니다.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;span&gt;제품 변경을 관리·검사하는 저장소&lt;/span&gt;
        &lt;strong&gt;easyseop/openmetadata-test&lt;/strong&gt;
        &lt;p&gt;직원용 별도 화면이 아니라 변경관리표, 검사기, 검사 결과와 인수인계 문서를 관리합니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;details class=&quot;om-watch-guide&quot;&gt;
      &lt;summary&gt;왜 easyseop/OpenMetadata 화면에서 행내 정보가 안 보이나?&lt;/summary&gt;
      &lt;ol&gt;
        &lt;li&gt;&lt;b&gt;보고 있는 브랜치가 다를 수 있습니다.&lt;/b&gt; 현재 행내 코드는 기본 브랜치가 아니라 &lt;code&gt;codex/bank-vendor-1.13.1-rebuild&lt;/code&gt; 브랜치에 있습니다.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;제품 저장소에는 실제 코드가 들어갑니다.&lt;/b&gt; &lt;code&gt;InstanceCodeResource.java&lt;/code&gt; 같은 코드와 각 Git 커밋 메시지의 &lt;code&gt;Customization-ID&lt;/code&gt;가 기록됩니다.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;BANK-OM 변경관리표와 검사 결과는 검사 저장소에 있습니다.&lt;/b&gt; Manifest·검사기·인수인계 문서는 &lt;code&gt;easyseop/openmetadata-test&lt;/code&gt;에서 관리합니다.&lt;/li&gt;
      &lt;/ol&gt;
      &lt;p&gt;따라서 제품 저장소에서 BANK-OM 문서를 찾는 것이 아니라, 해당 제품 브랜치의 실제 코드·커밋 이력과 검사 저장소의 변경관리표를 함께 확인해야 합니다.&lt;/p&gt;
    &lt;/details&gt;
  &lt;/section&gt;

  &lt;section id=&quot;branch&quot; class=&quot;om-section&quot;&gt;
    &lt;div class=&quot;om-section-title&quot;&gt;
      &lt;span&gt;02&lt;/span&gt;
      &lt;div&gt;
        &lt;h2&gt;브랜치 전략&lt;/h2&gt;
        &lt;p&gt;공식 원본과 행내 변경 기록을 따로 관리하고, 업그레이드 때마다 새 공식 원본 위에 행내 변경을 순서대로 적용해 검사 대상 후보를 만듭니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;om-preflight-diagram&quot; aria-label=&quot;브랜치 전략을 이해하기 위한 사전 정보&quot;&gt;
      &lt;strong&gt;브랜치 전략을 이해하기 위한 사전 정보&lt;/strong&gt;
      &lt;p class=&quot;om-reading-order-note&quot;&gt;여기서는 BANK-OM ID·변경관리표·커밋 메시지가 branch 흐름에 어떻게 연결되는지만 간단히 봅니다. 실제 작성 기준과 등록 절차는 &lt;a href=&quot;../OM_TEMP_커밋별_Manifest_등록_가이드_미리보기.html&quot; target=&quot;_top&quot;&gt;3번 · 검사 전 사전환경 설정&lt;/a&gt;에서 설명합니다. 그 전에 2번에서 검사기 원리를 먼저 읽는 이유는 각 설정값이 어느 검사에 사용되는지 이해하기 위해서입니다.&lt;/p&gt;
      &lt;div class=&quot;om-preflight-row&quot;&gt;
        &lt;details class=&quot;om-preflight-step&quot;&gt;
          &lt;summary&gt;&lt;span&gt;1&lt;/span&gt;&lt;b&gt;BANK-OM ID 발급&lt;/b&gt;&lt;/summary&gt;
          &lt;pre&gt;&lt;code&gt;customization_id: BANK-OM-001
title: InstanceCode
kind: core-patch
status: active&lt;/code&gt;&lt;/pre&gt;
          &lt;div class=&quot;om-manifest-mini&quot; aria-label=&quot;변경 유형 종류&quot;&gt;
            &lt;div&gt;&lt;code&gt;core-patch&lt;/code&gt;&lt;span&gt;제품 코드에 결합되는 변경&lt;/span&gt;&lt;/div&gt;
            &lt;div&gt;&lt;code&gt;extension&lt;/code&gt;&lt;span&gt;공식 코드와 분리된 확장&lt;/span&gt;&lt;/div&gt;
            &lt;div&gt;&lt;code&gt;governance&lt;/code&gt;&lt;span&gt;검사기·정책 변경&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/details&gt;
        &lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;
        &lt;details class=&quot;om-preflight-step&quot;&gt;
          &lt;summary&gt;&lt;span&gt;2&lt;/span&gt;&lt;b&gt;변경관리표 작성&lt;/b&gt;&lt;/summary&gt;
          &lt;pre&gt;&lt;code&gt;implementation:
  allowed_changed_paths:
    - .../Entity.java
    - .../CollectionDAO.java

  required_changed_paths:
    - .../InstanceCodeResource.java
    - .../instanceCode.json

upgrade_watch:
  paths: []&lt;/code&gt;&lt;/pre&gt;
          &lt;div class=&quot;om-manifest-mini&quot; aria-label=&quot;변경관리표 내부 항목&quot;&gt;
            &lt;div&gt;&lt;code&gt;allowed&lt;/code&gt;&lt;span&gt;전체 변경 · 누락 시 담당자 확인&lt;/span&gt;&lt;/div&gt;
            &lt;div&gt;&lt;code&gt;required&lt;/code&gt;&lt;span&gt;행내 필수 파일 · 누락 시 즉시 실패&lt;/span&gt;&lt;/div&gt;
            &lt;div&gt;&lt;code&gt;watch&lt;/code&gt;&lt;span&gt;미수정 의존 파일 · 변경 시 담당자 확인&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/details&gt;
        &lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;
        &lt;details class=&quot;om-preflight-step&quot;&gt;
          &lt;summary&gt;&lt;span&gt;3&lt;/span&gt;&lt;b&gt;커밋 메시지 작성&lt;/b&gt;&lt;/summary&gt;
          &lt;pre&gt;&lt;code&gt;git commit \
  -m &quot;add InstanceCode&quot; \
  -m &quot;Customization-ID: BANK-OM-001&quot;&lt;/code&gt;&lt;/pre&gt;
        &lt;/details&gt;
      &lt;/div&gt;

      &lt;div class=&quot;om-repo-role om-implementation-status&quot; aria-label=&quot;현재 검사기와 개선 예정 구분&quot;&gt;
        &lt;div&gt;
          &lt;span&gt;현재 방식 · 검사기 동작 중&lt;/span&gt;
          &lt;strong&gt;같은 파일을 두 곳에 적어야 함&lt;/strong&gt;
          &lt;pre&gt;&lt;code&gt;allowed: Entity.java  # 우리가 수정함
watch:   Entity.java  # 공식 버전 변경도 확인&lt;/code&gt;&lt;/pre&gt;
          &lt;p&gt;BANK-OM-001은 이 방식으로 공식 공용 파일 3개를 중복 등록했고, T42 검사기가 공식 업그레이드 때 변경 여부를 확인합니다.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;span&gt;개선 후 · 추가 개발 대상&lt;/span&gt;
          &lt;strong&gt;변경 파일에는 한 번만 적음&lt;/strong&gt;
          &lt;pre&gt;&lt;code&gt;allowed: Entity.java
# 공식 버전 변경 확인은 검사기가 자동 처리&lt;/code&gt;&lt;/pre&gt;
          &lt;p&gt;검사기가 “공식 원본에도 있던 파일”임을 알아내 자동으로 업그레이드 전후를 비교합니다. 수동 &lt;code&gt;watch&lt;/code&gt;에는 우리가 수정하지 않은 의존 파일만 적습니다.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;details class=&quot;om-watch-guide&quot;&gt;
        &lt;summary&gt;변경관리표에는 무엇을 왜 적나?&lt;/summary&gt;
        &lt;div class=&quot;table-responsive&quot;&gt;
          &lt;table class=&quot;table table-sm&quot;&gt;
            &lt;thead&gt;
              &lt;tr&gt;&lt;th&gt;사람이 이해할 이름&lt;/th&gt;&lt;th&gt;무엇을 적나?&lt;/th&gt;&lt;th&gt;검사기는 왜 필요한가?&lt;/th&gt;&lt;/tr&gt;
            &lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;
                &lt;td&gt;업무 기능 번호 &lt;code&gt;customization_id&lt;/code&gt;&lt;/td&gt;
                &lt;td&gt;미사용 BANK-OM 번호&lt;/td&gt;
                &lt;td&gt;코드·테스트·결과를 같은 기능으로 연결&lt;/td&gt;
              &lt;/tr&gt;
              &lt;tr&gt;
                &lt;td&gt;변경 유형 &lt;code&gt;kind&lt;/code&gt;&lt;/td&gt;
                &lt;td&gt;제품 코드·분리 확장·검사 정책 중 하나&lt;/td&gt;
                &lt;td&gt;변경이 속한 영역을 확인&lt;/td&gt;
              &lt;/tr&gt;
              &lt;tr&gt;
                &lt;td&gt;실제 변경 파일 &lt;code&gt;allowed&lt;/code&gt;&lt;/td&gt;
                &lt;td&gt;이 기능이 변경한 파일 전체&lt;/td&gt;
                &lt;td&gt;명단 밖 변경은 실패, 명단 안 누락은 담당자 확인&lt;/td&gt;

                &lt;td&gt;즉시 실패 파일 &lt;code&gt;required&lt;/code&gt;&lt;/td&gt;
                &lt;td&gt;누락만으로 기능 소실을 확정할 필수 파일&lt;/td&gt;
                &lt;td&gt;파일·변경이 없으면 즉시 실패&lt;/td&gt;
              &lt;/tr&gt;
              &lt;tr&gt;
                &lt;td&gt;미수정 의존 파일 &lt;code&gt;watch&lt;/code&gt;&lt;/td&gt;
                &lt;td&gt;수정하지 않았지만 행내 기능이 의존하는 파일&lt;/td&gt;
                &lt;td&gt;공식 버전에서 바뀌면 담당자 확인&lt;/td&gt;
              &lt;/tr&gt;
              &lt;tr&gt;
                &lt;td&gt;동작 검사 &lt;code&gt;contracts&lt;/code&gt;·&lt;code&gt;direct_tests&lt;/code&gt;&lt;/td&gt;
                &lt;td&gt;업무 동작·기술 테스트 이름&lt;/td&gt;
                &lt;td&gt;테스트 누락·실패 시 통과 금지&lt;/td&gt;
              &lt;/tr&gt;
              &lt;tr&gt;
                &lt;td&gt;적용 순서 &lt;code&gt;series&lt;/code&gt;·&lt;code&gt;depends_on&lt;/code&gt;&lt;/td&gt;
                &lt;td&gt;후속 커밋 허용 여부와 선행 BANK-OM&lt;/td&gt;
                &lt;td&gt;순서·의존관계가 틀리면 실패&lt;/td&gt;

        &lt;div class=&quot;om-scope-compare&quot;&gt;
          &lt;div&gt;
            &lt;span&gt;1단계 · 모두 적기&lt;/span&gt;
            &lt;strong&gt;실제 변경 파일 48개&lt;/strong&gt;
            &lt;p&gt;“BANK-OM-001은 어느 파일들을 변경했나?”에 답합니다.&lt;/p&gt;
          &lt;/div&gt;
          &lt;b aria-hidden=&quot;true&quot;&gt;48개 중 2개는 즉시 실패 →&lt;/b&gt;
          &lt;div&gt;
            &lt;span&gt;2단계 · 즉시 실패 표시&lt;/span&gt;
            &lt;strong&gt;필수 대표 파일 2개&lt;/strong&gt;
            &lt;p&gt;“어느 파일이 빠지면 기능의 필수 부품이 사라진 것인가?”에 답합니다.&lt;/p&gt;

          &lt;table class=&quot;table table-sm om-scope-example&quot;&gt;

              &lt;tr&gt;&lt;th&gt;BANK-OM-001 실제 파일&lt;/th&gt;&lt;th&gt;전체 명단&lt;/th&gt;&lt;th&gt;즉시 실패 표시&lt;/th&gt;&lt;th&gt;이렇게 정한 이유&lt;/th&gt;&lt;/tr&gt;
            &lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;
                &lt;td&gt;&lt;code&gt;InstanceCodeResource.java&lt;/code&gt;&lt;/td&gt;
                &lt;td&gt;예&lt;/td&gt;
                &lt;td&gt;&lt;b&gt;예&lt;/b&gt;&lt;/td&gt;
                &lt;td&gt;InstanceCode API 전용 파일이라 없어지면 API 자체가 없어졌다고 바로 판단 가능&lt;/td&gt;
              &lt;/tr&gt;

                &lt;td&gt;&lt;code&gt;instanceCode.json&lt;/code&gt;&lt;/td&gt;
                &lt;td&gt;예&lt;/td&gt;
                &lt;td&gt;&lt;b&gt;예&lt;/b&gt;&lt;/td&gt;
                &lt;td&gt;InstanceCode 데이터 구조 전용 파일이라 없어지면 엔터티 정의가 성립하지 않음&lt;/td&gt;

                &lt;td&gt;&lt;code&gt;Entity.java&lt;/code&gt;&lt;/td&gt;

                &lt;td&gt;아니오&lt;/td&gt;
                &lt;td&gt;여러 기능이 함께 쓰는 파일이라 파일 전체가 달라 보이는 것만으로 INSTANCE_CODE 코드가 남았다고 증명할 수 없음. 업그레이드 전후 코드 비교와 실제 동작 검사로 확인&lt;/td&gt;
              &lt;/tr&gt;
              &lt;tr&gt;
                &lt;td&gt;&lt;code&gt;ko-kr.json&lt;/code&gt;&lt;/td&gt;
                &lt;td&gt;예&lt;/td&gt;
                &lt;td&gt;아니오&lt;/td&gt;
                &lt;td&gt;번역 누락은 결함이므로 검토 대상이지만, 그 파일 하나만으로 InstanceCode 전체가 사라졌다고 단정하지 않음&lt;/td&gt;
              &lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;
        &lt;div class=&quot;om-required-rule&quot;&gt;
          &lt;strong&gt;보통 어떤 파일을 “없으면 즉시 실패”로 정하나?&lt;/strong&gt;
          &lt;ol&gt;
            &lt;li&gt;행내 기능을 위해 새로 만든 Resource·Mapper·스키마처럼 전용 역할이 명확한 파일&lt;/li&gt;
            &lt;li&gt;그 파일이 없거나 공식 원본 상태면 기능의 필수 구성요소가 실제로 빠졌다고 단정할 수 있어야 함&lt;/li&gt;
            &lt;li&gt;다른 BANK-OM 변경 때문에 파일 전체가 달라 보이는 공용 파일은 경로만으로 증명하지 않고 코드·계약 검사로 확인&lt;/li&gt;
            &lt;li&gt;왜 즉시 실패해야 하는지 변경관리표 검토 기록에 남기고 코드 책임자가 승인&lt;/li&gt;
          &lt;/ol&gt;
        &lt;/div&gt;
        &lt;p&gt;&lt;b&gt;추측으로 넣지 않습니다.&lt;/b&gt; Git이 보여주는 공식 원본과 행내본의 실제 파일 차이, 공용 파일 안에서 각 BANK-OM이 수정한 코드 구간, 코드 연결 관계, 동작·기술 테스트와 코드 책임자 승인으로 결정합니다.&lt;/p&gt;
      &lt;/details&gt;
      &lt;details class=&quot;om-code-evidence&quot;&gt;
        &lt;summary&gt;사전 설정 실제 코드 참고 · BANK-OM-001&lt;/summary&gt;
        &lt;p class=&quot;text-small text-muted&quot;&gt;출처: &lt;a href=&quot;https://github.com/easyseop/OpenMetadata/commit/a2566fac322c877a645046264c8ae99df103f794&quot;&gt;실제 커밋 a2566fac…&lt;/a&gt;. 전체 48개 변경 경로 중 사전 설정 관계를 설명하는 핵심 파일 4개만 표시합니다.&lt;/p&gt;

        &lt;details class=&quot;om-file-evidence&quot;&gt;
          &lt;summary&gt;&lt;code&gt;Entity.java&lt;/code&gt; · 공식 공용 코드 수정 · 전체 48개 명단에 들어가는 이유&lt;/summary&gt;
          &lt;pre&gt;&lt;code&gt;@@ 기존 Entity 종류 목록
 public static final String FILE = &quot;file&quot;;
 public static final String WORKSHEET = &quot;worksheet&quot;;
&lt;ins&gt;+public static final String INSTANCE_CODE = &quot;instanceCode&quot;;&lt;/ins&gt;&lt;/code&gt;&lt;/pre&gt;
          &lt;p&gt;공식 제품의 Entity 목록에 행내 기능 이름을 등록한 실제 변경입니다. 그래서 “BANK-OM-001이 실제로 바꾼 파일 전체 명단”(&lt;code&gt;allowed&lt;/code&gt;)에 들어갑니다. 1차 개선을 적용하면 공식 원본에도 있던 파일이라는 사실을 검사기가 판별해 업그레이드 전후 변경 여부도 자동 비교합니다.&lt;/p&gt;
        &lt;/details&gt;

        &lt;details class=&quot;om-file-evidence&quot;&gt;
          &lt;summary&gt;&lt;code&gt;InstanceCodeResource.java&lt;/code&gt; · 신규 파일 · 즉시 실패 2개에도 들어가는 이유&lt;/summary&gt;
          &lt;pre&gt;&lt;code&gt;@@ 신규 파일
&lt;ins&gt;+@Path(&quot;/v1/instanceCodes&quot;)&lt;/ins&gt;
&lt;ins&gt;+@Collection(name = &quot;instanceCodes&quot;)&lt;/ins&gt;
&lt;ins&gt;+public class InstanceCodeResource&lt;/ins&gt;
&lt;ins&gt;+    extends EntityResource&amp;lt;InstanceCode, InstanceCodeRepository&amp;gt; {&lt;/ins&gt;
&lt;ins&gt;+  public static final String COLLECTION_PATH = &quot;/v1/instanceCodes/&quot;;&lt;/ins&gt;
&lt;ins&gt;+  // 이하 실제 CRUD API 메서드는 화면에서 생략&lt;/ins&gt;&lt;/code&gt;&lt;/pre&gt;
          &lt;p&gt;공식 원본에는 없던 InstanceCode API 전용 파일입니다. 따라서 “실제 변경 파일 전체 명단”(&lt;code&gt;allowed&lt;/code&gt;)에 들어갑니다. 이 파일이 없으면 API 자체가 사라지므로 “없으면 즉시 실패” 표시(&lt;code&gt;required&lt;/code&gt;)도 함께 붙습니다.&lt;/p&gt;
        &lt;/details&gt;

        &lt;details class=&quot;om-file-evidence&quot;&gt;
          &lt;summary&gt;&lt;code&gt;InstanceCodeRepository.java&lt;/code&gt; · 신규 파일 · 공용 코드 연결을 확인하는 이유&lt;/summary&gt;
          &lt;pre&gt;&lt;code&gt;@@ 신규 파일
&lt;ins&gt;+public class InstanceCodeRepository&lt;/ins&gt;
&lt;ins&gt;+    extends EntityRepository&amp;lt;InstanceCode&amp;gt; {&lt;/ins&gt;
&lt;ins&gt;+  public InstanceCodeRepository() {&lt;/ins&gt;
&lt;ins&gt;+    super(&lt;/ins&gt;
&lt;ins&gt;+        InstanceCodeResource.COLLECTION_PATH,&lt;/ins&gt;
&lt;ins&gt;+        Entity.INSTANCE_CODE,&lt;/ins&gt;
&lt;ins&gt;+        InstanceCode.class,&lt;/ins&gt;
&lt;ins&gt;+        Entity.getCollectionDAO().instanceCodeDAO(),&lt;/ins&gt;
&lt;ins&gt;+        &quot;&quot;,&lt;/ins&gt;
&lt;ins&gt;+        &quot;&quot;);&lt;/ins&gt;
&lt;ins&gt;+  }&lt;/ins&gt;
&lt;ins&gt;+  // 이하 실제 저장·수정 메서드는 화면에서 생략&lt;/ins&gt;&lt;/code&gt;&lt;/pre&gt;
          &lt;p&gt;신규 저장 처리 코드가 공식 공용 코드의 &lt;code&gt;CollectionDAO.instanceCodeDAO()&lt;/code&gt;를 직접 사용합니다. 따라서 공식 버전에서 DAO 연결 방식이 바뀌면 InstanceCode 연결도 다시 확인해야 합니다.&lt;/p&gt;
        &lt;/details&gt;

        &lt;details class=&quot;om-file-evidence&quot;&gt;
          &lt;summary&gt;&lt;code&gt;CollectionDAO.java&lt;/code&gt; · 공식 공용 코드 수정 · 개선 후 자동 비교 대상&lt;/summary&gt;
          &lt;pre&gt;&lt;code&gt;@@ DAO 생성 메서드 추가
&lt;ins&gt;+@CreateSqlObject&lt;/ins&gt;
&lt;ins&gt;+InstanceCodeDAO instanceCodeDAO();&lt;/ins&gt;

@@ DAO 인터페이스 추가
&lt;ins&gt;+interface InstanceCodeDAO extends EntityDAO&amp;lt;InstanceCode&amp;gt; {&lt;/ins&gt;
&lt;ins&gt;+  default String getTableName() {&lt;/ins&gt;
&lt;ins&gt;+    return &quot;instance_code_entity&quot;;&lt;/ins&gt;
&lt;ins&gt;+  }&lt;/ins&gt;
&lt;ins&gt;+  default Class&amp;lt;InstanceCode&amp;gt; getEntityClass() {&lt;/ins&gt;
&lt;ins&gt;+    return InstanceCode.class;&lt;/ins&gt;
&lt;ins&gt;+  }&lt;/ins&gt;
&lt;ins&gt;+}&lt;/ins&gt;&lt;/code&gt;&lt;/pre&gt;
          &lt;p&gt;이번 커밋이 실제로 수정한 공식 공용 코드 파일이므로 “실제 변경 파일 전체 명단”(&lt;code&gt;allowed&lt;/code&gt;)에 들어갑니다. 1차 개선을 적용하면 검사기가 업그레이드 전후도 자동 비교하므로 사용자가 수동 감시 목록에 같은 경로를 또 적지 않습니다.&lt;/p&gt;
        &lt;/details&gt;

        &lt;section class=&quot;om-evidence-part&quot;&gt;
          &lt;strong&gt;네 파일을 보고 만드는 사전 설정&lt;/strong&gt;
          &lt;p&gt;&lt;code&gt;Entity.java&lt;/code&gt;, &lt;code&gt;CollectionDAO.java&lt;/code&gt; 수정과 신규 InstanceCode 파일들은 하나의 업무 기능이므로 &lt;code&gt;BANK-OM-001&lt;/code&gt;로 묶습니다. 먼저 실제 변경 파일 48개를 전부 기록합니다. 그중 필수 부품이 사라졌다고 즉시 판단 가능한 2개에는 실패 표시를 붙입니다. 1차 개선을 적용하면 48개 중 공식 원본에도 있던 파일은 검사기가 업그레이드 전후를 자동 비교하고, 수동 감시는 48개 밖의 의존 파일에만 사용합니다.&lt;/p&gt;
          &lt;pre&gt;&lt;code&gt;add InstanceCode customization

Customization-ID: BANK-OM-001&lt;/code&gt;&lt;/pre&gt;
          &lt;p&gt;마지막으로 같은 ID를 실제 커밋 메시지에 기록합니다. 저장 후 Git이 &lt;code&gt;a2566fac…&lt;/code&gt;라는 SHA를 자동 생성합니다.&lt;/p&gt;
        &lt;/section&gt;
      &lt;/details&gt;
      &lt;p&gt;&lt;b&gt;ID는 관리 담당자가 ID 대장에서 다음 미사용 번호를 발급합니다.&lt;/b&gt; LLM이나 Git이 만드는 값이 아닙니다. &lt;code&gt;kind&lt;/code&gt;는 실제 검사기 스키마가 허용하는 &lt;code&gt;core-patch&lt;/code&gt;·&lt;code&gt;extension&lt;/code&gt;·&lt;code&gt;governance&lt;/code&gt; 중 하나만 사용합니다. 변경관리표는 실제 코드 근거와 검토를 거쳐 작성하며, Git 커밋 식별값(SHA)만 Git이 저장할 때 자동 생성합니다.&lt;/p&gt;
    &lt;/div&gt;

        &lt;rect class=&quot;om-svg-node om-svg-core-node&quot; x=&quot;320&quot; y=&quot;134&quot; width=&quot;280&quot; height=&quot;78&quot; rx=&quot;24&quot;/&gt;
        &lt;text class=&quot;om-svg-label om-svg-center om-svg-strong&quot; x=&quot;460&quot; y=&quot;166&quot;&gt;② patch branch&lt;/text&gt;

        &lt;rect class=&quot;om-svg-node om-svg-custom-node&quot; x=&quot;300&quot; y=&quot;252&quot; width=&quot;320&quot; height=&quot;78&quot; rx=&quot;24&quot;/&gt;

        &lt;text class=&quot;om-svg-muted om-svg-center&quot; x=&quot;460&quot; y=&quot;308&quot;&gt;patch와 같은 공식 코드에서 branch 생성&lt;/text&gt;

        &lt;polygon class=&quot;om-svg-node om-svg-candidate-node&quot; points=&quot;460,365 560,420 460,475 360,420&quot;/&gt;
        &lt;text class=&quot;om-svg-label om-svg-center om-svg-strong&quot; x=&quot;460&quot; y=&quot;409&quot;&gt;④ BANK-OM&lt;/text&gt;
        &lt;text class=&quot;om-svg-label om-svg-center om-svg-strong&quot; x=&quot;460&quot; y=&quot;430&quot;&gt;commit 재적용&lt;/text&gt;
        &lt;text class=&quot;om-svg-fail-text&quot; x=&quot;460&quot; y=&quot;452&quot;&gt;Git 충돌 발생 지점&lt;/text&gt;

        &lt;text class=&quot;om-svg-label om-svg-center om-svg-strong&quot; x=&quot;793&quot; y=&quot;407&quot;&gt;BANK-OM 변경 이력&lt;/text&gt;

        &lt;text class=&quot;om-svg-label om-svg-center om-svg-strong&quot; x=&quot;460&quot; y=&quot;539&quot;&gt;⑤ 적용 완료 custom commit&lt;/text&gt;
        &lt;text class=&quot;om-svg-muted om-svg-center&quot; x=&quot;460&quot; y=&quot;562&quot;&gt;patch 공식 코드 + BANK-OM 변경&lt;/text&gt;

        &lt;polygon class=&quot;om-svg-node om-svg-verifier-node&quot; points=&quot;460,618 524,663 460,708 396,663&quot;/&gt;

        &lt;path class=&quot;om-svg-path om-svg-fail-line om-svg-loop&quot; marker-end=&quot;url(#om-arrow-fail)&quot; d=&quot;M396 663 C310 712 250 650 310 556&quot;/&gt;
        &lt;text class=&quot;om-svg-fail-text&quot; x=&quot;192&quot; y=&quot;716&quot;&gt;검사 BLOCK → custom 보완 → 재검사&lt;/text&gt;

        &lt;rect class=&quot;om-svg-node om-svg-pass-node&quot; x=&quot;315&quot; y=&quot;740&quot; width=&quot;290&quot; height=&quot;56&quot; rx=&quot;22&quot;/&gt;
        &lt;text class=&quot;om-svg-label om-svg-center om-svg-strong&quot; x=&quot;460&quot; y=&quot;764&quot;&gt;⑦ 검증 tag · 배포&lt;/text&gt;
        &lt;text class=&quot;om-svg-muted om-svg-center&quot; x=&quot;460&quot; y=&quot;784&quot;&gt;통과한 custom 최종 commit 고정&lt;/text&gt;
        &lt;text class=&quot;om-svg-core-text om-svg-center&quot; x=&quot;790&quot; y=&quot;724&quot;&gt;다음 공식 버전에서 Cycle 반복&lt;/text&gt;
      &lt;/svg&gt;
    &lt;/div&gt;

    &lt;div class=&quot;om-branch-after&quot;&gt;
      &lt;p&gt;&lt;strong&gt;Git 충돌은 어디서 발생하나?&lt;/strong&gt; &lt;code&gt;patch&lt;/code&gt;와 같은 코드에서 시작한 &lt;code&gt;custom&lt;/code&gt; branch에 BANK-OM commit을 다시 적용하는 ④ 단계에서 발생합니다. 해결 코드는 &lt;code&gt;custom&lt;/code&gt; branch에 commit으로 남기고 다음 BANK-OM 재적용을 계속합니다.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;검사 BLOCK은 무엇이 다른가?&lt;/strong&gt; 모든 BANK-OM commit 적용이 끝난 ⑤ 상태를 검사한 뒤 기준을 통과하지 못한 경우입니다. 이때도 &lt;code&gt;custom&lt;/code&gt; branch를 보완하지만, Git이 코드를 합치지 못한 충돌과는 다른 문제입니다.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;다음 버전은 어떻게 이어지나?&lt;/strong&gt; 검사에 통과한 마지막 &lt;code&gt;custom&lt;/code&gt; commit에 검증 tag를 붙여 배포 대상을 고정합니다. 다음 공식 버전에서는 새 &lt;code&gt;patch&lt;/code&gt;와 새 &lt;code&gt;custom&lt;/code&gt; branch를 만든 뒤 같은 Cycle을 반복합니다. 공식 코드만 담는 &lt;code&gt;patch&lt;/code&gt;에는 충돌 해결이나 검사 보완 commit을 합치지 않습니다.&lt;/p&gt;
    &lt;/div&gt;

    &lt;details class=&quot;om-details&quot;&gt;
      &lt;summary&gt;왜 이 구조가 필요한가?&lt;/summary&gt;
      &lt;p&gt;Cycle의 파란색은 공식 버전과 &lt;code&gt;patch&lt;/code&gt; branch, 주황색은 BANK-OM 변경 이력과 &lt;code&gt;custom&lt;/code&gt; branch를 뜻합니다. BANK-OM 변경에는 공식 공용 Core 파일의 최소 수정과 신규 Resource·Mapper·Repository 같은 행내 전용 파일 추가가 함께 들어갈 수 있습니다. BANK-OM-001처럼 한 업무 기능이 두 역할을 모두 사용하면 같은 BANK-OM ID로 연결해 추적합니다.&lt;/p&gt;
    &lt;/details&gt;
  &lt;/section&gt;

  &lt;section id=&quot;appendix&quot; class=&quot;om-section&quot;&gt;
    &lt;div class=&quot;om-section-title&quot;&gt;
      &lt;span&gt;Q&amp;amp;A&lt;/span&gt;
      &lt;div&gt;
        &lt;h2&gt;가장 중요한 질문&lt;/h2&gt;
        &lt;p&gt;파일이 사라진 경우와 파일 안의 행내 변경이 사라진 경우를 구분합니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;details class=&quot;om-watch-guide&quot; open&gt;
      &lt;summary&gt;Q1. “파일이 사라졌다”는 정확히 무슨 뜻인가?&lt;/summary&gt;
      &lt;p&gt;&lt;b&gt;업그레이드 결과물에 파일 자체가 없는 경우입니다.&lt;/b&gt; 예를 들어 새로 만든 &lt;code&gt;InstanceCodeResource.java&lt;/code&gt;가 생성되지 않았다면 파일 소실입니다.&lt;/p&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;
        &lt;table class=&quot;table table-sm&quot;&gt;
          &lt;thead&gt;
            &lt;tr&gt;&lt;th&gt;해당 파일의 등록&lt;/th&gt;&lt;th&gt;검사 결과&lt;/th&gt;&lt;th&gt;이유&lt;/th&gt;&lt;/tr&gt;
          &lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;실제 변경 파일(&lt;code&gt;allowed&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;&lt;b&gt;담당자 확인 알림&lt;/b&gt;&lt;/td&gt;&lt;td&gt;변경이 빠졌을 가능성이 있어 자동 통과시키지 않음&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;즉시 실패 파일(&lt;code&gt;required&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;&lt;b&gt;즉시 실패&lt;/b&gt;&lt;/td&gt;&lt;td&gt;필수 구현 파일 누락을 파일 상태만으로 확인할 수 있음&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;
    &lt;/details&gt;

    &lt;details class=&quot;om-watch-guide&quot; open&gt;
      &lt;summary&gt;Q2. “변경이 사라졌다”는 정확히 무슨 뜻인가?&lt;/summary&gt;
      &lt;p&gt;&lt;b&gt;파일은 있지만 공식 새 버전의 파일과 완전히 같아서 행내 변경 흔적이 보이지 않는 경우입니다.&lt;/b&gt; 검사기는 업그레이드 결과물과 공식 새 버전을 비교해 이를 찾습니다.&lt;/p&gt;
      &lt;pre&gt;&lt;code&gt;Entity.java 파일은 존재
하지만 공식 새 버전의 Entity.java와 완전히 동일
→ BANK-OM 변경이 적용되지 않았을 가능성
→ allowed이면 담당자 확인, required이면 즉시 실패&lt;/code&gt;&lt;/pre&gt;
    &lt;/details&gt;

    &lt;details class=&quot;om-watch-guide&quot; open&gt;
      &lt;summary&gt;Q3. 파일이 다르면 행내 코드가 전부 적용됐다는 뜻인가?&lt;/summary&gt;
      &lt;p&gt;&lt;b&gt;아닙니다.&lt;/b&gt; 현재 파일 단위 검사는 “공식 원본과 다른가?”까지 확인합니다. 공용 파일이 다른 BANK-OM 때문에 달라졌다면, 정작 BANK-OM-001의 &lt;code&gt;INSTANCE_CODE&lt;/code&gt;가 빠져도 파일 전체는 다르게 보일 수 있습니다.&lt;/p&gt;
      &lt;div class=&quot;om-required-rule&quot;&gt;
        &lt;strong&gt;따라서 세 단계로 확인합니다&lt;/strong&gt;
        &lt;ol&gt;
          &lt;li&gt;&lt;b&gt;파일 검사:&lt;/b&gt; 필요한 파일이 있고 공식 원본 대비 변경이 보이는가?&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;코드 내용 검사:&lt;/b&gt; &lt;code&gt;Entity.INSTANCE_CODE&lt;/code&gt;, &lt;code&gt;instanceCodeDAO()&lt;/code&gt; 같은 필수 코드가 실제로 남아 있는가?&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;동작 검사:&lt;/b&gt; API 호출·저장·조회 등 InstanceCode 기능이 실제 환경에서 동작하는가?&lt;/li&gt;
        &lt;/ol&gt;
      &lt;/div&gt;
    &lt;/details&gt;

    &lt;details class=&quot;om-watch-guide&quot;&gt;
      &lt;summary&gt;Q4. allowed·required·watch를 한 문장씩만 설명하면?&lt;/summary&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;
        &lt;table class=&quot;table table-sm&quot;&gt;
          &lt;thead&gt;
            &lt;tr&gt;&lt;th&gt;항목&lt;/th&gt;&lt;th&gt;한 문장 정의&lt;/th&gt;&lt;th&gt;문제가 발견되면&lt;/th&gt;&lt;/tr&gt;
          &lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;&lt;code&gt;allowed&lt;/code&gt;&lt;/td&gt;&lt;td&gt;이 BANK-OM 기능이 실제로 변경한 파일 전체&lt;/td&gt;&lt;td&gt;누락·변경 없음 → 담당자 확인&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;code&gt;required&lt;/code&gt;&lt;/td&gt;&lt;td&gt;보통 행내 전용 파일 중, 누락되면 필수 구현 누락을 확인할 수 있는 파일&lt;/td&gt;&lt;td&gt;누락·변경 없음 → 즉시 실패&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;code&gt;watch&lt;/code&gt;&lt;/td&gt;&lt;td&gt;직접 수정하지 않았지만 행내 기능에 영향을 줄 수 있는 의존 파일&lt;/td&gt;&lt;td&gt;공식 버전에서 변경 → 담당자 확인&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;
    &lt;/details&gt;

    &lt;details class=&quot;om-watch-guide&quot;&gt;
      &lt;summary&gt;Q5. 기존 BANK-OM에 나중에 새 파일을 추가하면?&lt;/summary&gt;
      &lt;p&gt;최초 BANK-OM-001의 48개 파일 기록은 그대로 두고, 후속 커밋에서 새로 추가한 파일만 &lt;code&gt;candidate_additional_paths&lt;/code&gt;에 기록합니다.&lt;/p&gt;
      &lt;pre&gt;&lt;code&gt;candidate_additional_paths:
  - .../InstanceCodeValidator.java&lt;/code&gt;&lt;/pre&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;
        &lt;table class=&quot;table table-sm&quot;&gt;
          &lt;thead&gt;
            &lt;tr&gt;&lt;th&gt;기록&lt;/th&gt;&lt;th&gt;검사기에 알려주는 내용&lt;/th&gt;&lt;/tr&gt;
          &lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;새 Git 커밋 식별값(SHA)&lt;/td&gt;&lt;td&gt;어떤 코드 변경을 어떤 순서로 추가했는가&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;code&gt;candidate_additional_paths&lt;/code&gt;&lt;/td&gt;&lt;td&gt;새 파일을 BANK-OM-001의 변경 범위로 승인했는가&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Git 커밋 식별값(SHA)만 추가하면 새 파일은 등록 범위 밖 변경으로 판단됩니다.&lt;/b&gt; 반대로 최초 48개 명단을 49개로 고치면 과거 최초 커밋에도 새 파일이 있었던 것처럼 기록이 바뀝니다. 따라서 최초 기록은 보존하고 후속 파일만 별도로 추가합니다.&lt;/p&gt;
      &lt;p&gt;최초 설정에는 필요하지 않으며, 같은 BANK-OM ID로 후속 파일을 추가할 때만 사용합니다. 별도 기능이라면 새 BANK-OM ID를 발급합니다.&lt;/p&gt;
    &lt;/details&gt;
  &lt;/section&gt;

  &lt;section id=&quot;gates&quot; class=&quot;om-section&quot;&gt;
    &lt;div class=&quot;om-section-title&quot;&gt;
      &lt;span&gt;03&lt;/span&gt;
      &lt;div&gt;
        &lt;h2&gt;검사기&lt;/h2&gt;
        &lt;p&gt;각 검사는 한 가지 질문만 담당합니다. 실패하면 후보 승인을 중단하고 해당 원인을 수정합니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table om-gate-table&quot;&gt;
        &lt;thead&gt;
          &lt;tr&gt;
            &lt;th&gt;검사기&lt;/th&gt;
            &lt;th&gt;무엇을 검사하나&lt;/th&gt;
            &lt;th&gt;어떤 경우 실패하나&lt;/th&gt;
            &lt;th&gt;실패하면&lt;/th&gt;
          &lt;/tr&gt;
        &lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;
            &lt;th&gt;T25-R&lt;br&gt;&lt;small&gt;최초 재구성&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;과거 행내본의 실제 113개 차이를 BANK-OM별 정확한 파일 목록으로 분리했는지&lt;/td&gt;
            &lt;td&gt;폴더 패턴, 없는 파일, 소유자 불일치, 제외 사유 누락, 최종 내용 불일치&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;재구성 중단&lt;/strong&gt;&lt;br&gt;소유표를 다시 작성&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T25&lt;br&gt;&lt;small&gt;공식 기반&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;검사 후보가 승인한 공식 원본에서 출발했는지&lt;/td&gt;
            &lt;td&gt;공식 SHA가 후보 이력에 없음, 잠금 문서와 후보 SHA 불일치&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;후보 차단&lt;/strong&gt;&lt;br&gt;올바른 공식 원본에서 다시 생성&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T30&lt;br&gt;&lt;small&gt;커밋 BANK-OM ID&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;모든 제품 코드 변경 커밋에 BANK-OM ID가 정확히 하나 있는지&lt;/td&gt;
            &lt;td&gt;라벨 없음, 한 커밋에 여러 ID, 제품 코드와 검사기 정책 혼합&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;커밋 차단&lt;/strong&gt;&lt;br&gt;기능별로 다시 분리&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T31&lt;br&gt;&lt;small&gt;ID 이력&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;ID가 등록돼 있고 커밋 순서와 의존관계가 올바른지&lt;/td&gt;
            &lt;td&gt;미등록 ID, 허용되지 않은 여러 커밋, series 단절, 순환 의존&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;적용 순서 차단&lt;/strong&gt;&lt;br&gt;등록부·의존관계 수정&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T26&lt;br&gt;&lt;small&gt;커스터마이징 유지&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;등록한 원본 파일 전체와 필수 파일·계약·테스트가 후보에 남았는지&lt;/td&gt;
            &lt;td&gt;필수 파일 소실은 block, 그 밖의 등록 파일 소실은 approval, 폴더 패턴은 analysis_error&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;차단 또는 검토&lt;/strong&gt;&lt;br&gt;소실한 파일의 역할을 확인&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T40&lt;br&gt;&lt;small&gt;범위 이탈&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;제품·검사기·등록부·문서의 실제 변경이 승인한 파일 범위 안인지&lt;/td&gt;
            &lt;td&gt;등록하지 않은 파일 변경, required 파일의 순변경 없음&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;변경 차단&lt;/strong&gt;&lt;br&gt;잘못 섞인 변경을 분리&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T41&lt;br&gt;&lt;small&gt;위험 영역&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;변경이 금지·승인·관찰 영역 중 어디인지, 승인한 의도 범위 안인지&lt;/td&gt;
            &lt;td&gt;빈 허용 범위, 금지 파일 변경, 승인 범위 밖 파일 변경&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;오류·차단·승인&lt;/strong&gt;&lt;br&gt;위험 등급별로 분리&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T42&lt;br&gt;&lt;small&gt;업그레이드 영향&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;공식 새 버전이 watch 경로·설정키·의존성을 바꿨는지와 직접 참조 후보&lt;/td&gt;
            &lt;td&gt;등록한 의존 대상 변경 또는 미등록 직접 참조 후보 발견&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;책임자 검토&lt;/strong&gt;&lt;br&gt;자동 등록 없이 근거 제시&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T43&lt;br&gt;&lt;small&gt;커스텀 부채&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;코어 ID 수·변경 라인·충돌률·한 파일에 겹친 ID 수&lt;/td&gt;
            &lt;td&gt;외부 정책의 soft/hard 기준 초과, 지표·정책 형식 오류&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;승인 또는 차단&lt;/strong&gt;&lt;br&gt;범위 축소·기준선 검토&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T93&lt;br&gt;&lt;small&gt;정확 범위&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;ID별 실제 커밋 파일과 manifest 파일 목록이 정확히 같은지&lt;/td&gt;
            &lt;td&gt;실제 변경 누락, 실제로 바꾸지 않은 파일의 과다 허용&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;누락 차단&lt;/strong&gt;&lt;br&gt;과다 범위는 승인 검토&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T70&lt;br&gt;&lt;small&gt;검사기 보호&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;검사기·등록부·테스트·정책 문서를 느슨하게 바꾸지 않았는지&lt;/td&gt;
            &lt;td&gt;보호 파일을 현재 변경본의 완화된 규칙으로 스스로 승인하려는 경우&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;정책 변경 절차&lt;/strong&gt;&lt;br&gt;기존 기준으로 별도 승인&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T60-I&lt;br&gt;&lt;small&gt;검사 코드&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;등록된 Python 테스트 파일과 함수가 실제로 존재하는지&lt;/td&gt;
            &lt;td&gt;Python 파일 없음, 함수 이름 없음, 문법을 읽을 수 없음&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;검사 준비 차단&lt;/strong&gt;&lt;br&gt;테스트 구현 보완&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T61&lt;br&gt;&lt;small&gt;반증 검사&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;기능 코드를 제거하면 관련 테스트가 실제로 실패하는지&lt;/td&gt;
            &lt;td&gt;기능을 빼도 테스트가 통과, 환경 오류만 발생, 비교 증거 없음&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;검사 신뢰 불충분&lt;/strong&gt;&lt;br&gt;테스트 민감도 보완&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T62&lt;br&gt;&lt;small&gt;행내 동작&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;행내 서버·DB·검색·브라우저에서 기능이 실제로 동작하는지&lt;/td&gt;
            &lt;td&gt;테스트 미실행, API·저장·검색·화면 결과 불일치&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;운영 승인 차단&lt;/strong&gt;&lt;br&gt;환경 또는 기능 수정 후 재실행&lt;/td&gt;
          &lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;example&quot; class=&quot;om-section&quot;&gt;
    &lt;div class=&quot;om-section-title&quot;&gt;
      &lt;span&gt;04&lt;/span&gt;
      &lt;div&gt;
        &lt;h2&gt;실제 적용 예시&lt;/h2&gt;
        &lt;p&gt;BANK-OM-001은 공식 원본에 없던 InstanceCode 기능을 코어 파일과 전용 파일에 함께 추가합니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;om-example-flow&quot; role=&quot;img&quot; aria-label=&quot;공식 원본에 BANK-OM-001 커밋을 적용하고 검사 결과를 얻는 흐름&quot;&gt;
      &lt;span&gt;공식 원본&lt;br&gt;&lt;code&gt;afcb2d2…&lt;/code&gt;&lt;/span&gt;
      &lt;b aria-hidden=&quot;true&quot;&gt;＋&lt;/b&gt;
      &lt;span&gt;BANK-OM-001&lt;br&gt;&lt;code&gt;a2566fac…&lt;/code&gt;&lt;/span&gt;
      &lt;b aria-hidden=&quot;true&quot;&gt;→&lt;/b&gt;
      &lt;span&gt;적용 후보&lt;br&gt;&lt;code&gt;Entity + 전용 파일&lt;/code&gt;&lt;/span&gt;
      &lt;b aria-hidden=&quot;true&quot;&gt;→&lt;/b&gt;
      &lt;span&gt;검사 결과&lt;br&gt;&lt;code&gt;T26·T60-I pass&lt;/code&gt;&lt;/span&gt;
    &lt;/div&gt;

    &lt;div class=&quot;om-file-diffs&quot;&gt;
      &lt;details class=&quot;om-file-diff&quot; open&gt;
        &lt;summary&gt;&lt;code&gt;Entity.java&lt;/code&gt;&lt;span&gt;기존 코어 파일 수정 · 1줄 추가&lt;/span&gt;&lt;/summary&gt;
        &lt;div class=&quot;om-split-diff&quot;&gt;
          &lt;div&gt;
            &lt;strong&gt;공식 원본&lt;/strong&gt;
            &lt;pre&gt;&lt;code&gt;public static final String WORKSHEET = &quot;worksheet&quot;;
&lt;span class=&quot;text-muted&quot;&gt;INSTANCE_CODE 없음&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;
          &lt;/div&gt;
          &lt;div&gt;
            &lt;strong&gt;BANK-OM-001 적용본&lt;/strong&gt;
            &lt;pre&gt;&lt;code&gt;public static final String WORKSHEET = &quot;worksheet&quot;;
&lt;ins&gt;public static final String INSTANCE_CODE = &quot;instanceCode&quot;;&lt;/ins&gt;&lt;/code&gt;&lt;/pre&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/details&gt;

      &lt;details class=&quot;om-file-diff&quot;&gt;
        &lt;summary&gt;&lt;code&gt;InstanceCodeResource.java&lt;/code&gt;&lt;span&gt;신규 파일 · API 접수&lt;/span&gt;&lt;/summary&gt;
        &lt;div class=&quot;om-split-diff&quot;&gt;
          &lt;div class=&quot;om-no-file&quot;&gt;&lt;strong&gt;공식 원본&lt;/strong&gt;&lt;span&gt;파일 없음&lt;/span&gt;&lt;/div&gt;
          &lt;div&gt;
            &lt;strong&gt;BANK-OM-001 적용본&lt;/strong&gt;
            &lt;pre&gt;&lt;code&gt;&lt;ins&gt;@Path(&quot;/v1/instanceCodes&quot;)&lt;/ins&gt;
&lt;ins&gt;class InstanceCodeResource&lt;/ins&gt;
&lt;ins&gt;  extends EntityResource&amp;lt;InstanceCode, InstanceCodeRepository&amp;gt; {&lt;/ins&gt;
&lt;ins&gt;  super(Entity.INSTANCE_CODE, authorizer, limits);&lt;/ins&gt;
&lt;ins&gt;}&lt;/ins&gt;&lt;/code&gt;&lt;/pre&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/details&gt;

      &lt;details class=&quot;om-file-diff&quot;&gt;
        &lt;summary&gt;&lt;code&gt;InstanceCodeMapper.java&lt;/code&gt;&lt;span&gt;신규 파일 · 요청값 변환&lt;/span&gt;&lt;/summary&gt;
        &lt;div class=&quot;om-split-diff&quot;&gt;
          &lt;div class=&quot;om-no-file&quot;&gt;&lt;strong&gt;공식 원본&lt;/strong&gt;&lt;span&gt;파일 없음&lt;/span&gt;&lt;/div&gt;
          &lt;div&gt;
            &lt;strong&gt;BANK-OM-001 적용본&lt;/strong&gt;
            &lt;pre&gt;&lt;code&gt;&lt;ins&gt;class InstanceCodeMapper {&lt;/ins&gt;
&lt;ins&gt;  return copy(new InstanceCode(), create, user)&lt;/ins&gt;
&lt;ins&gt;      .withCodeGroup(create.getCodeGroup())&lt;/ins&gt;
&lt;ins&gt;      .withCodeValue(create.getCodeValue());&lt;/ins&gt;
&lt;ins&gt;}&lt;/ins&gt;&lt;/code&gt;&lt;/pre&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/details&gt;

      &lt;details class=&quot;om-file-diff&quot;&gt;
        &lt;summary&gt;&lt;code&gt;InstanceCodeRepository.java&lt;/code&gt;&lt;span&gt;신규 파일 · DB·검색 연결&lt;/span&gt;&lt;/summary&gt;
        &lt;div class=&quot;om-split-diff&quot;&gt;
          &lt;div class=&quot;om-no-file&quot;&gt;&lt;strong&gt;공식 원본&lt;/strong&gt;&lt;span&gt;파일 없음&lt;/span&gt;&lt;/div&gt;
          &lt;div&gt;
            &lt;strong&gt;BANK-OM-001 적용본&lt;/strong&gt;
            &lt;pre&gt;&lt;code&gt;&lt;ins&gt;class InstanceCodeRepository&lt;/ins&gt;
&lt;ins&gt;  extends EntityRepository&amp;lt;InstanceCode&amp;gt; {&lt;/ins&gt;
&lt;ins&gt;  super(InstanceCodeResource.COLLECTION_PATH,&lt;/ins&gt;
&lt;ins&gt;      Entity.INSTANCE_CODE,&lt;/ins&gt;
&lt;ins&gt;      Entity.getCollectionDAO().instanceCodeDAO());&lt;/ins&gt;
&lt;ins&gt;}&lt;/ins&gt;&lt;/code&gt;&lt;/pre&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/details&gt;
    &lt;/div&gt;

    &lt;details class=&quot;om-details&quot;&gt;
      &lt;summary&gt;커밋과 등록 파일의 역할 차이&lt;/summary&gt;
      &lt;p&gt;&lt;strong&gt;Git 커밋&lt;/strong&gt;이 실제 코드를 수정합니다. &lt;strong&gt;BANK-OM ID&lt;/strong&gt;는 변경을 업무 기능으로 묶고, &lt;strong&gt;Manifest&lt;/strong&gt;는 허용 경로·필수 파일·감시 지점·테스트 계약을 검사기에 알려줍니다. 등록 파일 자체가 제품 코드를 수정하지는 않습니다.&lt;/p&gt;
    &lt;/details&gt;
  &lt;/section&gt;

  &lt;section id=&quot;result&quot; class=&quot;om-section&quot;&gt;
    &lt;div class=&quot;om-section-title&quot;&gt;
      &lt;span&gt;05&lt;/span&gt;
      &lt;div&gt;
        &lt;h2&gt;결과&lt;/h2&gt;
        &lt;p&gt;현재는 소스 수준 재적용까지 확인됐고, 최종 행내 동작 승인은 남아 있습니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;om-result-list&quot;&gt;
      &lt;div&gt;&lt;span class=&quot;om-status om-pass&quot;&gt;통과&lt;/span&gt;&lt;strong&gt;T25-R&lt;/strong&gt;&lt;p&gt;113개 경로 = 단독 74 + 공유 37 + 제외 2, 폴더 패턴 없음&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span class=&quot;om-status om-pass&quot;&gt;통과&lt;/span&gt;&lt;strong&gt;T25·T30·T31&lt;/strong&gt;&lt;p&gt;공식 기반과 BANK-OM 커밋 장부·순서 정상&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span class=&quot;om-status om-pass&quot;&gt;통과&lt;/span&gt;&lt;strong&gt;T26·T60-I&lt;/strong&gt;&lt;p&gt;등록 원본 파일 전체·필수 코드·Python 검사 구현 존재&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span class=&quot;om-status om-pass&quot;&gt;통과&lt;/span&gt;&lt;strong&gt;T40·T70&lt;/strong&gt;&lt;p&gt;전체 변경 범위와 검사기 자체 보호 단위 테스트 통과&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span class=&quot;om-status om-pass&quot;&gt;통과&lt;/span&gt;&lt;strong&gt;T41·T43·T93&lt;/strong&gt;&lt;p&gt;검사 대상 코드의 위험 영역·부채 기준선·ID별 정확 경로 일치. BANK-OM-007은 원본 8개와 등록된 후속 2개를 합쳐 현재 10개 경로로 검사&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span class=&quot;om-status om-pass&quot;&gt;구현&lt;/span&gt;&lt;strong&gt;T42·T50·T51&lt;/strong&gt;&lt;p&gt;watch 제안·빈 선언 차단·scalar/list 구조 변화 출력&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span class=&quot;om-status om-limited&quot;&gt;범위 통과&lt;/span&gt;&lt;strong&gt;T61&lt;/strong&gt;&lt;p&gt;현재 Sybase·Tibero만 반증 완료&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span class=&quot;om-status om-block&quot;&gt;환경 대기&lt;/span&gt;&lt;strong&gt;T62&lt;/strong&gt;&lt;p&gt;실행기와 환경 사전검사는 완료, 행내 운영 테스트 7건 실행 필요&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;om-decision&quot;&gt;
      &lt;div&gt;&lt;strong&gt;지금 말할 수 있음&lt;/strong&gt;&lt;span&gt;코드 재적용 구조와 소스 검사는 정상&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;아직 말할 수 없음&lt;/strong&gt;&lt;span&gt;행내 환경에서 모든 기능이 정상 동작한다는 최종 결론&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;roadmap&quot; class=&quot;om-section&quot;&gt;
    &lt;div class=&quot;om-section-title&quot;&gt;
      &lt;span&gt;06&lt;/span&gt;
      &lt;div&gt;
        &lt;h2&gt;현재까지 구현 단계와 향후 추가 구현&lt;/h2&gt;
        &lt;p&gt;1·2·3차 코드는 완료했습니다. 이제 행내 환경 값을 넣고 실제 결과 증거를 만드는 단계입니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;om-roadmap&quot;&gt;
      &lt;div class=&quot;om-roadmap-group&quot;&gt;
        &lt;strong&gt;현재 완료&lt;/strong&gt;
        &lt;ol&gt;
          &lt;li&gt;&lt;span&gt;1&lt;/span&gt;&lt;div&gt;&lt;b&gt;BANK-OM 등록 체계&lt;/b&gt;&lt;p&gt;등록된 BANK-OM 전체의 Manifest·계약·커밋 라벨 구성&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span&gt;2&lt;/span&gt;&lt;div&gt;&lt;b&gt;행내 OpenMetadata 코드 재구성&lt;/b&gt;&lt;p&gt;공식 1.13.1 위에 등록된 BANK-OM 변경 적용 · &lt;code&gt;849ae756…&lt;/code&gt;&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span&gt;3&lt;/span&gt;&lt;div&gt;&lt;b&gt;정확 경로 검사기 1차&lt;/b&gt;&lt;p&gt;T25-R·T26·T40·T70 강화 · 39개 단위 테스트 통과&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
