  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;om-phase2&quot; data-artifact-status=&quot;current&quot;&gt;
  &lt;header class=&quot;p2-hero&quot;&gt;
    &lt;span class=&quot;viz-badge&quot;&gt;2차 공유문서 · 현행본&lt;/span&gt;
    &lt;h1&gt;각 검사기는 무엇을 확인하고, 결과를 어떻게 읽어야 하는가&lt;/h1&gt;
    &lt;p&gt;이 페이지는 각 검사가 어떤 문제를 찾는지 설명합니다. 실제 검사 자료를 만드는 방법은 다음 3번 가이드에서, OM_TEMP 1.13.1 진단 결과는 4번 업그레이드 연습에서 확인합니다.&lt;/p&gt;
    &lt;div class=&quot;p2-decision&quot; role=&quot;status&quot;&gt;
      &lt;strong&gt;이 페이지의 핵심&lt;/strong&gt;
      &lt;span&gt;검사기는 커스터마이징 파일의 누락과 등록 오류를 자동으로 찾습니다. 그러나 기능이 실제로 정상인지, 충돌을 올바르게 해결했는지, 배포해도 되는지는 별도의 기능 테스트와 담당자 승인이 필요합니다.&lt;/span&gt;
    &lt;/div&gt;
  &lt;/header&gt;

  &lt;aside class=&quot;p2-page-scope&quot; aria-label=&quot;이 페이지가 답하는 질문과 범위&quot;&gt;
    &lt;div&gt;&lt;strong&gt;이 페이지가 답하는 질문&lt;/strong&gt;&lt;p&gt;각 검사는 무엇을 비교하며, 어떤 경우에 통과·담당자 확인·중단으로 판단하는가?&lt;/p&gt;&lt;/div&gt;
    &lt;div&gt;&lt;strong&gt;이 페이지의 범위&lt;/strong&gt;&lt;p&gt;검사 원리만 설명합니다. 특정 코드의 실제 검사 결과와 아직 확인하지 못한 배포 범위는 4번 업그레이드 연습에서 구분해 보여줍니다.&lt;/p&gt;&lt;/div&gt;
    &lt;div&gt;&lt;strong&gt;다음 단계&lt;/strong&gt;&lt;p&gt;검사 원리를 이해한 뒤 다음 가이드에서 변경 등록표(Manifest), ID 관리대장(Registry), 업무 테스트 기준(Contract)을 준비합니다.&lt;/p&gt;&lt;/div&gt;
  &lt;/aside&gt;
  &lt;p class=&quot;p2-internal-scope&quot;&gt;&lt;strong&gt;우리 내부에서 만든 검사 체계:&lt;/strong&gt; T25·T42 같은 번호, PASS·APPROVAL·BLOCK 판정과 아래 검사기는 OpenMetadata 기본 기능이 아니라 &lt;code&gt;easyseop/openmetadata-test&lt;/code&gt;에서 BANK-OM 변경을 관리하기 위해 만든 검사 체계입니다.&lt;/p&gt;

  &lt;section class=&quot;p2-section&quot; aria-labelledby=&quot;p2-flow-title&quot;&gt;
    &lt;h2 id=&quot;p2-flow-title&quot;&gt;검사기가 사용하는 정보와 검사 순서&lt;/h2&gt;
    &lt;ol class=&quot;p2-flow&quot;&gt;
      &lt;li&gt;
        &lt;span&gt;1&lt;/span&gt;
        &lt;strong&gt;비교할 코드 지정&lt;/strong&gt;
        &lt;p&gt;기준이 되는 공식 버전과 검사할 행내 커스터마이징 버전을 지정합니다.&lt;/p&gt;
      &lt;/li&gt;
      &lt;li&gt;
        &lt;span&gt;2&lt;/span&gt;
        &lt;strong&gt;변경 등록표 입력&lt;/strong&gt;
        &lt;p&gt;Manifest에 등록한 BANK-OM ID별 변경 파일, 필수 파일, 업그레이드 확인 대상과 테스트를 읽습니다.&lt;/p&gt;
      &lt;/li&gt;
      &lt;li&gt;
        &lt;span&gt;3&lt;/span&gt;
        &lt;strong&gt;변경 기록 비교&lt;/strong&gt;
        &lt;p&gt;공식 버전 이후에 추가된 행내 변경과 각 변경에서 수정한 파일을 확인합니다.&lt;/p&gt;
      &lt;/li&gt;
      &lt;li&gt;
        &lt;span&gt;4&lt;/span&gt;
        &lt;strong&gt;업그레이드·동작 검사&lt;/strong&gt;
        &lt;p&gt;다음 공식 버전의 변경과 행내 API·화면·DB 테스트 결과를 확인합니다.&lt;/p&gt;
      &lt;/li&gt;
      &lt;li&gt;
        &lt;span&gt;5&lt;/span&gt;
        &lt;strong&gt;배포 파일 일치 확인&lt;/strong&gt;
        &lt;p&gt;검사한 코드와 이미지·설정 파일이 실제 배포 대상과 같은지 확인합니다.&lt;/p&gt;
      &lt;/li&gt;
    &lt;/ol&gt;
    &lt;p class=&quot;p2-terms&quot;&gt;&lt;strong&gt;화면에서는 “코드 버전 번호”와 “파일 내용 식별값”으로 설명합니다.&lt;/strong&gt; 결과 파일에서는 각각 Git commit SHA와 SHA-256 digest라는 기술 명칭으로 저장됩니다.&lt;/p&gt;
    &lt;details class=&quot;p2-details&quot;&gt;
      &lt;summary&gt;뒤의 표에 나오는 기준자료 이름&lt;/summary&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;
        &lt;table class=&quot;table table-sm&quot;&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;이름&lt;/th&gt;&lt;th&gt;무엇을 기록하나&lt;/th&gt;&lt;th&gt;어디에 사용하나&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;Manifest&lt;/td&gt;&lt;td&gt;BANK-OM ID별 실제 변경 파일, 필수 파일, 업그레이드 비교 경로, 테스트&lt;/td&gt;&lt;td&gt;파일 누락·범위 이탈·공식 변경 영향을 판단&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Registry&lt;/td&gt;&lt;td&gt;사용 중인 BANK-OM ID, 이름, 상태, 담당자&lt;/td&gt;&lt;td&gt;미등록·폐기 ID 사용과 담당자 누락을 판단&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Contract&lt;/td&gt;&lt;td&gt;기능이 정상이라고 판단할 업무 동작과 연결된 테스트&lt;/td&gt;&lt;td&gt;테스트 코드 존재와 실제 실행 결과를 확인&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;검사 대상 고정 정보&lt;br&gt;&lt;code&gt;candidate-lock.yaml&lt;/code&gt;&lt;/td&gt;&lt;td&gt;검사를 시작한 행내 코드의 버전 번호와 전체 파일 상태&lt;/td&gt;&lt;td&gt;검사 도중 코드가 바뀌거나 다른 버전의 결과가 섞이는 것을 차단&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;테스트 실행 목록&lt;br&gt;&lt;code&gt;test-run-set.yaml&lt;/code&gt;&lt;/td&gt;&lt;td&gt;실제로 실행할 테스트와 마지막 결과&lt;/td&gt;&lt;td&gt;필수 테스트 누락·SKIP·실패를 판단&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;배포 대상 고정 정보&lt;br&gt;&lt;code&gt;release lock&lt;/code&gt;&lt;/td&gt;&lt;td&gt;승인한 코드·설치 이미지·설정 파일·검사 결과의 내용 식별값&lt;/td&gt;&lt;td&gt;검사한 파일과 실제 배포할 파일이 같은지 확인&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;
    &lt;/details&gt;
    &lt;details class=&quot;p2-details&quot; open&gt;
      &lt;summary&gt;운영할 때 각 파일을 언제 만들고 갱신하는가&lt;/summary&gt;
      &lt;p class=&quot;p2-terms&quot;&gt;모든 파일을 검사할 때마다 다시 만드는 것은 아닙니다. 아래 자료는 &lt;strong&gt;계속 관리하는 기준자료&lt;/strong&gt;, &lt;strong&gt;검사할 코드가 확정될 때 만드는 고정정보&lt;/strong&gt;, &lt;strong&gt;검사를 실행할 때마다 생기는 결과자료&lt;/strong&gt;로 나뉩니다.&lt;/p&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;
        &lt;table class=&quot;table table-sm&quot;&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;파일&lt;/th&gt;&lt;th&gt;처음 만드는 시점&lt;/th&gt;&lt;th&gt;다시 갱신하는 조건&lt;/th&gt;&lt;th&gt;검사 실행마다 새로 만드나?&lt;/th&gt;&lt;th&gt;관리 책임&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;Manifest&lt;/strong&gt;&lt;br&gt;&lt;code&gt;manifests/BANK-OM-xxx.yaml&lt;/code&gt;&lt;/td&gt;
              &lt;td&gt;BANK-OM 기능을 처음 등록할 때&lt;/td&gt;
              &lt;td&gt;기능을 구현하는 파일, 필수 파일, 업그레이드 영향 경로 또는 연결 테스트가 달라질 때. 공식 버전에 맞춰 코드를 수정한 뒤 새 버전 등록 폴더에서 다시 검토&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;아니요.&lt;/strong&gt; 같은 코드에 검사를 반복해도 바꾸지 않음&lt;/td&gt;
              &lt;td&gt;생성기가 실제 변경 파일 초안을 만들고, 기능 담당자가 업무 단위·필수 파일·간접 영향·테스트를 확정&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;Registry&lt;/strong&gt;&lt;br&gt;&lt;code&gt;customization-registry.yaml&lt;/code&gt;&lt;/td&gt;
              &lt;td&gt;첫 BANK-OM 목록을 구성할 때&lt;/td&gt;
              &lt;td&gt;ID 추가·폐기, 상태·담당자·중요도 변경, Manifest·Contract 연결 변경 시. 버전별 등록 묶음을 만들 때 현재 목록으로 다시 생성&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;아니요.&lt;/strong&gt; 조직의 BANK-OM 관리대장으로 계속 유지&lt;/td&gt;
              &lt;td&gt;관리 담당자가 상태·담당자를 승인하고, 생성기가 Manifest·Contract 연결 누락을 검사&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;Contract&lt;/strong&gt;&lt;br&gt;&lt;code&gt;contracts.yaml&lt;/code&gt;&lt;/td&gt;
              &lt;td&gt;기능의 정상 동작과 이를 확인할 테스트를 처음 합의할 때&lt;/td&gt;
              &lt;td&gt;업무 정상 조건이나 연결할 테스트 파일·테스트 이름이 바뀔 때&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;아니요.&lt;/strong&gt; 코드 버전이 바뀌어도 정상 조건이 같으면 재사용&lt;/td&gt;
              &lt;td&gt;기능 담당자와 테스트 담당자가 정상 조건을 정하고 코드 담당자가 테스트를 구현&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;검사 대상 고정정보&lt;/strong&gt;&lt;br&gt;&lt;code&gt;candidate-lock.yaml&lt;/code&gt;&lt;/td&gt;
              &lt;td&gt;병합과 수정이 끝나 검사할 코드와 배포 파일이 확정됐을 때&lt;/td&gt;
              &lt;td&gt;공식 대상 버전, 적용 방식, 검사 대상 Git commit, 전체 파일 상태 또는 배포 파일 내용이 하나라도 바뀔 때 새 파일 생성&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;검사 종류별이 아니라 검사 대상 코드별 1개.&lt;/strong&gt; 같은 대상을 검사하는 여러 검사가 함께 사용&lt;/td&gt;
              &lt;td&gt;검사 실행기가 실제 Git 번호와 파일 내용 식별값을 읽어 자동 생성. 생성 후 수정하지 않음&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;테스트 실행 결과 목록&lt;/strong&gt;&lt;br&gt;&lt;code&gt;test-run-set.yaml&lt;/code&gt;&lt;/td&gt;
              &lt;td&gt;행내 API·화면·DB 테스트를 실제로 실행할 때&lt;/td&gt;
              &lt;td&gt;테스트를 다시 실행하거나, 검사 대상 코드·배포 파일·검사기 버전·테스트 목록이 바뀔 때 새 파일 생성&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;실제 테스트 실행 1회마다 새로 생성.&lt;/strong&gt; 기존 파일을 덮어쓰지 않음&lt;/td&gt;
              &lt;td&gt;테스트 실행기가 테스트별 PASS·FAIL·ERROR·SKIP을 자동 기록하고 담당자가 BLOCK 원인을 확인&lt;/td&gt;
            &lt;/tr&gt;
            &lt;tr&gt;
              &lt;td&gt;&lt;strong&gt;검사 결과&lt;/strong&gt;&lt;br&gt;&lt;code&gt;acgh-result.yaml&lt;/code&gt; 또는 결과 JSON&lt;/td&gt;
              &lt;td&gt;소스 검사나 행내 동작 검사를 실행할 때&lt;/td&gt;
              &lt;td&gt;검사를 다시 실행할 때마다 새 결과 생성&lt;/td&gt;
              &lt;td&gt;&lt;strong&gt;예.&lt;/strong&gt; 실행 시각·대상 Git 번호·입력자료와 함께 실행별로 보관&lt;/td&gt;
              &lt;td&gt;검사기가 자동 생성하고 책임자가 판정과 미실행 항목을 검토&lt;/td&gt;
            &lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;
      &lt;p class=&quot;p2-terms&quot;&gt;&lt;strong&gt;운영 원칙:&lt;/strong&gt; Manifest·Registry·Contract는 Git에서 변경 이력을 관리하고 담당자 리뷰를 받아 갱신합니다. &lt;code&gt;candidate-lock.yaml&lt;/code&gt;, &lt;code&gt;test-run-set.yaml&lt;/code&gt;, 검사 결과는 실행 증거이므로 생성 후 수정하거나 덮어쓰지 않고, 검사 대상 Git 번호와 실행 번호별로 분리해 보관합니다.&lt;/p&gt;
      &lt;p class=&quot;p2-terms&quot;&gt;&lt;strong&gt;현재 구현 범위:&lt;/strong&gt; 실제 Runtime contracts 실행기는 &lt;code&gt;candidate-lock.yaml&lt;/code&gt;, &lt;code&gt;test-run-set.yaml&lt;/code&gt;, &lt;code&gt;acgh-result.yaml&lt;/code&gt;을 한 번의 실행에서 함께 생성합니다. 현재 OM_TEMP 문서에 있는 &lt;code&gt;source-gate-results.json&lt;/code&gt;은 소스 검사 연습 결과이며, 운영 환경의 실제 Runtime contracts 결과를 대신하지 않습니다.&lt;/p&gt;
    &lt;/details&gt;
    &lt;div class=&quot;p2-language&quot;&gt;
      &lt;strong&gt;프론트엔드와 백엔드에 같은 검사기를 쓸 수 있나?&lt;/strong&gt;
      &lt;p&gt;&lt;b&gt;변경된 파일을 찾는 검사는 프로그래밍 언어와 관계없이 사용할 수 있습니다.&lt;/b&gt; Java·TypeScript·Python·JSON 등 어떤 파일이든 “어느 변경에서 어떤 파일이 바뀌었는가”는 같은 방식으로 확인합니다. 다만 파일 안의 코드가 올바르게 동작하는지는 이 검사만으로 알 수 없습니다.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;기능을 실제로 실행하는 검사는 언어와 테스트 도구별 지원이 필요합니다.&lt;/b&gt; 현재 테스트 코드 존재 확인은 Python 테스트만 지원하고, 화면 코드 오류 비교는 TypeScript만 지원합니다. Java JUnit이나 TypeScript Jest를 직접 등록하고 실행하는 기능은 추가 개발이 필요합니다.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;p2-section&quot; aria-labelledby=&quot;p2-map-title&quot;&gt;
    &lt;h2 id=&quot;p2-map-title&quot;&gt;검사 목적별로 먼저 보기&lt;/h2&gt;
    &lt;p class=&quot;p2-terms&quot;&gt;검사기를 네 가지 질문으로 나눴습니다. 오른쪽 상태는 “검사 프로그램이 존재하는가”가 아니라 “현재 OM_TEMP 자료로 실제 결과까지 확인했는가”를 표시합니다.&lt;/p&gt;
    &lt;div class=&quot;p2-map&quot;&gt;
      &lt;article&gt;
        &lt;div&gt;&lt;span&gt;A · 코드 변경 확인&lt;/span&gt;&lt;em class=&quot;p2-availability p2-ready&quot;&gt;현재 자료로 결과 확인&lt;/em&gt;&lt;/div&gt;
        &lt;strong&gt;정해진 공식 버전에서 시작해 등록한 파일만 바꿨는가&lt;/strong&gt;
        &lt;p&gt;&lt;b&gt;T25-R&lt;/b&gt; 과거 보관 소스 재구성 · &lt;b&gt;T25&lt;/b&gt; 공식 버전 출발점 · &lt;b&gt;T26&lt;/b&gt; 필수 커스터마이징 유지 · &lt;b&gt;T30&lt;/b&gt; 변경 기록별 BANK-OM 식별 · &lt;b&gt;T31&lt;/b&gt; BANK-OM 적용 순서 · &lt;b&gt;T40&lt;/b&gt; 등록한 변경 파일 범위 · &lt;b&gt;T41&lt;/b&gt; 중요 시스템 파일 변경 · &lt;b&gt;T93&lt;/b&gt; 실제 변경과 Manifest 일치&lt;/p&gt;
        &lt;small&gt;T25-R은 공식 변경 기록이 없는 과거 보관 소스를 다시 구성할 때만 사용합니다. 현재처럼 공식 변경 기록을 유지하는 브랜치는 T25로 확인합니다.&lt;/small&gt;
      &lt;/article&gt;
      &lt;article&gt;
        &lt;div&gt;&lt;span&gt;B · 공식 업그레이드 영향&lt;/span&gt;&lt;em class=&quot;p2-availability p2-limited&quot;&gt;영향 경로 결과만 확인&lt;/em&gt;&lt;/div&gt;
        &lt;strong&gt;새 공식 버전이 행내 커스터마이징과 관련된 파일을 바꿨는가&lt;/strong&gt;
        &lt;p&gt;&lt;b&gt;T42&lt;/b&gt; 공식 업그레이드 영향 경로 · &lt;b&gt;T43&lt;/b&gt; 커스터마이징 유지 부담 · &lt;b&gt;T93&lt;/b&gt; 경로 정책 노후화&lt;/p&gt;
        &lt;small&gt;관련 파일 변경 여부는 확인했습니다. 전체 커스터마이징 규모와 실제 충돌 비율을 자동 계산하는 연결은 아직 완료되지 않았습니다.&lt;/small&gt;
      &lt;/article&gt;
      &lt;article&gt;
        &lt;div&gt;&lt;span&gt;C · 기능 테스트&lt;/span&gt;&lt;em class=&quot;p2-availability p2-partial&quot;&gt;테스트 파일만 확인&lt;/em&gt;&lt;/div&gt;
        &lt;strong&gt;커스터마이징이 빠지거나 새로운 화면 오류가 생기면 테스트가 찾아내는가&lt;/strong&gt;
        &lt;p&gt;&lt;b&gt;T60-I&lt;/b&gt; 필수 테스트 파일 존재 · &lt;b&gt;T61&lt;/b&gt; 기능 누락 시 테스트 실패 여부 · &lt;b&gt;T62&lt;/b&gt; 테스트 결과가 나온 코드 확인 · &lt;b&gt;T63&lt;/b&gt; 공식 원본 대비 새 TypeScript 오류&lt;/p&gt;
        &lt;small&gt;현재는 등록한 Python 테스트 파일이 존재하는지만 확인했습니다. 실제 기능 실행 결과는 행내 서버와 브라우저 환경이 필요합니다.&lt;/small&gt;
      &lt;/article&gt;
      &lt;article&gt;
        &lt;div&gt;&lt;span&gt;D · 배포 전 최종 확인&lt;/span&gt;&lt;em class=&quot;p2-availability p2-pending&quot;&gt;행내 실행 결과 없음&lt;/em&gt;&lt;/div&gt;
        &lt;strong&gt;검사한 코드와 실제로 배포할 파일이 같은가&lt;/strong&gt;
        &lt;p&gt;&lt;b&gt;T90&lt;/b&gt; 업그레이드 전 과정 결과 · &lt;b&gt;T91&lt;/b&gt; 검사 산출물과 배포 산출물 일치&lt;/p&gt;
        &lt;small&gt;현재는 결과 문서 형식만 있습니다. 행내 실행 시스템이 만든 실제 로그와 배포 파일의 내용 식별값이 있어야 결과를 판단할 수 있습니다.&lt;/small&gt;
      &lt;/article&gt;
    &lt;/div&gt;
    &lt;aside class=&quot;p2-number-note&quot;&gt;
      &lt;strong&gt;T25 같은 번호는 무엇인가?&lt;/strong&gt;
      &lt;p&gt;검사기 코드와 결과 파일을 서로 연결하기 위한 내부 번호입니다. 화면의 읽는 순서를 뜻하지 않으며, 현업 사용자는 번호보다 각 검사 제목과 판정을 확인하면 됩니다.&lt;/p&gt;
    &lt;/aside&gt;
    &lt;aside class=&quot;p2-number-note&quot;&gt;
      &lt;strong&gt;T93이 두 번 나오는 이유&lt;/strong&gt;
      &lt;p&gt;한 검사 프로그램이 두 가지 질문을 처리하기 때문입니다. 이 화면에서는 “실제 변경 파일이 등록 내용과 같은가”를 &lt;b&gt;T93-범위&lt;/b&gt;, “공식 파일 이동으로 기존 검사 규칙이 낡았는가”를 &lt;b&gt;T93-정책&lt;/b&gt;으로 나눠 표시합니다.&lt;/p&gt;
    &lt;/aside&gt;
  &lt;/section&gt;

  &lt;section class=&quot;p2-section&quot; aria-labelledby=&quot;p2-table-title&quot;&gt;
    &lt;h2 id=&quot;p2-table-title&quot;&gt;검사기별 판단 방법과 한계&lt;/h2&gt;
    &lt;p class=&quot;p2-terms&quot;&gt;각 항목을 펼치면 “검사가 답하는 질문 → 판단 방법 → 이 검사만으로 알 수 없는 것” 순서로 설명합니다. 실제 판정은 마지막 실행 결과 가이드에서 확인합니다.&lt;/p&gt;
    &lt;div class=&quot;p2-check-legend&quot;&gt;
      &lt;span class=&quot;p2-checkmark&quot; aria-hidden=&quot;true&quot;&gt;✓&lt;/span&gt;
      &lt;p&gt;&lt;b&gt;체크는 현재 OM_TEMP 1.13.1 후보에 결속된 결과 파일을 지금도 근거로 사용할 수 있다는 뜻입니다.&lt;/b&gt; 체크가 곧 통과를 뜻하지는 않습니다. 체크가 없는 항목은 검사 프로그램이 있더라도 현재 필요한 행내 실행 결과가 없거나, 검사 입력 규칙이 바뀐 뒤 같은 후보로 다시 실행하지 못해 판정을 확정하지 못한 상태입니다.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;p2-check-list&quot;&gt;
      &lt;h3&gt;A · 공식 원본과 행내 커스터마이징 소스 확인&lt;/h3&gt;
      &lt;details class=&quot;p2-check&quot;&gt;
        &lt;summary&gt;&lt;b&gt;T25-R · 과거 보관 소스 재구성 확인&lt;/b&gt;&lt;span&gt;변경 기록이 없는 과거 행내 소스를 공식 원본 위에서 다시 만들 수 있는가&lt;/span&gt;&lt;em class=&quot;p2-result-state p2-state-na&quot;&gt;현재 검사 대상 아님&lt;/em&gt;&lt;/summary&gt;
        &lt;div class=&quot;p2-check-body&quot;&gt;
          &lt;div&gt;&lt;strong&gt;이 검사가 답하는 질문&lt;/strong&gt;&lt;p&gt;과거에 파일 상태만 보관하고 변경 기록은 남기지 못한 행내 소스를, 공식 원본과 등록자료만으로 같은 상태까지 다시 만들 수 있는지 확인합니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;어떻게 판단하나&lt;/strong&gt;&lt;p&gt;다시 만든 코드와 과거 보관 소스의 파일 내용을 비교합니다. JSON은 공백과 항목 순서가 달라도 실제 값이 같으면 같은 것으로 판단합니다. Java·TypeScript 등 나머지 파일은 내용이 완전히 같아야 통과합니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;이 검사만으로 알 수 없는 것&lt;/strong&gt;&lt;p&gt;빈 줄처럼 기능에 영향이 없는 차이도 불일치로 판단할 수 있습니다. 현재 OM_TEMP처럼 공식 변경 기록을 유지하는 브랜치에는 이 검사를 사용하지 않고 T25를 사용합니다.&lt;/p&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/details&gt;
      &lt;details class=&quot;p2-check is-evidenced&quot;&gt;
        &lt;summary&gt;&lt;b&gt;T25 · 공식 버전 출발점 확인&lt;/b&gt;&lt;span&gt;검사할 코드가 지정한 공식 버전에서 출발했는가&lt;/span&gt;&lt;span class=&quot;p2-checkmark&quot; role=&quot;img&quot; aria-label=&quot;현재 OM_TEMP 결과 파일 있음&quot;&gt;✓&lt;/span&gt;&lt;/summary&gt;
        &lt;div class=&quot;p2-check-body&quot;&gt;
          &lt;div&gt;&lt;strong&gt;이 검사가 답하는 질문&lt;/strong&gt;&lt;p&gt;검사할 행내 커스터마이징 브랜치가 지정한 공식 버전에서 시작했는지 확인합니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;어떻게 판단하나&lt;/strong&gt;&lt;p&gt;검사할 행내 코드의 변경 기록을 거슬러 올라가 지정한 공식 버전이 실제 출발점으로 포함되어 있는지 확인합니다. 이어서 검사를 시작할 때 기록한 코드 버전과 현재 파일 상태가 그대로인지 확인합니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;판정 기준&lt;/strong&gt;&lt;p&gt;공식 버전에서 시작했고 검사 도중 코드가 바뀌지 않았으면 PASS입니다. 출발점이 다르거나 검사 도중 파일 상태가 달라졌으면 결과를 신뢰할 수 없으므로 중단합니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;이 검사만으로 알 수 없는 것&lt;/strong&gt;&lt;p&gt;올바른 공식 버전에서 시작했다는 사실만 확인합니다. 충돌 해결이 정확한지와 기능이 정상인지는 다른 검사와 기능 테스트가 확인해야 합니다.&lt;/p&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/details&gt;
      &lt;details class=&quot;p2-check is-evidenced&quot;&gt;
        &lt;summary&gt;&lt;b&gt;T26 · 필수 커스터마이징 유지 확인&lt;/b&gt;&lt;span&gt;업그레이드 후에도 필수 파일과 테스트 연결이 유지됐는가&lt;/span&gt;&lt;span class=&quot;p2-checkmark&quot; role=&quot;img&quot; aria-label=&quot;현재 OM_TEMP 결과 파일 있음&quot;&gt;✓&lt;/span&gt;&lt;/summary&gt;
        &lt;div class=&quot;p2-check-body&quot;&gt;
          &lt;div&gt;&lt;strong&gt;이 검사가 답하는 질문&lt;/strong&gt;&lt;p&gt;현재 사용하기로 등록한 BANK-OM 기능의 필수 코드와 테스트 연결이 업그레이드 과정에서 빠지지 않았는지 확인합니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;어떻게 판단하나&lt;/strong&gt;&lt;p&gt;Manifest에서 “반드시 커스터마이징 상태로 남아야 한다”고 지정한 파일이 실제로 존재하며 공식 원본과 다른지 확인합니다. 또한 해당 기능을 확인할 테스트가 등록되어 있는지 확인합니다.&lt;/p&gt;&lt;/div&gt;

        &lt;summary&gt;&lt;b&gt;T93-정책 · 검사 경로 최신성 확인&lt;/b&gt;&lt;span&gt;공식 파일 이동 때문에 기존 검사 대상이 더 이상 맞지 않는가&lt;/span&gt;&lt;em class=&quot;p2-result-state p2-state-not-run&quot;&gt;현재 OM_TEMP 결과 없음&lt;/em&gt;&lt;/summary&gt;
        &lt;div class=&quot;p2-check-body&quot;&gt;
          &lt;div&gt;&lt;strong&gt;이 검사가 답하는 질문&lt;/strong&gt;&lt;p&gt;공식 버전에서 파일이 이동하거나 새 모듈이 추가되어, Manifest와 보안 검사에 등록한 파일 위치가 더 이상 맞지 않는지 확인합니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;어떻게 판단하나&lt;/strong&gt;&lt;p&gt;등록한 각 파일 위치가 새 공식 버전에서도 실제 파일과 연결되는지 확인합니다. 새 최상위 폴더가 생겼는데 어느 담당 영역인지 등록되지 않았다면 정상 검사를 계속할 수 없다고 판단합니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;판정 기준&lt;/strong&gt;&lt;p&gt;더 이상 실제 파일과 연결되지 않는 검사 위치는 APPROVAL입니다. 담당 영역을 알 수 없는 새 모듈은 검사를 신뢰할 수 없으므로 중단합니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;이 검사만으로 알 수 없는 것&lt;/strong&gt;&lt;p&gt;비슷한 이름의 다른 파일과 우연히 연결될 수 있습니다. 현재는 업그레이드 영향 확인 위치만 검사하며, 보안·인증 등 민감 경로의 최신성 확인은 아직 통합 실행에 연결되지 않았습니다.&lt;/p&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/details&gt;

      &lt;h3&gt;C · 행내 테스트 환경에서 확인&lt;/h3&gt;
      &lt;details class=&quot;p2-check is-evidenced&quot;&gt;
        &lt;summary&gt;&lt;b&gt;T60-I · 필수 테스트 파일 확인&lt;/b&gt;&lt;span&gt;등록한 업무 테스트의 파일과 테스트 항목이 실제로 존재하는가&lt;/span&gt;&lt;span class=&quot;p2-checkmark&quot; role=&quot;img&quot; aria-label=&quot;현재 OM_TEMP 결과 파일 있음&quot;&gt;✓&lt;/span&gt;&lt;/summary&gt;
        &lt;div class=&quot;p2-check-body&quot;&gt;
          &lt;div&gt;&lt;strong&gt;이 검사가 답하는 질문&lt;/strong&gt;&lt;p&gt;각 커스터마이징의 핵심 업무 동작을 확인하기로 등록한 테스트가 이름만 있는 것이 아니라 실제 코드로 존재하는지 확인합니다. 현재 등록된 9개는 InstanceCode API·검색, QueryReport 연결, Data Assertions API·화면, 은행 컬럼 API·화면, 한글 입력 화면, Sybase·Tibero 연결 스키마를 확인합니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;어떻게 판단하나&lt;/strong&gt;&lt;p&gt;&lt;code&gt;contracts.yaml&lt;/code&gt;에 등록한 Python 테스트 파일을 열 수 있는지, 파일에 문법 오류가 없는지, 등록한 이름의 테스트 항목이 실제로 있는지 확인합니다. 이 단계에서는 테스트를 실행하지 않습니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;판정 기준&lt;/strong&gt;&lt;p&gt;파일이 없거나, Python 코드로 읽을 수 없거나, 등록한 테스트 항목을 찾을 수 없으면 BLOCK입니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;이 검사만으로 알 수 없는 것&lt;/strong&gt;&lt;p&gt;현재 T60-I는 &lt;code&gt;.py&lt;/code&gt; 파일만 허용하므로 Java JUnit이나 TypeScript Jest 테스트의 존재는 확인하지 않습니다. Python 테스트가 Java API와 TypeScript 화면을 실제로 호출할 수는 있지만, 다른 테스트 언어를 직접 등록하려면 검사기에 언어·프레임워크별 확인 방식을 추가해야 합니다. 또한 현재는 계약에서 파생된 테스트만 확인하므로 Manifest의 &lt;code&gt;direct_tests&lt;/code&gt;도 같은 방식으로 확인하도록 보완해야 합니다.&lt;/p&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/details&gt;
      &lt;details class=&quot;p2-check&quot;&gt;
        &lt;summary&gt;&lt;b&gt;T61 · 테스트의 누락 탐지 능력 확인&lt;/b&gt;&lt;span&gt;커스터마이징을 제거하면 해당 테스트가 실제로 실패하는가&lt;/span&gt;&lt;em class=&quot;p2-result-state p2-state-partial&quot;&gt;과거 자료 일부만 확인&lt;/em&gt;&lt;/summary&gt;
        &lt;div class=&quot;p2-check-body&quot;&gt;
          &lt;div&gt;&lt;strong&gt;이 검사가 답하는 질문&lt;/strong&gt;&lt;p&gt;등록한 테스트가 단순히 항상 통과하는 테스트가 아니라, BANK-OM 기능이 빠졌을 때 실제로 문제를 발견하는지 확인합니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;어떻게 판단하나&lt;/strong&gt;&lt;p&gt;하나는 BANK-OM 기능이 포함된 코드, 다른 하나는 해당 기능만 제거한 코드로 준비합니다. 같은 테스트를 실행해 포함된 코드는 통과하고 제거한 코드만 예상한 이유로 실패하는지 확인합니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;판정 기준&lt;/strong&gt;&lt;p&gt;기능 포함본은 통과하고 제거본만 실패하면 PASS입니다. 기능을 제거했는데도 테스트가 통과하면 누락을 발견하지 못하는 테스트이므로 BLOCK입니다. 환경 문제로 실행하지 못했으면 판정을 보류합니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;이 검사만으로 알 수 없는 것&lt;/strong&gt;&lt;p&gt;제거본의 다른 장애를 커스터마이징 누락으로 오인할 수 있습니다. 따라서 커스터마이징 포함본은 통과하고 제거본만 미리 정한 오류 종류와 메시지로 실패하는지, 같은 환경에서 반복 확인해야 합니다.&lt;/p&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/details&gt;
      &lt;details class=&quot;p2-check&quot;&gt;
        &lt;summary&gt;&lt;b&gt;T62 · 테스트 결과의 대상 확인&lt;/b&gt;&lt;span&gt;이 테스트 결과가 정확히 지금 검사하는 코드에서 나온 것인가&lt;/span&gt;&lt;em class=&quot;p2-result-state p2-state-not-run&quot;&gt;행내 실행 결과 필요&lt;/em&gt;&lt;/summary&gt;
        &lt;div class=&quot;p2-check-body&quot;&gt;
          &lt;div&gt;&lt;strong&gt;이 검사가 답하는 질문&lt;/strong&gt;&lt;p&gt;테스트 결과가 정확히 어떤 소스 코드와 배포 파일, 어떤 검사기와 테스트 코드에서 나온 것인지 확인합니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;어떻게 판단하나&lt;/strong&gt;&lt;p&gt;테스트 결과에 행내 코드 버전 번호, 배포 파일의 내용 식별값, 검사기 버전, 테스트 목록 버전을 함께 기록합니다. 기록된 값이 현재 검사 대상과 같은지 확인합니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;판정 기준&lt;/strong&gt;&lt;p&gt;필수 테스트가 빠지거나 실패했으면 BLOCK입니다. 결과가 다른 코드나 배포 파일에서 나온 것이면 결과를 신뢰할 수 없으므로 중단합니다. 중요한 테스트가 재실행 후에만 통과하면 APPROVAL입니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;이 검사만으로 알 수 없는 것&lt;/strong&gt;&lt;p&gt;현재 결과에는 DB·검색엔진·설정 버전처럼 실행 환경을 구분하는 값이 없습니다. 같은 코드라도 환경이 다르면 결과가 달라질 수 있으므로 운영 적용 전 환경 정보도 함께 고정해야 합니다.&lt;/p&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/details&gt;
      &lt;details class=&quot;p2-check&quot;&gt;
        &lt;summary&gt;&lt;b&gt;T63 · 공식 원본 대비 새 TypeScript 오류 확인&lt;/b&gt;&lt;span&gt;행내 코드에 공식 원본에는 없는 TypeScript 오류가 생겼는가&lt;/span&gt;&lt;em class=&quot;p2-result-state p2-state-not-run&quot;&gt;현재 OM_TEMP 결과 없음&lt;/em&gt;&lt;/summary&gt;
        &lt;div class=&quot;p2-check-body&quot;&gt;
          &lt;div&gt;&lt;strong&gt;이 검사가 답하는 질문&lt;/strong&gt;&lt;p&gt;행내 커스터마이징 때문에 공식 원본보다 새로운 TypeScript 오류가 생겼는지 확인합니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;어떻게 판단하나&lt;/strong&gt;&lt;p&gt;공식 원본과 행내 코드에 같은 화면 코드 검사를 실행합니다. 오류가 발생한 파일 위치와 오류 종류를 비교해 행내 코드에만 새로 생긴 오류를 찾습니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;판정 기준&lt;/strong&gt;&lt;p&gt;행내 코드에만 생긴 오류는 BLOCK입니다. 공식 원본부터 있던 오류가 남아 있으면 자동 통과하지 않고 APPROVAL로 표시합니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;이 검사만으로 알 수 없는 것&lt;/strong&gt;&lt;p&gt;파일이 이동하면 같은 오류도 새로운 오류처럼 보일 수 있습니다. 또한 두 코드를 서로 다른 Node·Yarn 환경에서 검사하면 공정한 비교가 아니므로 동일 환경에서 실행해야 합니다.&lt;/p&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/details&gt;

      &lt;h3&gt;D · 업그레이드 완료와 배포 전 확인&lt;/h3&gt;
      &lt;details class=&quot;p2-check&quot;&gt;
        &lt;summary&gt;&lt;b&gt;T90 · 업그레이드 전 과정 결과 확인&lt;/b&gt;&lt;span&gt;정해진 12단계가 같은 코드와 환경에서 모두 완료됐는가&lt;/span&gt;&lt;em class=&quot;p2-result-state p2-state-not-run&quot;&gt;행내 실행 필요&lt;/em&gt;&lt;/summary&gt;
        &lt;div class=&quot;p2-check-body&quot;&gt;
          &lt;div&gt;&lt;strong&gt;이 검사가 답하는 질문&lt;/strong&gt;&lt;p&gt;실제 데이터와 행내 환경에서 업그레이드, DB·검색·권한·API·수집·복구가 모두 정상인지 확인합니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;어떻게 판단하나&lt;/strong&gt;&lt;p&gt;운영 데이터 복원부터 장애 시 이전 버전 복구 연습까지 12단계 결과가 모두 통과인지 확인합니다. 각 결과가 지금 검사하는 코드와 배포 파일에서 나온 것인지도 함께 확인합니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;판정 기준&lt;/strong&gt;&lt;p&gt;필수 단계가 빠지거나 실패했으면 BLOCK입니다. 다른 코드나 배포 파일의 결과가 섞였으면 결과를 신뢰할 수 없으므로 중단합니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;이 검사만으로 알 수 없는 것&lt;/strong&gt;&lt;p&gt;현재 검사기는 12단계를 직접 실행하지 않고 제출된 결과 문서의 형식과 상태만 읽습니다. 실제 로그가 정확한지는 행내 실행 시스템과 담당자가 보증해야 합니다.&lt;/p&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/details&gt;
      &lt;details class=&quot;p2-check&quot;&gt;
        &lt;summary&gt;&lt;b&gt;T91 · 검사 대상과 배포 대상 일치 확인&lt;/b&gt;&lt;span&gt;검사를 통과한 파일과 실제 배포할 파일이 정확히 같은가&lt;/span&gt;&lt;em class=&quot;p2-result-state p2-state-not-run&quot;&gt;행내 배포 정보 필요&lt;/em&gt;&lt;/summary&gt;
        &lt;div class=&quot;p2-check-body&quot;&gt;
          &lt;div&gt;&lt;strong&gt;이 검사가 답하는 질문&lt;/strong&gt;&lt;p&gt;검사를 마친 소스와 이미지·Helm 설정을 다시 만들지 않고 그대로 배포하는지 확인합니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;어떻게 판단하나&lt;/strong&gt;&lt;p&gt;검사를 통과한 코드, 컨테이너 이미지, Helm 설정, 검사 결과의 내용 식별값을 저장합니다. 배포 직전 파일의 식별값과 하나씩 비교합니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;판정 기준&lt;/strong&gt;&lt;p&gt;하나라도 다르거나 검사 후 다시 빌드했다면 BLOCK입니다. 모두 같아야 배포 승인 검토를 계속할 수 있습니다.&lt;/p&gt;&lt;/div&gt;
          &lt;div&gt;&lt;strong&gt;이 검사만으로 알 수 없는 것&lt;/strong&gt;&lt;p&gt;식별값을 신뢰할 수 있는 시스템에서 읽었다는 보장이 필요합니다. 외부망에서 내부망으로 파일을 옮기는 과정의 위·변조 여부는 별도의 반입 검증이 확인해야 합니다.&lt;/p&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/details&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;details class=&quot;p2-details p2-io-details&quot;&gt;
    &lt;summary&gt;검사기별 입력과 출력 한눈에 보기&lt;/summary&gt;
    &lt;p&gt;각 검사는 결과 파일에 &lt;strong&gt;검사명, 판정, 판단 이유&lt;/strong&gt;를 남깁니다. PASS는 통과, APPROVAL은 담당자 확인 필요, BLOCK은 수정 전까지 다음 단계 중단을 뜻합니다. 검사에 필요한 자료가 없거나 서로 맞지 않으면 &lt;strong&gt;ANALYSIS ERROR(판단 불가)&lt;/strong&gt;로 중단합니다.&lt;/p&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table table-sm p2-io-table&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;검사&lt;/th&gt;&lt;th&gt;검사 전에 준비할 자료&lt;/th&gt;&lt;th&gt;검사기가 알려주는 것&lt;/th&gt;&lt;th&gt;결과를 어떻게 읽나&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;&lt;strong&gt;T25-R&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;공식 원본, 과거 보관 소스, Manifest, 전체 변경 파일 목록&lt;/td&gt;&lt;td&gt;과거 행내 소스를 같은 내용으로 다시 만들었는지&lt;/td&gt;&lt;td&gt;PASS는 재구성 결과가 과거 보관 소스와 같다는 뜻입니다. 기능 정상까지 뜻하지는 않습니다.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;strong&gt;T25&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;출발점으로 지정한 공식 버전, 검사할 행내 코드, 검사 시작 시 저장한 파일 상태&lt;/td&gt;&lt;td&gt;행내 코드가 지정한 공식 버전에서 시작했는지와 검사 도중 바뀌지 않았는지&lt;/td&gt;&lt;td&gt;공식 버전이 이력에 없으면 BLOCK입니다. 기록한 Git 번호·파일 상태가 현재 코드와 다르거나 필요한 commit을 읽을 수 없으면 판단 불가로 중단합니다.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;strong&gt;T26&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;사용 중인 BANK-OM 목록, Manifest, Contract, 공식 코드와 행내 코드&lt;/td&gt;&lt;td&gt;BANK-OM ID별 필수 파일과 테스트 연결의 누락 여부&lt;/td&gt;&lt;td&gt;필수 항목이 없으면 BLOCK입니다. 선택 항목의 이상은 APPROVAL로 담당자 확인을 요구합니다.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;strong&gt;T60-I&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;등록한 Python 테스트 파일 위치와 테스트 이름, 실제 테스트 코드&lt;/td&gt;&lt;td&gt;테스트 파일·테스트 항목의 존재 여부와 문법 오류&lt;/td&gt;&lt;td&gt;PASS는 테스트 코드가 존재한다는 뜻입니다. 실제 실행 성공을 뜻하지는 않습니다.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;strong&gt;T30&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;공식 버전 이후의 행내 변경 기록과 각 변경의 메시지·수정 파일&lt;/td&gt;&lt;td&gt;BANK-OM ID가 없거나 여러 개 적힌 변경 기록&lt;/td&gt;&lt;td&gt;위반이 있으면 BLOCK이며 해당 변경 기록을 정리한 뒤 다시 검사합니다.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;strong&gt;T31&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;BANK-OM 적용 순서, ID 등록 상태, 후속 수정 허용 여부와 선행 관계&lt;/td&gt;&lt;td&gt;미등록 ID, 폐기 ID 재사용, 잘못된 적용 순서와 모순 관계&lt;/td&gt;&lt;td&gt;위반이 없으면 PASS입니다. 등록하지 않은 업무 관계는 검사기가 새로 추론하지 못합니다.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;strong&gt;T40&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;실제 수정 파일과 Manifest의 전체 변경 파일·필수 변경 파일&lt;/td&gt;&lt;td&gt;등록하지 않은 수정 파일, 최종 코드에서 사라진 필수 변경, 실제로 수정되지 않은 비필수 등록 파일&lt;/td&gt;&lt;td&gt;미등록 수정·필수 변경 누락은 BLOCK입니다. 실제로 수정되지 않은 비필수 등록 파일은 APPROVAL로 담당자 확인을 요구합니다.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;strong&gt;T41&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;실제 수정 파일과 보안·인증·설정·DB 경로별 사전 위험 등급&lt;/td&gt;&lt;td&gt;어떤 위험 경로를 수정했는지와 그 사유&lt;/td&gt;&lt;td&gt;변경 금지는 BLOCK, 담당자 검토 대상은 APPROVAL입니다. 위험 기준표가 없으면 판단 불가입니다.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;strong&gt;T42&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;이전·새 공식 버전과 Manifest의 업그레이드 확인 대상&lt;/td&gt;&lt;td&gt;새 공식 버전에서 바뀐 커스터마이징 관련 파일·설정·라이브러리&lt;/td&gt;&lt;td&gt;관련 변경이 없으면 PASS, 있으면 충돌 확정이 아니라 영향 검토가 필요한 APPROVAL입니다.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;strong&gt;T43&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;공식 코드 수정 기능 수·변경량·공유 파일 수, 실제 충돌 비율, 사전 기준값&lt;/td&gt;&lt;td&gt;커스터마이징 유지 부담이 주의 또는 중단 기준을 넘었는지&lt;/td&gt;&lt;td&gt;주의 기준은 APPROVAL, 중단 기준은 BLOCK입니다. 현재 충돌 비율은 사용자가 입력합니다.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;strong&gt;T93&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;새 공식 버전의 파일 목록, Manifest, 보안 경로 규칙, BANK-OM별 실제 수정 파일&lt;/td&gt;&lt;td&gt;등록에서 빠진 실제 변경, 더 이상 맞지 않는 검사 위치, 담당 영역이 없는 새 모듈&lt;/td&gt;&lt;td&gt;실제 미등록 변경은 BLOCK입니다. 낡은 검사 위치는 APPROVAL이며 담당자가 갱신해야 합니다.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;strong&gt;T61&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;BANK-OM 기능 포함본과 제거본, 같은 필수 테스트와 실행 결과&lt;/td&gt;&lt;td&gt;기능 제거 시 테스트가 예상대로 실패하는지&lt;/td&gt;&lt;td&gt;포함본은 통과하고 제거본만 실패해야 PASS입니다. 제거본도 통과하면 BLOCK입니다.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;strong&gt;T62&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;검사 시작 시 고정한 코드·배포 파일 정보, 필수 테스트 목록, 실제 실행 결과&lt;/td&gt;&lt;td&gt;테스트 누락·실패와 다른 코드 또는 배포 파일의 결과가 섞였는지&lt;/td&gt;&lt;td&gt;필수 테스트 실패·누락은 BLOCK입니다. 검사 대상과 결과 대상이 다르면 판단 불가입니다.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;strong&gt;T63&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;같은 환경에서 실행한 공식 코드와 행내 코드의 전체 TypeScript 검사 로그&lt;/td&gt;&lt;td&gt;행내 코드에만 새로 생긴 오류&lt;/td&gt;&lt;td&gt;새 오류는 BLOCK입니다. 공식 코드부터 있던 오류가 남아 있으면 APPROVAL입니다.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;strong&gt;T90&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;행내 업그레이드 12단계 실행 결과와 각 결과가 사용한 코드·배포 파일 정보&lt;/td&gt;&lt;td&gt;빠지거나 실패한 단계와 다른 대상의 결과가 섞였는지&lt;/td&gt;&lt;td&gt;필수 단계 실패·누락은 BLOCK입니다. 대상이 서로 다르면 판단 불가입니다.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;strong&gt;T91&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;검사를 통과한 코드·이미지·설정 파일과 실제 배포할 파일의 내용 식별값&lt;/td&gt;&lt;td&gt;검사한 파일과 실제 배포할 파일이 정확히 같은지&lt;/td&gt;&lt;td&gt;모두 같아야 배포 승인 검토를 계속할 수 있습니다. 하나라도 다르면 BLOCK입니다.&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/details&gt;

  &lt;details class=&quot;p2-details&quot;&gt;
    &lt;summary&gt;검사기 코드 검토 범위&lt;/summary&gt;
    &lt;p&gt;T25-R·T25·T26·T60-I·T30·T31·T40·T41·T42·T43·T61·T62·T63·T90·T91·T93의 구현 코드와 관련 단위 테스트를 확인했습니다. 관련 단위 테스트는 통과했지만, 단위 테스트 통과가 위의 운영 환경 예외까지 없다는 의미는 아닙니다.&lt;/p&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });

    initialize();
