b,

  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);

  margin: 0 !important;

  border: 0 !important;
  border-radius: 0 !important;

  top: 0;
  left: 0;
  width: max-content;

  background: var(--popover);

.btn {

.btn:not(:disabled):hover {

  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;om-phase3&quot; data-artifact-status=&quot;review-draft&quot;&gt;
  &lt;header class=&quot;p3-hero&quot;&gt;
    &lt;span class=&quot;viz-badge&quot;&gt;3차 검사결과 검토본&lt;/span&gt;
    &lt;h1&gt;현재 소스 검사 결과와 책임자 판단 기준&lt;/h1&gt;
    &lt;p&gt;실제 제품 소스와 로컬 검사 결과를 연결해 설명합니다. 실제 Git 화면으로 병합 전후 전체 과정을 보여주는 시연은 3차를 확정한 뒤 4차에서 별도로 진행합니다.&lt;/p&gt;
    &lt;div class=&quot;p3-final&quot; role=&quot;status&quot;&gt;
      &lt;div&gt;
        &lt;span&gt;현재 최종 판단&lt;/span&gt;
        &lt;strong&gt;BLOCK · 운영 배포 진행 불가&lt;/strong&gt;
      &lt;/div&gt;
      &lt;p&gt;소스 변경 검사는 통과했지만 실제 공식 업그레이드, 행내 API·화면·DB 테스트와 배포본 일치 검사가 남아 있습니다.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/header&gt;

  &lt;section class=&quot;p3-section&quot; aria-labelledby=&quot;p3-input-title&quot;&gt;
    &lt;div class=&quot;p3-heading&quot;&gt;
      &lt;span&gt;01&lt;/span&gt;
      &lt;div&gt;
        &lt;h2 id=&quot;p3-input-title&quot;&gt;이번 문서에서 확인하는 코드&lt;/h2&gt;
        &lt;p&gt;어떤 공식 원본과 어떤 행내 코드 상태를 비교했는지 먼저 고정합니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table table-sm p3-input-table&quot;&gt;
        &lt;thead&gt;
          &lt;tr&gt;&lt;th&gt;구분&lt;/th&gt;&lt;th&gt;저장소·버전&lt;/th&gt;&lt;th&gt;이번 문서에서의 의미&lt;/th&gt;&lt;/tr&gt;
        &lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;
            &lt;td&gt;공식 원본&lt;/td&gt;
            &lt;td&gt;&lt;code&gt;open-metadata/OpenMetadata&lt;/code&gt;&lt;br&gt;&lt;code&gt;1.13.1-release · afcb2d2…&lt;/code&gt;&lt;/td&gt;
            &lt;td&gt;행내 커스터마이징을 적용하기 전 기준 코드&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;행내 배포 준비 코드&lt;/td&gt;
            &lt;td&gt;&lt;code&gt;easyseop/OpenMetadata&lt;/code&gt;&lt;br&gt;&lt;code&gt;codex/bank-vendor-1.13.1-rebuild · 849ae756…&lt;/code&gt;&lt;/td&gt;
            &lt;td&gt;BANK-OM-001~011이 적용된 소스 검사 대상이며 운영 배포 완료 상태는 아님&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;다음 공식 버전&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;아직 지정하지 않음&lt;/strong&gt;&lt;/td&gt;
            &lt;td&gt;실제 업그레이드 비교와 충돌 측정은 아직 실행할 수 없음&lt;/td&gt;
          &lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;p3-section&quot; aria-labelledby=&quot;p3-flow-title&quot;&gt;
    &lt;div class=&quot;p3-heading&quot;&gt;
      &lt;span&gt;02&lt;/span&gt;
      &lt;div&gt;
        &lt;h2 id=&quot;p3-flow-title&quot;&gt;현재 단계별 증거 상태&lt;/h2&gt;
        &lt;p&gt;완료된 소스 검사와 아직 다음 공식 버전·행내 환경이 필요한 단계를 구분합니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;ol class=&quot;p3-flow&quot;&gt;
      &lt;li class=&quot;p3-done&quot;&gt;&lt;span&gt;1&lt;/span&gt;&lt;strong&gt;현재 코드 확인&lt;/strong&gt;&lt;small&gt;완료&lt;/small&gt;&lt;/li&gt;
      &lt;li class=&quot;p3-pending&quot;&gt;&lt;span&gt;2&lt;/span&gt;&lt;strong&gt;새 공식 버전 지정&lt;/strong&gt;&lt;small&gt;대기&lt;/small&gt;&lt;/li&gt;
      &lt;li class=&quot;p3-pending&quot;&gt;&lt;span&gt;3&lt;/span&gt;&lt;strong&gt;커스터마이징 재적용&lt;/strong&gt;&lt;small&gt;대기&lt;/small&gt;&lt;/li&gt;
      &lt;li class=&quot;p3-done&quot;&gt;&lt;span&gt;4&lt;/span&gt;&lt;strong&gt;Manifest·Git 확인&lt;/strong&gt;&lt;small&gt;완료&lt;/small&gt;&lt;/li&gt;
      &lt;li class=&quot;p3-done&quot;&gt;&lt;span&gt;5&lt;/span&gt;&lt;strong&gt;소스 검사 실행&lt;/strong&gt;&lt;small&gt;완료&lt;/small&gt;&lt;/li&gt;
      &lt;li class=&quot;p3-partial&quot;&gt;&lt;span&gt;6&lt;/span&gt;&lt;strong&gt;행내 동작 검사&lt;/strong&gt;&lt;small&gt;일부 완료&lt;/small&gt;&lt;/li&gt;
      &lt;li class=&quot;p3-blocked&quot;&gt;&lt;span&gt;7&lt;/span&gt;&lt;strong&gt;배포 판단&lt;/strong&gt;&lt;small&gt;중단&lt;/small&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/section&gt;

  &lt;section class=&quot;p3-section&quot; aria-labelledby=&quot;p3-code-title&quot;&gt;
    &lt;div class=&quot;p3-heading&quot;&gt;
      &lt;span&gt;03&lt;/span&gt;
      &lt;div&gt;
        &lt;h2 id=&quot;p3-code-title&quot;&gt;실제 코드가 어떻게 달라졌나&lt;/h2&gt;
        &lt;p&gt;실제 Git diff에서 BANK-OM-001의 InstanceCode 관련 부분을 발췌해 설명용 좌우 비교로 배치했습니다. 전체 11개 커스터마이징 중 한 사례입니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;p3-relation&quot; aria-label=&quot;InstanceCode 코드 연결 관계&quot;&gt;
      &lt;div&gt;&lt;span&gt;공식 공용 코드&lt;/span&gt;&lt;strong&gt;Entity.java&lt;/strong&gt;&lt;p&gt;OpenMetadata가 인식할 엔티티 이름에 &lt;code&gt;instanceCode&lt;/code&gt;를 연결합니다.&lt;/p&gt;&lt;/div&gt;
      &lt;b aria-hidden=&quot;true&quot;&gt;→&lt;/b&gt;
      &lt;div&gt;&lt;span&gt;행내 추가 API 코드&lt;/span&gt;&lt;strong&gt;InstanceCodeResource.java&lt;/strong&gt;&lt;p&gt;&lt;code&gt;/v1/instanceCodes&lt;/code&gt; API와 조회·등록·변경 동작을 제공합니다.&lt;/p&gt;&lt;/div&gt;
      &lt;b aria-hidden=&quot;true&quot;&gt;→&lt;/b&gt;
      &lt;div&gt;&lt;span&gt;행내 추가 스키마&lt;/span&gt;&lt;strong&gt;instanceCode.json&lt;/strong&gt;&lt;p&gt;InstanceCode 데이터의 필드와 형식을 정의합니다.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;details class=&quot;p3-details&quot; open&gt;
      &lt;summary&gt;Entity.java · 공식 공용 파일의 실제 변경&lt;/summary&gt;
      &lt;div class=&quot;p3-diff&quot; aria-label=&quot;Entity.java 좌우 코드 비교&quot;&gt;
        &lt;div&gt;
          &lt;span&gt;공식 원본 · afcb2d2…&lt;/span&gt;
          &lt;pre&gt;&lt;code&gt;public static final String FILE = &quot;file&quot;;
public static final String SPREADSHEET = &quot;spreadsheet&quot;;
public static final String WORKSHEET = &quot;worksheet&quot;;

public static final String GLOSSARY = &quot;glossary&quot;;&lt;/code&gt;&lt;/pre&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;span&gt;행내 코드 · a2566fac…에서 추가&lt;/span&gt;
          &lt;pre&gt;&lt;code&gt;public static final String FILE = &quot;file&quot;;
public static final String SPREADSHEET = &quot;spreadsheet&quot;;
public static final String WORKSHEET = &quot;worksheet&quot;;
&lt;mark&gt;public static final String INSTANCE_CODE = &quot;instanceCode&quot;;&lt;/mark&gt;

public static final String GLOSSARY = &quot;glossary&quot;;&lt;/code&gt;&lt;/pre&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;p3-caption&quot;&gt;이 변경으로 새 API 코드가 &lt;code&gt;Entity.INSTANCE_CODE&lt;/code&gt;를 사용해 OpenMetadata의 공통 엔티티 처리 구조에 연결됩니다.&lt;/p&gt;
    &lt;/details&gt;

    &lt;details class=&quot;p3-details&quot;&gt;
      &lt;summary&gt;InstanceCodeResource.java · 커스터마이징으로 추가된 실제 파일&lt;/summary&gt;
      &lt;div class=&quot;p3-diff&quot; aria-label=&quot;InstanceCodeResource.java 좌우 코드 비교&quot;&gt;
        &lt;div&gt;
          &lt;span&gt;공식 원본&lt;/span&gt;
          &lt;pre&gt;&lt;code&gt;파일 없음

공식 1.13.1에는
InstanceCode 전용 API 파일이 없습니다.&lt;/code&gt;&lt;/pre&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;span&gt;행내 코드 · 새 파일 527줄&lt;/span&gt;
          &lt;pre&gt;&lt;code&gt;&lt;mark&gt;@Path(&quot;/v1/instanceCodes&quot;)&lt;/mark&gt;
@Collection(name = &quot;instanceCodes&quot;)
public class InstanceCodeResource
    extends EntityResource&amp;lt;InstanceCode,
      InstanceCodeRepository&amp;gt; {

  public InstanceCodeResource(
      Authorizer authorizer, Limits limits) {
    &lt;mark&gt;super(Entity.INSTANCE_CODE, authorizer, limits);&lt;/mark&gt;
  }
}&lt;/code&gt;&lt;/pre&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;p3-caption&quot;&gt;&lt;code&gt;Entity.java&lt;/code&gt;의 공통 등록값과 새 API 파일은 서로 독립된 변경이 아니라 함께 동작하는 코드입니다.&lt;/p&gt;
    &lt;/details&gt;
  &lt;/section&gt;

  &lt;section class=&quot;p3-section&quot; aria-labelledby=&quot;p3-record-title&quot;&gt;
    &lt;div class=&quot;p3-heading&quot;&gt;
      &lt;span&gt;04&lt;/span&gt;
      &lt;div&gt;
        &lt;h2 id=&quot;p3-record-title&quot;&gt;변경관리표와 Git 기록이 어떻게 연결되나&lt;/h2&gt;
        &lt;p&gt;BANK-OM ID는 업무 기능 번호이고, Git commit SHA는 해당 코드 상태를 식별하는 값입니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;p3-record-grid&quot;&gt;
      &lt;div&gt;
        &lt;strong&gt;1. BANK-OM-001 Manifest&lt;/strong&gt;
        &lt;pre&gt;&lt;code&gt;customization_id: BANK-OM-001
status: active
kind: core-patch
title: InstanceCode

implementation:
  allowed_changed_paths:
    - .../Entity.java
    - .../InstanceCodeResource.java
    - .../instanceCode.json
  required_changed_paths:
    - .../InstanceCodeResource.java
    - .../instanceCode.json

assurance:
  contracts:
    - CONTRACT-INSTANCE-CODE&lt;/code&gt;&lt;/pre&gt;
        &lt;p&gt;실제 Manifest에는 전체 변경 파일 48개가 개별 경로로 등록돼 있으며, 화면에는 관계 설명에 필요한 대표 파일만 줄여 표시했습니다.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;strong&gt;2. 개발자가 작성하는 커밋 메시지&lt;/strong&gt;
        &lt;pre&gt;&lt;code&gt;git commit \
  -m &quot;add InstanceCode customization&quot; \
  -m &quot;Customization-ID: BANK-OM-001&quot;&lt;/code&gt;&lt;/pre&gt;
        &lt;strong&gt;3. 실제 Git 기록&lt;/strong&gt;
        &lt;pre&gt;&lt;code&gt;a2566fac32 add InstanceCode customization
Customization-ID: BANK-OM-001&lt;/code&gt;&lt;/pre&gt;
        &lt;p&gt;&lt;code&gt;BANK-OM-001&lt;/code&gt;은 사람이 발급한 기능 ID이고, &lt;code&gt;a2566fac…&lt;/code&gt;은 Git이 생성한 해당 커밋의 SHA입니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;p3-section&quot; aria-labelledby=&quot;p3-run-title&quot;&gt;
    &lt;div class=&quot;p3-heading&quot;&gt;
      &lt;span&gt;05&lt;/span&gt;
      &lt;div&gt;
        &lt;h2 id=&quot;p3-run-title&quot;&gt;검사기를 실제로 실행하면 무엇이 나오나&lt;/h2&gt;
        &lt;p&gt;아래 명령과 결과는 로컬 저장소에서 다시 실행해 확인한 소스 검사입니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;details class=&quot;p3-details&quot;&gt;
      &lt;summary&gt;실제 실행 명령 보기&lt;/summary&gt;
      &lt;pre&gt;&lt;code&gt;./.venv/bin/python \
  harness/registrations/kb-openmetadata/run_source_candidate_gates.py \
  --repo ../review-kb-openmetadata \
  --harness harness \
  --registration harness/registrations/kb-openmetadata \
  --layout harness/policies/repository-layout.yaml \
  --sensitive-zones harness/policies/sensitive-zones.yaml&lt;/code&gt;&lt;/pre&gt;
    &lt;/details&gt;
    &lt;div class=&quot;p3-console&quot; aria-label=&quot;실제 로컬 소스 검사 출력 요약&quot;&gt;
      &lt;div&gt;&lt;span&gt;검사 대상 코드 SHA&lt;/span&gt;&lt;code&gt;849ae756cd238f218b5e3a6c795a392305cb32ee&lt;/code&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;공식 원본 SHA&lt;/span&gt;&lt;code&gt;afcb2d2cd7e7c28f1d0ce60538c60a96f4eb9dc9&lt;/code&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;검사 대상 잠금값&lt;/span&gt;&lt;code&gt;candidate lock digest · sha256:61a3f02d3f22…&lt;/code&gt;&lt;/div&gt;
      &lt;pre&gt;&lt;code&gt;vendor-ancestry              pass
customization-survival       pass
required-test-implementations pass
commit-invariants            pass
id-invariants                pass
drift                        pass
sensitive-zones              pass
exact-scope-history          pass&lt;/code&gt;&lt;/pre&gt;
    &lt;/div&gt;
    &lt;p class=&quot;p3-caption&quot;&gt;&lt;code&gt;candidate lock digest&lt;/code&gt;는 검사 대상 commit·Git tree·공식 원본 설정이 중간에 바뀌지 않았는지 비교하는 값입니다. 위 결과는 공식 1.13.1과 현재 행내 소스의 관계를 검사한 결과이며, 다음 공식 버전 업그레이드나 행내 운영 환경의 동작 결과는 아닙니다.&lt;/p&gt;
  &lt;/section&gt;

  &lt;section class=&quot;p3-section&quot; aria-labelledby=&quot;p3-result-title&quot;&gt;
    &lt;div class=&quot;p3-heading&quot;&gt;
      &lt;span&gt;06&lt;/span&gt;
