<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" role="img"
     aria-label="체리픽과 커밋별 머지의 기록 구조 비교 도식">
  <title>체리픽과 커밋별 머지의 기록 구조 비교</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#7d8a91"/>
    </marker>
    <marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#0d5f63"/>
    </marker>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#b0761f"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
      .h{font-size:19px;font-weight:700;fill:#171d21}
      .sub{font-size:12.5px;fill:#5f6a72}
      .sha{font-size:12px;font-weight:600;fill:#39454b;font-family:ui-monospace,Menlo,Consolas,monospace}
      .nm{font-size:12.5px;font-weight:600;fill:#171d21}
      .tag{font-size:9.5px;font-weight:700;letter-spacing:.02em;fill:#ffffff}
      .cap{font-size:11.5px;fill:#5f6a72}
      .sum{font-size:12.5px;fill:#2c363c}
      .sumb{font-size:13px;font-weight:700;fill:#171d21}
      .dots{font-size:19px;fill:#8a959b;font-weight:700}
    </style>
  </defs>

  <rect width="1000" height="780" fill="#f8f9f9"/>

  <!-- ══════════ 왼쪽: 체리픽 ══════════ -->
  <rect x="24" y="24" width="452" height="732" rx="10" fill="#ffffff" stroke="#dfe3e4"/>
  <rect x="24" y="24" width="452" height="4" rx="2" fill="#0d5f63"/>
  <text class="h" x="48" y="62">체리픽 — 지금 쓰는 방식</text>
  <text class="sub" x="48" y="84">공식 1.13.1 바로 위에 우리 기록을 다시 만든다</text>

  <rect x="125" y="108" width="250" height="38" rx="7" fill="#eef1f2" stroke="#c3cacd"/>
  <text class="nm" x="250" y="132" text-anchor="middle">공식 OpenMetadata 1.13.1</text>
  <text class="cap" x="250" y="162" text-anchor="middle">afcb2d2cd7 — 여기서 출발</text>

  <line x1="250" y1="170" x2="250" y2="188" stroke="#7d8a91" stroke-width="1.6" marker-end="url(#ar)"/>

  <g>
    <rect x="125" y="192" width="250" height="52" rx="7" fill="#e8f2f1" stroke="#0d5f63"/>
    <text class="sha" x="141" y="213">55d0e1bd7f</text>
    <text class="nm" x="228" y="213">기준코드</text>
    <rect x="141" y="221" width="84" height="17" rx="8.5" fill="#0d5f63"/>
