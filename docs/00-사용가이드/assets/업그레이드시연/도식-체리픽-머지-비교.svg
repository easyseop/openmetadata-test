    <rect x="548" y="216" width="146" height="50" rx="7" fill="#e8f2f1" stroke="#0d5f63"/>
    <text class="sha" x="562" y="236">4df83b311f</text>
    <rect x="562" y="243" width="84" height="17" rx="8.5" fill="#0d5f63"/>
    <text class="tag" x="604" y="255" text-anchor="middle">BANK-OM-001</text>
  </g>
  <line x1="621" y1="266" x2="621" y2="300" stroke="#0d5f63" stroke-width="1.6" marker-end="url(#arT)"/>
  <g>
    <rect x="548" y="304" width="146" height="50" rx="7" fill="#e8f2f1" stroke="#0d5f63"/>
    <text class="sha" x="562" y="324">68ebed4801</text>
    <rect x="562" y="331" width="84" height="17" rx="8.5" fill="#0d5f63"/>
    <text class="tag" x="604" y="343" text-anchor="middle">BANK-OM-002</text>
  </g>
  <line x1="621" y1="354" x2="621" y2="388" stroke="#0d5f63" stroke-width="1.6" marker-end="url(#arT)"/>
  <g>
    <rect x="548" y="392" width="146" height="50" rx="7" fill="#e8f2f1" stroke="#0d5f63"/>
    <text class="sha" x="562" y="412">57ee1b3b23</text>
    <rect x="562" y="419" width="84" height="17" rx="8.5" fill="#0d5f63"/>
    <text class="tag" x="604" y="431" text-anchor="middle">BANK-OM-003</text>
  </g>
  <text class="dots" x="621" y="472" text-anchor="middle">⋮</text>
  <text class="cap" x="621" y="492" text-anchor="middle">우리 기록 8건</text>

  <!-- 후보 갈래 -->
  <g>
    <rect x="806" y="216" width="146" height="50" rx="7" fill="#eef1f2" stroke="#c3cacd"/>
    <text class="nm" x="879" y="240" text-anchor="middle">1.13.1 스냅샷</text>
    <text class="cap" x="879" y="256" text-anchor="middle">여기서 시작</text>
  </g>
  <line x1="879" y1="266" x2="879" y2="300" stroke="#7d8a91" stroke-width="1.6" marker-end="url(#ar)"/>
  <g>
    <rect x="806" y="304" width="146" height="50" rx="7" fill="#fbf1e4" stroke="#b0761f" stroke-dasharray="4 3"/>
    <text class="nm" x="879" y="326" text-anchor="middle">매듭 1</text>
    <text class="cap" x="879" y="343" text-anchor="middle" fill="#a06a15">이름표 없음</text>
  </g>
  <line x1="879" y1="354" x2="879" y2="388" stroke="#7d8a91" stroke-width="1.6" marker-end="url(#ar)"/>
  <g>
    <rect x="806" y="392" width="146" height="50" rx="7" fill="#fbf1e4" stroke="#b0761f" stroke-dasharray="4 3"/>
    <text class="nm" x="879" y="414" text-anchor="middle">매듭 2</text>
    <text class="cap" x="879" y="431" text-anchor="middle" fill="#a06a15">이름표 없음</text>
  </g>
  <text class="dots" x="879" y="472" text-anchor="middle">⋮</text>
  <text class="cap" x="879" y="492" text-anchor="middle" fill="#a06a15">매듭 8까지</text>

  <path d="M698,238 L800,318" fill="none" stroke="#b0761f" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arA)"/>
  <path d="M698,326 L800,406" fill="none" stroke="#b0761f" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arA)"/>
  <rect x="716" y="266" width="72" height="17" rx="4" fill="#ffffff" opacity="0.92"/>
  <text class="cap" x="752" y="279" text-anchor="middle" fill="#a06a15">머지 1회</text>
  <rect x="716" y="354" width="72" height="17" rx="4" fill="#ffffff" opacity="0.92"/>
  <text class="cap" x="752" y="367" text-anchor="middle" fill="#a06a15">머지 1회</text>

  <rect x="548" y="556" width="404" height="176" rx="8" fill="#fdf7f0" stroke="#e3cba6"/>
  <text class="sumb" x="568" y="586">기록 16건 = 우리 8건 + 매듭 8개</text>
  <text class="sum" x="568" y="614">· 머지 한 번에 매듭이 하나씩 생김</text>
  <text class="sum" x="568" y="638">· 매듭 8개에는 이름표가 없음</text>
  <text class="sum" x="568" y="662">· 맨 아래가 1.13.0 — 공식 1.13.1 의 자손이 아님</text>
  <text class="sum" x="568" y="686">· 충돌을 푼 내용이 이름표 없는 매듭에 들어감</text>
  <text class="sumb" x="568" y="716">→ 검사기가 읽을 수 없음 · vendor-ancestry 에서 막힘</text>
