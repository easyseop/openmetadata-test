  <text class="sub" x="548" y="84">우리 갈래를 그대로 데려오고 매듭을 만든다</text>

  <rect x="625" y="108" width="250" height="38" rx="7" fill="#f6ece0" stroke="#d9ae76"/>
  <text class="nm" x="750" y="132" text-anchor="middle">1.13.0 스냅샷</text>
  <text class="cap" x="750" y="162" text-anchor="middle">2f4f3560e7 — 두 갈래가 여기서 갈라짐</text>

  <path d="M750,170 L750,178 Q750,186 742,186 L629,186 Q621,186 621,194 L621,212"
        fill="none" stroke="#7d8a91" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M750,170 L750,178 Q750,186 758,186 L871,186 Q879,186 879,194 L879,212"
        fill="none" stroke="#7d8a91" stroke-width="1.6" marker-end="url(#ar)"/>
  <text class="cap" x="548" y="208">우리 갈래</text>
  <text class="cap" x="952" y="208" text-anchor="end">후보 갈래</text>

  <!-- 우리 갈래 -->
