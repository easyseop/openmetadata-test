  </g>

  <rect x="48" y="556" width="404" height="176" rx="8" fill="#f4f8f8" stroke="#cfdedd"/>
  <text class="sumb" x="68" y="586">기록 8건 · 매듭 0개</text>
  <text class="sum" x="68" y="614">· 8건 모두 이름표가 하나씩 붙어 있음</text>
  <text class="sum" x="68" y="638">· 맨 아래가 공식 1.13.1</text>
  <text class="sum" x="68" y="662">· 충돌을 푼 내용이 그 기능의 기록 안에 들어감</text>
  <text class="sum" x="68" y="686">· 번호는 새로 부여됨 (4df83b311f → 55d0e1bd7f)</text>
  <text class="sumb" x="68" y="716">→ 검사기가 읽을 수 있음</text>

