    <rect x="141" y="295" width="84" height="17" rx="8.5" fill="#0d5f63"/>
    <text class="tag" x="183" y="307" text-anchor="middle">BANK-OM-002</text>
  </g>
  <line x1="250" y1="318" x2="250" y2="336" stroke="#0d5f63" stroke-width="1.6" marker-end="url(#arT)"/>
  <g>
    <rect x="125" y="340" width="250" height="52" rx="7" fill="#e8f2f1" stroke="#0d5f63"/>
    <text class="sha" x="141" y="361">4d655064b2</text>
    <text class="nm" x="228" y="361">데이터점검</text>
    <rect x="141" y="369" width="84" height="17" rx="8.5" fill="#0d5f63"/>
