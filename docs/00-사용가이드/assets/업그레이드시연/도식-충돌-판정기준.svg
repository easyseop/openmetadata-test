<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 886" width="1160" height="886" role="img"
 aria-label="git 이 충돌을 판정하는 기준 — 같은 자리를 건드렸는가">
<title>git 이 충돌을 판정하는 기준</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,1 L9,5 L0,9 z" fill="#aab3b8"/></marker>
<style>
 text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
 .cd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre}
 .bt{font-size:12.5px;font-weight:700;fill:#39454b}
 .ph{font-size:17px;font-weight:700;fill:#171d21}
 .nt{font-size:11.5px;fill:#6b767d}
 .ex{font-size:13px;fill:#39454b}
 .ok{font-size:12.5px;font-weight:700;fill:#2f8f4e}
 .ng{font-size:12.5px;font-weight:700;fill:#b0423a}
 .cc{font-size:14px;font-weight:700;fill:#171d21}
 .cs{font-size:12.8px;fill:#2c363c}
 .em{fill:#1f5c8b} .em2{fill:#0d5f63;font-weight:700} .em3{fill:#0d5f63}
</style></defs>
<rect width="1160" height="886" fill="#f8f9f9"/>
<text class="ph" x="40" y="46" style="font-size:20px">git 은 언제 “충돌”이라고 하나</text>
<text class="nt" x="40" y="68">같은 파일에 우리는 항상 <tspan style="font-weight:700">한 줄만</tspan> 추가했습니다. 달라진 것은 새 버전 쪽뿐입니다.</text>
<text class="ph" x="40" y="98">A. 새 버전이 <tspan class="em">한 줄만</tspan> 바꾼 경우</text><rect x="40" y="124" width="258" height="168" rx="8" fill="#fff" stroke="#dfe3e4"/><rect x="40" y="124" width="258" height="3" rx="1.5" fill="#c3cacd"/><text class="bt" x="54" y="146">출발점 (1.13.0)</text><text class="cd" x="54" y="168.5" fill="#8a959b">{</text><text class="cd" x="54" y="189.5" fill="#8a959b">  &quot;a&quot;: 1,</text><text class="cd" x="54" y="210.5" fill="#8a959b">  &quot;b&quot;: 2,</text><text class="cd" x="54" y="231.5" fill="#8a959b">  &quot;c&quot;: 3,</text><text class="cd" x="54" y="252.5" fill="#8a959b">  &quot;d&quot;: 4</text><text class="cd" x="54" y="273.5" fill="#8a959b">}</text><rect x="322" y="124" width="258" height="168" rx="8" fill="#fff" stroke="#dfe3e4"/><rect x="322" y="124" width="258" height="3" rx="1.5" fill="#1f5c8b"/><text class="bt" x="336" y="146">새 버전</text><text class="cd" x="336" y="168.5" fill="#8a959b">{</text><text class="cd" x="336" y="189.5" fill="#8a959b">  &quot;a&quot;: 1,</text><text class="cd" x="336" y="210.5" fill="#8a959b">  &quot;b&quot;: 2,</text><text class="cd" x="336" y="231.5" fill="#8a959b">  &quot;c&quot;: 3,</text><rect x="329" y="238" width="244" height="21" rx="3" fill="#e6eff6"/><text class="cd" x="336" y="252.5" fill="#1f5c8b">  &quot;d&quot;: 44</text><text class="cd" x="336" y="273.5" fill="#8a959b">}</text><text class="nt" x="451" y="310" text-anchor="middle">1줄만 바뀜</text><rect x="604" y="124" width="258" height="189" rx="8" fill="#fff" stroke="#dfe3e4"/><rect x="604" y="124" width="258" height="3" rx="1.5" fill="#0d5f63"/><text class="bt" x="618" y="146">우리 것</text><text class="cd" x="618" y="168.5" fill="#8a959b">{</text><text class="cd" x="618" y="189.5" fill="#8a959b">  &quot;a&quot;: 1,</text><rect x="611" y="196" width="244" height="21" rx="3" fill="#e6f2f1"/><text class="cd" x="618" y="210.5" fill="#0b5a5e">  &quot;mine&quot;: 9,</text><text class="cd" x="618" y="231.5" fill="#8a959b">  &quot;b&quot;: 2,</text><text class="cd" x="618" y="252.5" fill="#8a959b">  &quot;c&quot;: 3,</text><text class="cd" x="618" y="273.5" fill="#8a959b">  &quot;d&quot;: 4</text><text class="cd" x="618" y="294.5" fill="#8a959b">}</text><text class="nt" x="733" y="331" text-anchor="middle">1줄 추가</text><rect x="886" y="124" width="258" height="189" rx="8" fill="#fff" stroke="#dfe3e4"/><rect x="886" y="124" width="258" height="3" rx="1.5" fill="#2f8f4e"/><text class="bt" x="900" y="146">합친 결과</text><text class="cd" x="900" y="168.5" fill="#8a959b">{</text><text class="cd" x="900" y="189.5" fill="#8a959b">  &quot;a&quot;: 1,</text><rect x="893" y="196" width="244" height="21" rx="3" fill="#e6f2f1"/><text class="cd" x="900" y="210.5" fill="#0b5a5e">  &quot;mine&quot;: 9,</text><text class="cd" x="900" y="231.5" fill="#8a959b">  &quot;b&quot;: 2,</text><text class="cd" x="900" y="252.5" fill="#8a959b">  &quot;c&quot;: 3,</text><rect x="893" y="259" width="244" height="21" rx="3" fill="#e6eff6"/><text class="cd" x="900" y="273.5" fill="#1f5c8b">  &quot;d&quot;: 44</text><text class="cd" x="900" y="294.5" fill="#8a959b">}</text><text class="nt" x="1015" y="331" text-anchor="middle">자동으로 합쳐짐</text><text class="ok" x="1140" y="142" text-anchor="end">✔ 충돌 없음</text><text class="ex" x="40" y="356">바뀌지 않은 줄이 남아 있어서 <tspan class="em2">우리 줄을 어디에 넣을지</tspan> 판단할 수 있습니다.</text><text class="ph" x="40" y="422">B. 새 버전이 <tspan class="em">들여쓰기만</tspan> 바꾼 경우 — 내용은 그대로</text><rect x="40" y="448" width="258" height="168" rx="8" fill="#fff" stroke="#dfe3e4"/><rect x="40" y="448" width="258" height="3" rx="1.5" fill="#c3cacd"/><text class="bt" x="54" y="470">출발점 (1.13.0)</text><text class="cd" x="54" y="492.5" fill="#8a959b">{</text><text class="cd" x="54" y="513.5" fill="#8a959b">  &quot;a&quot;: 1,</text><text class="cd" x="54" y="534.5" fill="#8a959b">  &quot;b&quot;: 2,</text><text class="cd" x="54" y="555.5" fill="#8a959b">  &quot;c&quot;: 3,</text><text class="cd" x="54" y="576.5" fill="#8a959b">  &quot;d&quot;: 4</text><text class="cd" x="54" y="597.5" fill="#8a959b">}</text><rect x="322" y="448" width="258" height="168" rx="8" fill="#fff" stroke="#dfe3e4"/><rect x="322" y="448" width="258" height="3" rx="1.5" fill="#1f5c8b"/><text class="bt" x="336" y="470">새 버전</text><text class="cd" x="336" y="492.5" fill="#8a959b">{</text><rect x="329" y="499" width="244" height="21" rx="3" fill="#e6eff6"/><text class="cd" x="336" y="513.5" fill="#1f5c8b">    &quot;a&quot;: 1,</text><rect x="329" y="520" width="244" height="21" rx="3" fill="#e6eff6"/><text class="cd" x="336" y="534.5" fill="#1f5c8b">    &quot;b&quot;: 2,</text><rect x="329" y="541" width="244" height="21" rx="3" fill="#e6eff6"/><text class="cd" x="336" y="555.5" fill="#1f5c8b">    &quot;c&quot;: 3,</text><rect x="329" y="562" width="244" height="21" rx="3" fill="#e6eff6"/><text class="cd" x="336" y="576.5" fill="#1f5c8b">    &quot;d&quot;: 4</text><text class="cd" x="336" y="597.5" fill="#8a959b">}</text><text class="nt" x="451" y="634" text-anchor="middle">모든 줄이 바뀜 (2칸 → 4칸)</text><rect x="604" y="448" width="258" height="189" rx="8" fill="#fff" stroke="#dfe3e4"/><rect x="604" y="448" width="258" height="3" rx="1.5" fill="#0d5f63"/><text class="bt" x="618" y="470">우리 것</text><text class="cd" x="618" y="492.5" fill="#8a959b">{</text><text class="cd" x="618" y="513.5" fill="#8a959b">  &quot;a&quot;: 1,</text><rect x="611" y="520" width="244" height="21" rx="3" fill="#e6f2f1"/><text class="cd" x="618" y="534.5" fill="#0b5a5e">  &quot;mine&quot;: 9,</text><text class="cd" x="618" y="555.5" fill="#8a959b">  &quot;b&quot;: 2,</text><text class="cd" x="618" y="576.5" fill="#8a959b">  &quot;c&quot;: 3,</text><text class="cd" x="618" y="597.5" fill="#8a959b">  &quot;d&quot;: 4</text><text class="cd" x="618" y="618.5" fill="#8a959b">}</text><text class="nt" x="733" y="655" text-anchor="middle">아까와 똑같이 1줄 추가</text><rect x="886" y="448" width="258" height="210" rx="8" fill="#fff" stroke="#dfe3e4"/><rect x="886" y="448" width="258" height="3" rx="1.5" fill="#b0423a"/><text class="bt" x="900" y="470">합친 결과</text><text class="cd" x="900" y="492.5" fill="#8a959b">{</text><rect x="893" y="499" width="244" height="21" rx="3" fill="#f3f4f5"/><text class="cd" x="900" y="513.5" fill="#5f6a72">&lt;&lt;&lt;&lt;&lt;&lt;&lt; 새 버전</text><rect x="893" y="520" width="244" height="21" rx="3" fill="#fbeceb"/><text class="cd" x="900" y="534.5" fill="#b0423a">    &quot;a&quot;: 1,  …</text><rect x="893" y="541" width="244" height="21" rx="3" fill="#f3f4f5"/><text class="cd" x="900" y="555.5" fill="#5f6a72">=======</text><rect x="893" y="562" width="244" height="21" rx="3" fill="#fbeceb"/><text class="cd" x="900" y="576.5" fill="#b0423a">  &quot;a&quot;: 1,</text><rect x="893" y="583" width="244" height="21" rx="3" fill="#fbeceb"/><text class="cd" x="900" y="597.5" fill="#b0423a">  &quot;mine&quot;: 9,  …</text><rect x="893" y="604" width="244" height="21" rx="3" fill="#f3f4f5"/><text class="cd" x="900" y="618.5" fill="#5f6a72">&gt;&gt;&gt;&gt;&gt;&gt;&gt; 우리 것</text><text class="cd" x="900" y="639.5" fill="#8a959b">}</text><text class="nt" x="1015" y="676" text-anchor="middle">사람이 정해야 함</text><text class="ng" x="1140" y="466" text-anchor="end">✘ 충돌</text><text class="ex" x="40" y="722">그대로인 줄이 <tspan class="em2">하나도 없어서</tspan> 넣을 자리를 정할 기준이 사라집니다. 우리가 들여쓰기를 바꾸지 않아도 마찬가지입니다.</text><rect x="40" y="748" width="1080" height="102" rx="9" fill="#f4f8f8" stroke="#cfdedd"/><text class="cc" x="62" y="778">git 은 “같은 내용을 바꿨나”가 아니라 <tspan class="em3">“같은 자리를 건드렸나”</tspan>로 판정합니다.</text><text class="cs" x="62" y="804">새 버전이 모든 줄을 건드리면, 우리가 어느 줄을 건드리든 그 범위 안에 들어갑니다.</text><text class="cs" x="62" y="826">JSON 은 줄 순서·들여쓰기에 뜻이 없으므로, <tspan class="em3">항목 단위로 갈라 보면</tspan> 겹치는 것이 없다는 사실이 드러납니다.</text>
</svg>