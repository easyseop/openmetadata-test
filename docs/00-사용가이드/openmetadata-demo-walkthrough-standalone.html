:root[data-theme=&quot;light&quot;] {

:root[data-theme=&quot;dark&quot;] {

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,

  background: transparent !important;
  font-family: var(--font-sans);

  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;

h1,
h2,
h3,
h4,
h5,
h6,
p {

}

h2 {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {

  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);

  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {

}

  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);

  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);

  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;

  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;

  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {

  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:

.form-select:not(:disabled):hover {

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);

  .form-check-input:not(:disabled):not(:checked):hover {

  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;om-guide-v3&quot;&gt;
  &lt;header class=&quot;om-hero&quot;&gt;
    &lt;span class=&quot;viz-badge&quot;&gt;OpenMetadata 행내 커스터마이징 관리&lt;/span&gt;
    &lt;h1&gt;공식 업그레이드 뒤에도 행내 기능을 잃지 않는 방법&lt;/h1&gt;
    &lt;p&gt;공식 원본 위에 BANK-OM 변경을 다시 적용하고, 검사기로 누락·혼합·동작 여부를 단계별 확인합니다.&lt;/p&gt;
    &lt;div class=&quot;om-now&quot; role=&quot;status&quot;&gt;
      &lt;span&gt;&lt;strong&gt;1·2·3차 코드 완료&lt;/strong&gt; 범위·위험·운영 사전검사&lt;/span&gt;
      &lt;span&gt;&lt;strong&gt;현재 후보&lt;/strong&gt; 소스·범위·부채 검사 통과&lt;/span&gt;
      &lt;span class=&quot;text-destructive&quot;&gt;&lt;strong&gt;남은 일&lt;/strong&gt; 행내 환경에서 실제 동작 실행&lt;/span&gt;
    &lt;/div&gt;
  &lt;/header&gt;

  &lt;section class=&quot;om-progress&quot; aria-label=&quot;현재 개발 진척도&quot;&gt;
    &lt;article class=&quot;om-progress-done&quot;&gt;
      &lt;span&gt;1차 · 완료&lt;/span&gt;
      &lt;strong&gt;검사 기준을 실제 코드와 일치&lt;/strong&gt;
      &lt;p&gt;001~007의 폴더 허용을 없애고 실제 파일을 개별 등록했습니다. T25-R·T26·T40·T70을 강화했습니다.&lt;/p&gt;
    &lt;/article&gt;
    &lt;article&gt;
      &lt;span&gt;2차 · 완료&lt;/span&gt;
      &lt;strong&gt;업그레이드 위험 자동 제안&lt;/strong&gt;
      &lt;p&gt;경로·설정키·의존성 변화와 직접 참조 관계를 검사해 watch 후보와 근거를 제안합니다.&lt;/p&gt;
    &lt;/article&gt;
    &lt;article&gt;
      &lt;span&gt;3차 · 실행기 완료&lt;/span&gt;
      &lt;strong&gt;환경 누락을 먼저 차단&lt;/strong&gt;
      &lt;p&gt;URL·토큰·테스트 데이터·로그인 상태·배포 digest를 먼저 검사합니다. 실제 실행은 행내 환경이 필요합니다.&lt;/p&gt;
    &lt;/article&gt;
  &lt;/section&gt;

  &lt;nav class=&quot;viz-controls om-toc&quot; aria-label=&quot;가이드 목차&quot;&gt;
    &lt;a class=&quot;btn&quot; href=&quot;#purpose&quot;&gt;1. 우리의 목적&lt;/a&gt;
    &lt;a class=&quot;btn&quot; href=&quot;#branch&quot;&gt;2. 브랜치 전략&lt;/a&gt;
    &lt;a class=&quot;btn&quot; href=&quot;#gates&quot;&gt;3. 검사기&lt;/a&gt;
    &lt;a class=&quot;btn&quot; href=&quot;#example&quot;&gt;4. 실제 적용 예시&lt;/a&gt;
    &lt;a class=&quot;btn&quot; href=&quot;#result&quot;&gt;5. 결과&lt;/a&gt;
    &lt;a class=&quot;btn&quot; href=&quot;#roadmap&quot;&gt;6. 구현 단계&lt;/a&gt;
  &lt;/nav&gt;

  &lt;section id=&quot;purpose&quot; class=&quot;om-section&quot;&gt;
    &lt;div class=&quot;om-section-title&quot;&gt;
      &lt;span&gt;01&lt;/span&gt;
      &lt;div&gt;
        &lt;h2&gt;우리의 목적&lt;/h2&gt;
        &lt;p&gt;자체 제품을 새로 만드는 것이 아니라, 공식 OpenMetadata를 안전하게 계속 사용하는 것이 목적입니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;viz-grid om-purpose-grid&quot;&gt;
      &lt;article class=&quot;card&quot;&gt;
        &lt;span class=&quot;text-muted&quot;&gt;유지할 것&lt;/span&gt;
        &lt;strong&gt;공식 OpenMetadata&lt;/strong&gt;
        &lt;p&gt;공식 기능과 보안 업데이트를 계속 반영합니다.&lt;/p&gt;
      &lt;/article&gt;
      &lt;article class=&quot;card&quot;&gt;
        &lt;span class=&quot;text-muted&quot;&gt;보호할 것&lt;/span&gt;
        &lt;strong&gt;등록된 행내 기능&lt;/strong&gt;
        &lt;p&gt;각 기능을 BANK-OM ID별 독립 변경 기록으로 관리합니다.&lt;/p&gt;
      &lt;/article&gt;
      &lt;article class=&quot;card&quot;&gt;
        &lt;span class=&quot;text-muted&quot;&gt;증명할 것&lt;/span&gt;
        &lt;strong&gt;재적용과 실제 동작&lt;/strong&gt;
        &lt;p&gt;코드 재적용 결과와 행내 환경 동작을 서로 다른 검사로 확인합니다.&lt;/p&gt;
      &lt;/article&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;branch&quot; class=&quot;om-section&quot;&gt;
    &lt;div class=&quot;om-section-title&quot;&gt;
      &lt;span&gt;02&lt;/span&gt;
      &lt;div&gt;
        &lt;h2&gt;브랜치 전략&lt;/h2&gt;
        &lt;p&gt;공식 원본과 행내 변경 기록을 따로 관리하고, 업그레이드 때마다 새 공식 원본 위에 행내 변경을 순서대로 적용해 검사 대상 후보를 만듭니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;om-preflight-diagram&quot; aria-label=&quot;브랜치 작업 전 사전 설정&quot;&gt;
      &lt;strong&gt;사전 설정&lt;/strong&gt;
      &lt;div class=&quot;om-preflight-row&quot;&gt;
        &lt;details class=&quot;om-preflight-step&quot;&gt;
          &lt;summary&gt;&lt;span&gt;1&lt;/span&gt;&lt;b&gt;BANK-OM ID 발급&lt;/b&gt;&lt;/summary&gt;
          &lt;pre&gt;&lt;code&gt;id: BANK-OM-001
title: InstanceCode
kind: core-patch
owner: 데이터플랫폼팀
status: active

# 실제 검사기 허용값
# core-patch: 공식 기존 파일만 수정
# extension: 확장 영역 파일
# governance: 검사기·정책 영역 파일&lt;/code&gt;&lt;/pre&gt;
        &lt;/details&gt;
        &lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;
        &lt;details class=&quot;om-preflight-step&quot;&gt;
          &lt;summary&gt;&lt;span&gt;2&lt;/span&gt;&lt;b&gt;Manifest 등록&lt;/b&gt;&lt;/summary&gt;
          &lt;pre&gt;&lt;code&gt;# 실제 BANK-OM-001.yaml 발췌
changed_paths:
  - .../Entity.java
  - .../CollectionDAO.java
  - .../SearchIndexFactory.java
  # 이와 같은 실제 파일을 총 48개 개별 등록
  # ** 같은 폴더 패턴은 허용하지 않음

required_changed_paths:
  - .../InstanceCodeResource.java
  - .../instanceCode.json

upgrade_watch.paths:
  - .../Entity.java
  - .../CollectionDAO.java
  - .../SearchIndexFactory.java&lt;/code&gt;&lt;/pre&gt;
          &lt;p class=&quot;text-small text-muted&quot;&gt;&lt;code&gt;allowed&lt;/code&gt;는 과거 행내본에서 이 ID가 실제 변경한 전체 48개 파일입니다. &lt;code&gt;required&lt;/code&gt;는 그중 소실 시 즉시 차단할 최소 핵심 2개이며, “신규 파일 전용”이라는 뜻은 아닙니다. &lt;code&gt;watch&lt;/code&gt;는 공식 새 버전에서 바뀌면 연결 방식을 재검토할 의존 파일입니다.&lt;/p&gt;
        &lt;/details&gt;
        &lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;
        &lt;details class=&quot;om-preflight-step&quot;&gt;
          &lt;summary&gt;&lt;span&gt;3&lt;/span&gt;&lt;b&gt;커밋 메시지 작성&lt;/b&gt;&lt;/summary&gt;
          &lt;pre&gt;&lt;code&gt;git commit \
  -m &quot;add InstanceCode&quot; \
  -m &quot;Customization-ID: BANK-OM-001&quot;&lt;/code&gt;&lt;/pre&gt;
        &lt;/details&gt;
      &lt;/div&gt;
      &lt;details class=&quot;om-code-evidence&quot;&gt;
        &lt;summary&gt;사전 설정 실제 코드 참고 · BANK-OM-001&lt;/summary&gt;
        &lt;p class=&quot;text-small text-muted&quot;&gt;출처: &lt;a href=&quot;https://github.com/easyseop/OpenMetadata/commit/a2566fac322c877a645046264c8ae99df103f794&quot;&gt;실제 커밋 a2566fac…&lt;/a&gt;. 전체 48개 변경 경로 중 사전 설정 관계를 설명하는 핵심 파일 4개만 표시합니다.&lt;/p&gt;

        &lt;details class=&quot;om-file-evidence&quot;&gt;
          &lt;summary&gt;&lt;code&gt;Entity.java&lt;/code&gt; · Core 수정 · ID와 allowed 근거&lt;/summary&gt;
          &lt;pre&gt;&lt;code&gt;@@ 기존 Entity 종류 목록
 public static final String FILE = &quot;file&quot;;
 public static final String WORKSHEET = &quot;worksheet&quot;;
&lt;ins&gt;+public static final String INSTANCE_CODE = &quot;instanceCode&quot;;&lt;/ins&gt;&lt;/code&gt;&lt;/pre&gt;
          &lt;p&gt;공식 Core의 Entity 목록에 행내 기능 이름을 등록한 실제 변경입니다. 그래서 48개 정확 경로 중 하나로 &lt;code&gt;allowed&lt;/code&gt;에 등록됩니다.&lt;/p&gt;
        &lt;/details&gt;

        &lt;details class=&quot;om-file-evidence&quot;&gt;
          &lt;summary&gt;&lt;code&gt;InstanceCodeResource.java&lt;/code&gt; · 신규 파일 · ID와 required 근거&lt;/summary&gt;
          &lt;pre&gt;&lt;code&gt;@@ 신규 파일
&lt;ins&gt;+@Path(&quot;/v1/instanceCodes&quot;)&lt;/ins&gt;
&lt;ins&gt;+@Collection(name = &quot;instanceCodes&quot;)&lt;/ins&gt;
&lt;ins&gt;+public class InstanceCodeResource&lt;/ins&gt;
&lt;ins&gt;+    extends EntityResource&amp;lt;InstanceCode, InstanceCodeRepository&amp;gt; {&lt;/ins&gt;
&lt;ins&gt;+  public static final String COLLECTION_PATH = &quot;/v1/instanceCodes/&quot;;&lt;/ins&gt;
&lt;ins&gt;+  // 이하 실제 CRUD API 메서드는 화면에서 생략&lt;/ins&gt;&lt;/code&gt;&lt;/pre&gt;
          &lt;p&gt;공식 원본에는 없던 InstanceCode API 파일이며, 동시에 48개 &lt;code&gt;allowed&lt;/code&gt; 경로 중 하나입니다. 이 파일이 없으면 기능 자체가 성립하지 않으므로 더 강한 차단 기준인 &lt;code&gt;required&lt;/code&gt;에도 중복 등록합니다.&lt;/p&gt;
        &lt;/details&gt;

        &lt;details class=&quot;om-file-evidence&quot;&gt;
          &lt;summary&gt;&lt;code&gt;InstanceCodeRepository.java&lt;/code&gt; · 신규 파일 · watch 연결 근거&lt;/summary&gt;
          &lt;pre&gt;&lt;code&gt;@@ 신규 파일
&lt;ins&gt;+public class InstanceCodeRepository&lt;/ins&gt;
&lt;ins&gt;+    extends EntityRepository&amp;lt;InstanceCode&amp;gt; {&lt;/ins&gt;
&lt;ins&gt;+  public InstanceCodeRepository() {&lt;/ins&gt;
&lt;ins&gt;+    super(&lt;/ins&gt;
&lt;ins&gt;+        InstanceCodeResource.COLLECTION_PATH,&lt;/ins&gt;
&lt;ins&gt;+        Entity.INSTANCE_CODE,&lt;/ins&gt;
&lt;ins&gt;+        InstanceCode.class,&lt;/ins&gt;
&lt;ins&gt;+        Entity.getCollectionDAO().instanceCodeDAO(),&lt;/ins&gt;
&lt;ins&gt;+        &quot;&quot;,&lt;/ins&gt;
&lt;ins&gt;+        &quot;&quot;);&lt;/ins&gt;
&lt;ins&gt;+  }&lt;/ins&gt;
&lt;ins&gt;+  // 이하 실제 저장·수정 메서드는 화면에서 생략&lt;/ins&gt;&lt;/code&gt;&lt;/pre&gt;
          &lt;p&gt;신규 Repository가 Core의 &lt;code&gt;CollectionDAO.instanceCodeDAO()&lt;/code&gt;를 직접 사용합니다. 이 호출이 다음 파일을 watch로 정하는 코드 근거입니다.&lt;/p&gt;
        &lt;/details&gt;

        &lt;details class=&quot;om-file-evidence&quot;&gt;
          &lt;summary&gt;&lt;code&gt;CollectionDAO.java&lt;/code&gt; · Core 수정 · allowed와 watch 대상&lt;/summary&gt;
          &lt;pre&gt;&lt;code&gt;@@ DAO 생성 메서드 추가
&lt;ins&gt;+@CreateSqlObject&lt;/ins&gt;
&lt;ins&gt;+InstanceCodeDAO instanceCodeDAO();&lt;/ins&gt;

@@ DAO 인터페이스 추가
&lt;ins&gt;+interface InstanceCodeDAO extends EntityDAO&amp;lt;InstanceCode&amp;gt; {&lt;/ins&gt;
&lt;ins&gt;+  default String getTableName() {&lt;/ins&gt;
&lt;ins&gt;+    return &quot;instance_code_entity&quot;;&lt;/ins&gt;
&lt;ins&gt;+  }&lt;/ins&gt;
&lt;ins&gt;+  default Class&amp;lt;InstanceCode&amp;gt; getEntityClass() {&lt;/ins&gt;
&lt;ins&gt;+    return InstanceCode.class;&lt;/ins&gt;
&lt;ins&gt;+  }&lt;/ins&gt;
&lt;ins&gt;+}&lt;/ins&gt;&lt;/code&gt;&lt;/pre&gt;
          &lt;p&gt;이번 커밋이 실제로 수정하므로 &lt;code&gt;allowed&lt;/code&gt;에 등록합니다. 동시에 행내 Repository와 DB 테이블을 이어주는 Core 공용 연결부이므로, 공식 업그레이드가 DAO 생성·등록 방식을 바꿀 때 다시 확인하도록 &lt;code&gt;watch&lt;/code&gt;에도 등록합니다.&lt;/p&gt;
        &lt;/details&gt;

        &lt;section class=&quot;om-evidence-part&quot;&gt;
          &lt;strong&gt;네 파일을 보고 만드는 사전 설정&lt;/strong&gt;
          &lt;p&gt;&lt;code&gt;Entity.java&lt;/code&gt;, &lt;code&gt;CollectionDAO.java&lt;/code&gt; 수정과 신규 InstanceCode 파일들은 하나의 업무 기능이므로 &lt;code&gt;BANK-OM-001&lt;/code&gt;로 묶습니다. &lt;code&gt;required&lt;/code&gt;는 &lt;code&gt;allowed&lt;/code&gt; 48개 중 즉시 차단할 핵심 부분집합입니다. &lt;code&gt;CollectionDAO.java&lt;/code&gt;처럼 실제 변경 파일이면서 공식 구조 변화도 감시해야 하면 &lt;code&gt;allowed&lt;/code&gt;와 &lt;code&gt;watch&lt;/code&gt;에 함께 들어갑니다.&lt;/p&gt;
          &lt;pre&gt;&lt;code&gt;add InstanceCode customization

Customization-ID: BANK-OM-001&lt;/code&gt;&lt;/pre&gt;
          &lt;p&gt;마지막으로 같은 ID를 실제 커밋 메시지에 기록합니다. 저장 후 Git이 &lt;code&gt;a2566fac…&lt;/code&gt;라는 SHA를 자동 생성합니다.&lt;/p&gt;
        &lt;/section&gt;
      &lt;/details&gt;
      &lt;p&gt;&lt;b&gt;ID는 관리 담당자가 ID 대장에서 다음 미사용 번호를 발급합니다.&lt;/b&gt; LLM이나 Git이 만드는 값이 아닙니다. &lt;code&gt;kind&lt;/code&gt;는 실제 검사기 스키마가 허용하는 &lt;code&gt;core-patch&lt;/code&gt;·&lt;code&gt;extension&lt;/code&gt;·&lt;code&gt;governance&lt;/code&gt; 중 하나만 사용합니다. Manifest는 코드 근거와 검토를 거쳐 변경하며, 실제 Git 커밋 ID(SHA)만 Git이 자동 생성합니다.&lt;/p&gt;
      &lt;details class=&quot;om-watch-guide&quot;&gt;
        &lt;summary&gt;watch 파일은 누가, 어떤 기준으로 고르나?&lt;/summary&gt;
        &lt;ol&gt;
          &lt;li&gt;&lt;b&gt;개발자가 후보를 찾습니다.&lt;/b&gt; 신규 커스텀 코드가 호출·등록·상속하거나, 커스텀 기능을 Core에 연결하는 공용 파일을 찾습니다.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;영향을 확인합니다.&lt;/b&gt; 그 공용 파일의 메서드·등록 방식·데이터 계약이 바뀌면 행내 기능도 수정해야 하는 경우에만 watch로 등록합니다.&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;코드 책임자가 근거와 함께 승인합니다.&lt;/b&gt; 파일명만 적지 않고 “어떤 행내 코드와 어떻게 연결되는지”를 Manifest 설명에 남깁니다.&lt;/li&gt;
        &lt;/ol&gt;
        &lt;p&gt;&lt;b&gt;왜 CollectionDAO.java인가?&lt;/b&gt; BANK-OM-001의 InstanceCode DAO가 이 공용 연결부를 사용하기 때문입니다. 새 공식 버전이 이 파일을 바꾸면 자동 실패시키는 것이 아니라, 행내 DAO 연결이 새 구조에도 맞는지 재검토 대상으로 표시합니다.&lt;/p&gt;
        &lt;p&gt;&lt;b&gt;누락 위험은 있습니다.&lt;/b&gt; 그래서 검사기는 새 공식 버전에서 실제 바뀐 파일과 행내 코드의 직접 참조 관계를 근거로 watch 후보를 제안합니다. 다만 자동 등록하지는 않으며, 코드 책임자가 연결 이유를 확인한 뒤 Manifest에 반영해야 합니다. 계약·행내 동작 검사는 누락을 한 번 더 찾는 별도 안전망입니다.&lt;/p&gt;
      &lt;/details&gt;
    &lt;/div&gt;

    &lt;details class=&quot;om-details&quot;&gt;
      &lt;summary&gt;왜 이 구조가 필요한가?&lt;/summary&gt;
      &lt;p&gt;색상은 변경의 역할을 구분합니다. Core 패치는 공식 공용 파일을 수정하는 변경이고, 커스터마이징은 행내 전용 파일을 추가하는 변경입니다. BANK-OM-001처럼 한 업무 기능이 두 영역을 모두 사용한다면 같은 BANK-OM ID로 연결해 추적합니다.&lt;/p&gt;
    &lt;/details&gt;
  &lt;/section&gt;

  &lt;section id=&quot;gates&quot; class=&quot;om-section&quot;&gt;
    &lt;div class=&quot;om-section-title&quot;&gt;
      &lt;span&gt;03&lt;/span&gt;
      &lt;div&gt;
        &lt;h2&gt;검사기&lt;/h2&gt;
        &lt;p&gt;각 검사는 한 가지 질문만 담당합니다. 실패하면 후보 승인을 중단하고 해당 원인을 수정합니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table om-gate-table&quot;&gt;
        &lt;thead&gt;
          &lt;tr&gt;
            &lt;th&gt;검사기&lt;/th&gt;
            &lt;th&gt;무엇을 검사하나&lt;/th&gt;
            &lt;th&gt;어떤 경우 실패하나&lt;/th&gt;
            &lt;th&gt;실패하면&lt;/th&gt;
          &lt;/tr&gt;
        &lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;
            &lt;th&gt;T25-R&lt;br&gt;&lt;small&gt;최초 재구성&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;과거 행내본의 실제 113개 차이를 BANK-OM별 정확한 파일 목록으로 분리했는지&lt;/td&gt;
            &lt;td&gt;폴더 패턴, 없는 파일, 소유자 불일치, 제외 사유 누락, 최종 내용 불일치&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;재구성 중단&lt;/strong&gt;&lt;br&gt;소유표를 다시 작성&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T25&lt;br&gt;&lt;small&gt;공식 기반&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;검사 후보가 승인한 공식 원본에서 출발했는지&lt;/td&gt;
            &lt;td&gt;공식 SHA가 후보 이력에 없음, 잠금 문서와 후보 SHA 불일치&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;후보 차단&lt;/strong&gt;&lt;br&gt;올바른 공식 원본에서 다시 생성&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T30&lt;br&gt;&lt;small&gt;커밋 라벨&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;모든 제품 코드 변경 커밋에 BANK-OM ID가 정확히 하나 있는지&lt;/td&gt;
            &lt;td&gt;라벨 없음, 한 커밋에 여러 ID, 제품 코드와 검사기 정책 혼합&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;커밋 차단&lt;/strong&gt;&lt;br&gt;기능별로 다시 분리&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T31&lt;br&gt;&lt;small&gt;ID 이력&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;ID가 등록돼 있고 커밋 순서와 의존관계가 올바른지&lt;/td&gt;
            &lt;td&gt;미등록 ID, 허용되지 않은 여러 커밋, series 단절, 순환 의존&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;적용 순서 차단&lt;/strong&gt;&lt;br&gt;등록부·의존관계 수정&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T26&lt;br&gt;&lt;small&gt;기능 생존&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;등록한 원본 파일 전체와 필수 파일·계약·테스트가 후보에 남았는지&lt;/td&gt;
            &lt;td&gt;필수 파일 소실은 block, 그 밖의 등록 파일 소실은 approval, 폴더 패턴은 analysis_error&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;차단 또는 검토&lt;/strong&gt;&lt;br&gt;소실한 파일의 역할을 확인&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T40&lt;br&gt;&lt;small&gt;범위 이탈&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;제품·검사기·등록부·문서의 실제 변경이 승인한 파일 범위 안인지&lt;/td&gt;
            &lt;td&gt;등록하지 않은 파일 변경, required 파일의 순변경 없음&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;변경 차단&lt;/strong&gt;&lt;br&gt;잘못 섞인 변경을 분리&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T41&lt;br&gt;&lt;small&gt;위험 영역&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;변경이 금지·승인·관찰 영역 중 어디인지, 승인한 의도 범위 안인지&lt;/td&gt;
            &lt;td&gt;빈 허용 범위, 금지 파일 변경, 승인 범위 밖 파일 변경&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;오류·차단·승인&lt;/strong&gt;&lt;br&gt;위험 등급별로 분리&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T42&lt;br&gt;&lt;small&gt;업그레이드 영향&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;공식 새 버전이 watch 경로·설정키·의존성을 바꿨는지와 직접 참조 후보&lt;/td&gt;
            &lt;td&gt;등록한 의존 대상 변경 또는 미등록 직접 참조 후보 발견&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;책임자 검토&lt;/strong&gt;&lt;br&gt;자동 등록 없이 근거 제시&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T43&lt;br&gt;&lt;small&gt;커스텀 부채&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;코어 ID 수·변경 라인·충돌률·한 파일에 겹친 ID 수&lt;/td&gt;
            &lt;td&gt;외부 정책의 soft/hard 기준 초과, 지표·정책 형식 오류&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;승인 또는 차단&lt;/strong&gt;&lt;br&gt;범위 축소·기준선 검토&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T93&lt;br&gt;&lt;small&gt;정확 범위&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;ID별 실제 커밋 파일과 manifest 파일 목록이 정확히 같은지&lt;/td&gt;
            &lt;td&gt;실제 변경 누락, 실제로 바꾸지 않은 파일의 과다 허용&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;누락 차단&lt;/strong&gt;&lt;br&gt;과다 범위는 승인 검토&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T70&lt;br&gt;&lt;small&gt;검사기 보호&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;검사기·등록부·테스트·정책 문서를 느슨하게 바꾸지 않았는지&lt;/td&gt;
            &lt;td&gt;보호 파일을 현재 변경본의 완화된 규칙으로 스스로 승인하려는 경우&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;정책 변경 절차&lt;/strong&gt;&lt;br&gt;기존 기준으로 별도 승인&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T60-I&lt;br&gt;&lt;small&gt;검사 코드&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;등록된 Python 테스트 파일과 함수가 실제로 존재하는지&lt;/td&gt;
            &lt;td&gt;Python 파일 없음, 함수 이름 없음, 문법을 읽을 수 없음&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;검사 준비 차단&lt;/strong&gt;&lt;br&gt;테스트 구현 보완&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T61&lt;br&gt;&lt;small&gt;반증 검사&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;기능 코드를 제거하면 관련 테스트가 실제로 실패하는지&lt;/td&gt;
            &lt;td&gt;기능을 빼도 테스트가 통과, 환경 오류만 발생, 비교 증거 없음&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;검사 신뢰 불충분&lt;/strong&gt;&lt;br&gt;테스트 민감도 보완&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;T62&lt;br&gt;&lt;small&gt;행내 동작&lt;/small&gt;&lt;/th&gt;
            &lt;td&gt;행내 서버·DB·검색·브라우저에서 기능이 실제로 동작하는지&lt;/td&gt;
            &lt;td&gt;테스트 미실행, API·저장·검색·화면 결과 불일치&lt;/td&gt;
            &lt;td&gt;&lt;strong&gt;운영 승인 차단&lt;/strong&gt;&lt;br&gt;환경 또는 기능 수정 후 재실행&lt;/td&gt;
          &lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;example&quot; class=&quot;om-section&quot;&gt;
    &lt;div class=&quot;om-section-title&quot;&gt;
      &lt;span&gt;04&lt;/span&gt;
      &lt;div&gt;
        &lt;h2&gt;실제 적용 예시&lt;/h2&gt;
        &lt;p&gt;BANK-OM-001은 공식 원본에 없던 InstanceCode 기능을 코어 파일과 전용 파일에 함께 추가합니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;om-example-flow&quot; role=&quot;img&quot; aria-label=&quot;공식 원본에 BANK-OM-001 커밋을 적용하고 검사 결과를 얻는 흐름&quot;&gt;
      &lt;span&gt;공식 원본&lt;br&gt;&lt;code&gt;afcb2d2…&lt;/code&gt;&lt;/span&gt;
      &lt;b aria-hidden=&quot;true&quot;&gt;＋&lt;/b&gt;
      &lt;span&gt;BANK-OM-001&lt;br&gt;&lt;code&gt;a2566fac…&lt;/code&gt;&lt;/span&gt;
      &lt;b aria-hidden=&quot;true&quot;&gt;→&lt;/b&gt;
      &lt;span&gt;적용 후보&lt;br&gt;&lt;code&gt;Entity + 전용 파일&lt;/code&gt;&lt;/span&gt;
      &lt;b aria-hidden=&quot;true&quot;&gt;→&lt;/b&gt;
      &lt;span&gt;검사 결과&lt;br&gt;&lt;code&gt;T26·T60-I pass&lt;/code&gt;&lt;/span&gt;
    &lt;/div&gt;

    &lt;div class=&quot;om-file-diffs&quot;&gt;
      &lt;details class=&quot;om-file-diff&quot; open&gt;
        &lt;summary&gt;&lt;code&gt;Entity.java&lt;/code&gt;&lt;span&gt;기존 코어 파일 수정 · 1줄 추가&lt;/span&gt;&lt;/summary&gt;
        &lt;div class=&quot;om-split-diff&quot;&gt;
          &lt;div&gt;
            &lt;strong&gt;공식 원본&lt;/strong&gt;
            &lt;pre&gt;&lt;code&gt;public static final String WORKSHEET = &quot;worksheet&quot;;
&lt;span class=&quot;text-muted&quot;&gt;INSTANCE_CODE 없음&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;
          &lt;/div&gt;
          &lt;div&gt;
            &lt;strong&gt;BANK-OM-001 적용본&lt;/strong&gt;
            &lt;pre&gt;&lt;code&gt;public static final String WORKSHEET = &quot;worksheet&quot;;
&lt;ins&gt;public static final String INSTANCE_CODE = &quot;instanceCode&quot;;&lt;/ins&gt;&lt;/code&gt;&lt;/pre&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/details&gt;

      &lt;details class=&quot;om-file-diff&quot;&gt;
        &lt;summary&gt;&lt;code&gt;InstanceCodeResource.java&lt;/code&gt;&lt;span&gt;신규 파일 · API 접수&lt;/span&gt;&lt;/summary&gt;
        &lt;div class=&quot;om-split-diff&quot;&gt;
          &lt;div class=&quot;om-no-file&quot;&gt;&lt;strong&gt;공식 원본&lt;/strong&gt;&lt;span&gt;파일 없음&lt;/span&gt;&lt;/div&gt;
          &lt;div&gt;
            &lt;strong&gt;BANK-OM-001 적용본&lt;/strong&gt;
            &lt;pre&gt;&lt;code&gt;&lt;ins&gt;@Path(&quot;/v1/instanceCodes&quot;)&lt;/ins&gt;
&lt;ins&gt;class InstanceCodeResource&lt;/ins&gt;
&lt;ins&gt;  extends EntityResource&amp;lt;InstanceCode, InstanceCodeRepository&amp;gt; {&lt;/ins&gt;
&lt;ins&gt;  super(Entity.INSTANCE_CODE, authorizer, limits);&lt;/ins&gt;
&lt;ins&gt;}&lt;/ins&gt;&lt;/code&gt;&lt;/pre&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/details&gt;

      &lt;details class=&quot;om-file-diff&quot;&gt;
        &lt;summary&gt;&lt;code&gt;InstanceCodeMapper.java&lt;/code&gt;&lt;span&gt;신규 파일 · 요청값 변환&lt;/span&gt;&lt;/summary&gt;
        &lt;div class=&quot;om-split-diff&quot;&gt;
          &lt;div class=&quot;om-no-file&quot;&gt;&lt;strong&gt;공식 원본&lt;/strong&gt;&lt;span&gt;파일 없음&lt;/span&gt;&lt;/div&gt;
          &lt;div&gt;
            &lt;strong&gt;BANK-OM-001 적용본&lt;/strong&gt;
            &lt;pre&gt;&lt;code&gt;&lt;ins&gt;class InstanceCodeMapper {&lt;/ins&gt;
&lt;ins&gt;  return copy(new InstanceCode(), create, user)&lt;/ins&gt;
&lt;ins&gt;      .withCodeGroup(create.getCodeGroup())&lt;/ins&gt;
&lt;ins&gt;      .withCodeValue(create.getCodeValue());&lt;/ins&gt;
&lt;ins&gt;}&lt;/ins&gt;&lt;/code&gt;&lt;/pre&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/details&gt;

      &lt;details class=&quot;om-file-diff&quot;&gt;
        &lt;summary&gt;&lt;code&gt;InstanceCodeRepository.java&lt;/code&gt;&lt;span&gt;신규 파일 · DB·검색 연결&lt;/span&gt;&lt;/summary&gt;
        &lt;div class=&quot;om-split-diff&quot;&gt;
          &lt;div class=&quot;om-no-file&quot;&gt;&lt;strong&gt;공식 원본&lt;/strong&gt;&lt;span&gt;파일 없음&lt;/span&gt;&lt;/div&gt;
          &lt;div&gt;
            &lt;strong&gt;BANK-OM-001 적용본&lt;/strong&gt;
            &lt;pre&gt;&lt;code&gt;&lt;ins&gt;class InstanceCodeRepository&lt;/ins&gt;
&lt;ins&gt;  extends EntityRepository&amp;lt;InstanceCode&amp;gt; {&lt;/ins&gt;
&lt;ins&gt;  super(InstanceCodeResource.COLLECTION_PATH,&lt;/ins&gt;
&lt;ins&gt;      Entity.INSTANCE_CODE,&lt;/ins&gt;
&lt;ins&gt;      Entity.getCollectionDAO().instanceCodeDAO());&lt;/ins&gt;
&lt;ins&gt;}&lt;/ins&gt;&lt;/code&gt;&lt;/pre&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/details&gt;
    &lt;/div&gt;

    &lt;details class=&quot;om-details&quot;&gt;
      &lt;summary&gt;커밋과 등록 파일의 역할 차이&lt;/summary&gt;
      &lt;p&gt;&lt;strong&gt;Git 커밋&lt;/strong&gt;이 실제 코드를 수정합니다. &lt;strong&gt;BANK-OM ID&lt;/strong&gt;는 변경을 업무 기능으로 묶고, &lt;strong&gt;Manifest&lt;/strong&gt;는 허용 경로·필수 파일·감시 지점·테스트 계약을 검사기에 알려줍니다. 등록 파일 자체가 제품 코드를 수정하지는 않습니다.&lt;/p&gt;
    &lt;/details&gt;
  &lt;/section&gt;

  &lt;section id=&quot;result&quot; class=&quot;om-section&quot;&gt;
    &lt;div class=&quot;om-section-title&quot;&gt;
      &lt;span&gt;05&lt;/span&gt;
      &lt;div&gt;
        &lt;h2&gt;결과&lt;/h2&gt;
        &lt;p&gt;현재는 소스 수준 재적용까지 확인됐고, 최종 행내 동작 승인은 남아 있습니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;om-result-list&quot;&gt;
      &lt;div&gt;&lt;span class=&quot;om-status om-pass&quot;&gt;통과&lt;/span&gt;&lt;strong&gt;T25-R&lt;/strong&gt;&lt;p&gt;113개 경로 = 단독 74 + 공유 37 + 제외 2, 폴더 패턴 없음&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span class=&quot;om-status om-pass&quot;&gt;통과&lt;/span&gt;&lt;strong&gt;T25·T30·T31&lt;/strong&gt;&lt;p&gt;공식 기반과 BANK-OM 커밋 장부·순서 정상&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span class=&quot;om-status om-pass&quot;&gt;통과&lt;/span&gt;&lt;strong&gt;T26·T60-I&lt;/strong&gt;&lt;p&gt;등록 원본 파일 전체·필수 코드·Python 검사 구현 존재&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span class=&quot;om-status om-pass&quot;&gt;통과&lt;/span&gt;&lt;strong&gt;T40·T70&lt;/strong&gt;&lt;p&gt;전체 변경 범위와 검사기 자체 보호 단위 테스트 통과&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span class=&quot;om-status om-pass&quot;&gt;통과&lt;/span&gt;&lt;strong&gt;T41·T43·T93&lt;/strong&gt;&lt;p&gt;현재 후보의 위험 영역·부채 기준선·ID별 정확 경로 일치. BANK-OM-007은 원본 8개와 등록된 후속 2개를 합쳐 현재 10개 경로로 검사&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span class=&quot;om-status om-pass&quot;&gt;구현&lt;/span&gt;&lt;strong&gt;T42·T50·T51&lt;/strong&gt;&lt;p&gt;watch 제안·빈 선언 차단·scalar/list 구조 변화 출력&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span class=&quot;om-status om-limited&quot;&gt;범위 통과&lt;/span&gt;&lt;strong&gt;T61&lt;/strong&gt;&lt;p&gt;현재 Sybase·Tibero만 반증 완료&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span class=&quot;om-status om-block&quot;&gt;환경 대기&lt;/span&gt;&lt;strong&gt;T62&lt;/strong&gt;&lt;p&gt;실행기와 환경 사전검사는 완료, 행내 운영 테스트 7건 실행 필요&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;om-decision&quot;&gt;
      &lt;div&gt;&lt;strong&gt;지금 말할 수 있음&lt;/strong&gt;&lt;span&gt;코드 재적용 구조와 소스 검사는 정상&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;아직 말할 수 없음&lt;/strong&gt;&lt;span&gt;행내 환경에서 모든 기능이 정상 동작한다는 최종 결론&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;roadmap&quot; class=&quot;om-section&quot;&gt;
    &lt;div class=&quot;om-section-title&quot;&gt;
      &lt;span&gt;06&lt;/span&gt;
      &lt;div&gt;
        &lt;h2&gt;현재까지 구현 단계와 향후 추가 구현&lt;/h2&gt;
        &lt;p&gt;1·2·3차 코드는 완료했습니다. 이제 행내 환경 값을 넣고 실제 결과 증거를 만드는 단계입니다.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;om-roadmap&quot;&gt;
      &lt;div class=&quot;om-roadmap-group&quot;&gt;
        &lt;strong&gt;현재 완료&lt;/strong&gt;
        &lt;ol&gt;
          &lt;li&gt;&lt;span&gt;1&lt;/span&gt;&lt;div&gt;&lt;b&gt;BANK-OM 등록 체계&lt;/b&gt;&lt;p&gt;등록된 BANK-OM 전체의 Manifest·계약·커밋 라벨 구성&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span&gt;2&lt;/span&gt;&lt;div&gt;&lt;b&gt;제품 후보 재구성&lt;/b&gt;&lt;p&gt;공식 1.13.1 위에 등록된 BANK-OM 변경 적용 · &lt;code&gt;849ae756…&lt;/code&gt;&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span&gt;3&lt;/span&gt;&lt;div&gt;&lt;b&gt;정확 경로 검사기 1차&lt;/b&gt;&lt;p&gt;T25-R·T26·T40·T70 강화 · 39개 단위 테스트 통과&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span&gt;4&lt;/span&gt;&lt;div&gt;&lt;b&gt;위험 검사기 2차&lt;/b&gt;&lt;p&gt;T41·T42·T43·T93·T50·T51 보강과 실제 후보 통합&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span&gt;5&lt;/span&gt;&lt;div&gt;&lt;b&gt;운영 실행기 3차&lt;/b&gt;&lt;p&gt;환경 사전검사·T62 결과 결속·90일 증거 보존&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span&gt;6&lt;/span&gt;&lt;div&gt;&lt;b&gt;제한 범위 반증&lt;/b&gt;&lt;p&gt;Sybase·Tibero T61 증명&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;/ol&gt;
      &lt;/div&gt;

      &lt;div class=&quot;om-roadmap-group om-future&quot;&gt;
        &lt;strong&gt;행내에서 실행할 일&lt;/strong&gt;
        &lt;ol&gt;
          &lt;li&gt;&lt;span&gt;1&lt;/span&gt;&lt;div&gt;&lt;b&gt;필수 환경값 입력&lt;/b&gt;&lt;p&gt;URL·토큰·테스트 식별값·브라우저 로그인 상태·배포 digest&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span&gt;2&lt;/span&gt;&lt;div&gt;&lt;b&gt;T62 운영 테스트 7건&lt;/b&gt;&lt;p&gt;InstanceCode CRUD·저장·검색·화면 검증&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span&gt;3&lt;/span&gt;&lt;div&gt;&lt;b&gt;T61 범위 확대&lt;/b&gt;&lt;p&gt;BANK-OM-001을 포함한 나머지 기능의 제거본 배포·반증&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span&gt;4&lt;/span&gt;&lt;div&gt;&lt;b&gt;다음 공식 버전 입력&lt;/b&gt;&lt;p&gt;새 target SHA로 T42 watch·설정·의존성 영향과 후보 제안 실행&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span&gt;5&lt;/span&gt;&lt;div&gt;&lt;b&gt;업그레이드 리허설&lt;/b&gt;&lt;p&gt;재적용·충돌 해결·T43 실제 conflict rate·전체 재검사&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span&gt;6&lt;/span&gt;&lt;div&gt;&lt;b&gt;동일 산출물 승인&lt;/b&gt;&lt;p&gt;검사한 소스 SHA와 실제 배포 이미지 digest 일치 증명&lt;/p&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;/ol&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
