schema_version: 1
definitions:
- path: bootstrap/sql/migrations/native/1.13.1/mysql/schemaChanges.sql
  customization_id: BANK-OM-001
  assertions:
  - id: bank-om-001-schemachanges-1
    matcher: code_fragment
    fragment: "-- InstanceCode entity table: common/reference code master data (codeGroup/codeValue)\nCREATE TABLE IF NOT EXISTS instance_code_entity (\n    id VARCHAR(36) GENERATED ALWAYS AS (json_unquote(json_extract(json, '$.id'))) STORED NOT NULL,\n    name VARCHAR(256) GENERATED ALWAYS AS (json_unquote(json_extract(json, '$.name'))) VIRTUAL NOT NULL,\n    fqnHash VARCHAR(768) NOT NULL COLLATE ascii_bin,\n    json JSON NOT NULL,\n    updatedAt BIGINT UNSIGNED GENERATED ALWAYS AS (json_unquote(json_extract(json, '$.updatedAt'))) VIRTUAL NOT NULL,\n    updatedBy VARCHAR(256) GENERATED ALWAYS AS (json_unquote(json_extract(json, '$.updatedBy'))) VIRTUAL NOT NULL,\n    deleted TINYINT(1) GENERATED ALWAYS AS (json_extract(json, '$.deleted')) VIRTUAL,\n    PRIMARY KEY (id),\n    UNIQUE KEY instance_code_entity_fqn_hash (fqnHash)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;\nCREATE INDEX instance_code_entity_name_index ON instance_code_entity (name);\n"
- path: bootstrap/sql/migrations/native/1.13.1/mysql/schemaChanges.sql
  customization_id: BANK-OM-002
  assertions:
  - id: bank-om-002-schemachanges-1
    matcher: code_fragment
    fragment: "-- QueryReport entity table: report metadata linked to Query entities via queryUsedIn\nCREATE TABLE IF NOT EXISTS query_report_entity (\n    id VARCHAR(36) GENERATED ALWAYS AS (json_unquote(json_extract(json, '$.id'))) STORED NOT NULL,\n    name VARCHAR(256) GENERATED ALWAYS AS (json_unquote(json_extract(json, '$.name'))) VIRTUAL NOT NULL,\n    fqnHash VARCHAR(768) NOT NULL COLLATE ascii_bin,\n    json JSON NOT NULL,\n    updatedAt BIGINT UNSIGNED GENERATED ALWAYS AS (json_unquote(json_extract(json, '$.updatedAt'))) VIRTUAL NOT NULL,\n    updatedBy VARCHAR(256) GENERATED ALWAYS AS (json_unquote(json_extract(json, '$.updatedBy'))) VIRTUAL NOT NULL,\n    deleted TINYINT(1) GENERATED ALWAYS AS (json_extract(json, '$.deleted')) VIRTUAL,\n    PRIMARY KEY (id),\n    UNIQUE KEY query_report_entity_fqn_hash (fqnHash)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;\nCREATE INDEX query_report_entity_name_index ON query_report_entity (name);\n"
- path: bootstrap/sql/migrations/native/1.13.1/postgres/schemaChanges.sql
  customization_id: BANK-OM-001
  assertions:
  - id: bank-om-001-schemachanges-1
    matcher: code_fragment
    fragment: "-- InstanceCode entity table: common/reference code master data (codeGroup/codeValue)\nCREATE TABLE IF NOT EXISTS instance_code_entity (\n    id VARCHAR(36) GENERATED ALWAYS AS (json ->> 'id') STORED NOT NULL,\n    name VARCHAR(256) GENERATED ALWAYS AS (json ->> 'name') STORED NOT NULL,\n    fqnHash VARCHAR(768) NOT NULL,\n    json JSONB NOT NULL,\n    updatedAt BIGINT GENERATED ALWAYS AS ((json ->> 'updatedAt')::bigint) STORED NOT NULL,\n    updatedBy VARCHAR(256) GENERATED ALWAYS AS (json ->> 'updatedBy') STORED NOT NULL,\n    deleted BOOLEAN GENERATED ALWAYS AS ((json ->> 'deleted')::boolean) STORED,\n    PRIMARY KEY (id),\n    UNIQUE (fqnHash)\n);\nCREATE INDEX IF NOT EXISTS instance_code_entity_name_index ON instance_code_entity (name);\n"
- path: bootstrap/sql/migrations/native/1.13.1/postgres/schemaChanges.sql
  customization_id: BANK-OM-002
  assertions:
  - id: bank-om-002-schemachanges-1
    matcher: code_fragment
    fragment: "-- QueryReport entity table: report metadata linked to Query entities via queryUsedIn\nCREATE TABLE IF NOT EXISTS query_report_entity (\n    id VARCHAR(36) GENERATED ALWAYS AS (json ->> 'id') STORED NOT NULL,\n    name VARCHAR(256) GENERATED ALWAYS AS (json ->> 'name') STORED NOT NULL,\n    fqnHash VARCHAR(768) NOT NULL,\n    json JSONB NOT NULL,\n    updatedAt BIGINT GENERATED ALWAYS AS ((json ->> 'updatedAt')::bigint) STORED NOT NULL,\n    updatedBy VARCHAR(256) GENERATED ALWAYS AS (json ->> 'updatedBy') STORED NOT NULL,\n    deleted BOOLEAN GENERATED ALWAYS AS ((json ->> 'deleted')::boolean) STORED,\n    PRIMARY KEY (id),\n    UNIQUE (fqnHash)\n);\nCREATE INDEX IF NOT EXISTS query_report_entity_name_index ON query_report_entity (name);\n"
