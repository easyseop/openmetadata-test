  - The Node 24 action-pin workflow passed remotely; four live runtime contracts remain skipped because no deployed OpenMetadata URL is attached to the source-only job.
  - The runtime patch-kill workflow is implemented, but no separately built and deployed predecessor artifact has been executed through it.
