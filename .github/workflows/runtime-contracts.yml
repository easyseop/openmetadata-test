name: Runtime contracts

on:
  workflow_dispatch:
    inputs:
      artifact_digest:
        description: Deployed candidate image/package digest (sha256:...)
        required: true
        type: string
      base_url:
        description: Live OpenMetadata API base URL
        required: true
        type: string
      ime_editor_url:
        description: Authenticated page URL containing an editable SchemaEditor
        required: true
        type: string
      data_assertions_url:
        description: Authenticated customized data assertions page URL
        required: true
        type: string
      bank_column_ui_url:
        description: Authenticated table schema page URL with bank extensions
        required: true
        type: string

permissions:
  contents: read

env:
  PRODUCT_REPOSITORY: easyseop/OpenMetadata
  PRODUCT_BRANCH: codex/bank-vendor-1.13.1-rebuild
  PRODUCT_SHA: b80d24d83124435733d5af05d56515b3a855330e

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: openmetadata-runtime
    env:
      OPENMETADATA_BASE_URL: ${{ inputs.base_url }}
      OPENMETADATA_AUTH_TOKEN: ${{ secrets.OPENMETADATA_AUTH_TOKEN }}
      BANK_CONTRACT_QUERY_ID: ${{ vars.BANK_CONTRACT_QUERY_ID }}
      BANK_FAILED_ASSERTION_FQN: ${{ vars.BANK_FAILED_ASSERTION_FQN }}
      BANK_COLUMN_TABLE_FQN: ${{ vars.BANK_COLUMN_TABLE_FQN }}
      BANK_COLUMN_NAME: ${{ vars.BANK_COLUMN_NAME }}
      BANK_IME_EDITOR_URL: ${{ inputs.ime_editor_url }}
      BANK_DATA_ASSERTIONS_URL: ${{ inputs.data_assertions_url }}
      BANK_COLUMN_UI_URL: ${{ inputs.bank_column_ui_url }}
      BANK_BROWSER_STORAGE_STATE_B64: ${{ secrets.BANK_BROWSER_STORAGE_STATE_B64 }}

    steps:
      - name: Check out governance repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: harness/pyproject.toml

      - name: Install runtime harness and Chromium
        run: |
          python -m pip install --disable-pip-version-check -e "harness[dev,runtime]"
          python -m playwright install --with-deps chromium

      - name: Materialize locked product source
        run: |
          git init -q "$RUNNER_TEMP/product"
          git -C "$RUNNER_TEMP/product" remote add origin "https://github.com/${PRODUCT_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/product" config remote.origin.promisor true
          git -C "$RUNNER_TEMP/product" config remote.origin.partialclonefilter blob:none
          git -C "$RUNNER_TEMP/product" fetch --depth=16 --filter=blob:none --no-tags origin \
            "refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/${PRODUCT_BRANCH}"
          git -C "$RUNNER_TEMP/product" sparse-checkout init --no-cone
          git -C "$RUNNER_TEMP/product" sparse-checkout set --no-cone \
            "/openmetadata-spec/src/main/resources/json/schema/entity/services/" \
            "/openmetadata-ui/src/main/resources/ui/src/assets/svg/service-icon-sybase.svg" \
            "/openmetadata-ui/src/main/resources/ui/src/assets/svg/service-icon-tibero.svg" \
            "/openmetadata-ui/src/main/resources/ui/src/components/Database/SchemaEditor/SchemaEditor.tsx" \
            "/openmetadata-ui/src/main/resources/ui/src/generated/api/services/createDatabaseService.ts" \
            "/openmetadata-ui/src/main/resources/ui/src/generated/entity/services/connections/database/sybaseConnection.ts" \
            "/openmetadata-ui/src/main/resources/ui/src/generated/entity/services/connections/database/tiberoConnection.ts" \
            "/openmetadata-ui/src/main/resources/ui/src/generated/entity/services/connections/serviceConnection.ts" \
            "/openmetadata-ui/src/main/resources/ui/src/generated/entity/services/databaseService.ts" \
            "/openmetadata-ui/src/main/resources/ui/src/utils/DatabaseServiceUtils.test.tsx" \
            "/openmetadata-ui/src/main/resources/ui/src/utils/DatabaseServiceUtils.tsx" \
            "/openmetadata-ui/src/main/resources/ui/src/utils/ServiceIconUtils.ts"
          git -C "$RUNNER_TEMP/product" checkout --detach "origin/${PRODUCT_BRANCH}"
          test "$(git -C "$RUNNER_TEMP/product" rev-parse HEAD)" = "${PRODUCT_SHA}"

      - name: Execute candidate-bound runtime contracts
        id: execute
        env:
          DEPLOYED_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
        run: |
          set +e
          python harness/registrations/kb-openmetadata/run_runtime_contracts.py \
            --repo "$RUNNER_TEMP/product" \
            --harness harness \
            --registration harness/registrations/kb-openmetadata \
            --artifact-digest "$DEPLOYED_ARTIFACT_DIGEST" \
            --output-dir "$RUNNER_TEMP/runtime-evidence" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          actual_exit=$?
          echo "actual_exit=$actual_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish non-secret evidence summary
        if: always()
        run: |
          for evidence in candidate-lock.yaml test-run-set.yaml acgh-result.yaml; do
            if test -f "$RUNNER_TEMP/runtime-evidence/$evidence"; then
              echo "### $evidence" >> "$GITHUB_STEP_SUMMARY"
              echo '```yaml' >> "$GITHUB_STEP_SUMMARY"
              sed -n '1,400p' "$RUNNER_TEMP/runtime-evidence/$evidence" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Preserve runtime evidence
        id: evidence-upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-contract-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-evidence/*.yaml
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Publish evidence artifact identity
        if: always() && steps.evidence-upload.outcome == 'success'
        env:
          EVIDENCE_ARTIFACT_ID: ${{ steps.evidence-upload.outputs.artifact-id }}
          EVIDENCE_ARTIFACT_DIGEST: ${{ steps.evidence-upload.outputs.artifact-digest }}
          EVIDENCE_ARTIFACT_URL: ${{ steps.evidence-upload.outputs.artifact-url }}
        run: |
          echo "### Preserved runtime evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "- artifact id: $EVIDENCE_ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- artifact digest: $EVIDENCE_ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "- artifact URL: $EVIDENCE_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- retention: 90 days" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce result and exit consistency
        if: always()
        run: |
          python harness/registrations/kb-openmetadata/interpret_runtime_result.py \
            --harness harness \
            --root . \
            --candidate-lock "$RUNNER_TEMP/runtime-evidence/candidate-lock.yaml" \
            --test-run-set "$RUNNER_TEMP/runtime-evidence/test-run-set.yaml" \
            --result "$RUNNER_TEMP/runtime-evidence/acgh-result.yaml" \
            --actual-exit "${{ steps.execute.outputs.actual_exit || '3' }}"
