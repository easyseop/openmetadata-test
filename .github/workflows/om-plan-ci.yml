name: OM plan protected validation

on:
  workflow_dispatch:
    inputs:
      request_ref:
        description: Exact 40-character governance commit containing the run request
        required: true
        type: string
      request_path:
        description: Repository-relative YAML run-request path
        required: true
        type: string
      product_repository:
        description: Product repository in owner/name form
        required: true
        type: string
      proposal_ref:
        description: Exact 40-character commit containing the LLM proposal data
        required: true
        type: string
      proposal_path:
        description: Repository-relative proposal directory
        required: true
        type: string

permissions:
  actions: none
  contents: read

concurrency:
  group: om-plan-protected-${{ inputs.request_ref }}-${{ inputs.proposal_ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.ref == format('refs/heads/{0}',
      github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: none
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}/checker/harness
    outputs:
      input_lock_digest: ${{ steps.capture.outputs.input_lock_digest }}
    steps:
      - name: Check out trusted CI implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: checker
          persist-credentials: false

      - name: Check out request as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.request_ref }}
          path: request-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: checker/harness/pyproject.toml

      - name: Install harness dependencies outside the checker worktree
        run: >-
          python -m pip install --disable-pip-version-check
          "PyYAML>=6.0" "jsonschema>=4.18" "pathspec>=0.11"

      - name: Validate immutable workflow inputs
        env:
          REQUEST_REF: ${{ inputs.request_ref }}
          PROPOSAL_REF: ${{ inputs.proposal_ref }}
          PRODUCT_REPOSITORY: ${{ inputs.product_repository }}
        run: |
          python - <<'PY'
          import os
          import re

          oid = re.compile(r"[0-9a-f]{40}")
          repository = re.compile(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+")
          for name in ("REQUEST_REF", "PROPOSAL_REF"):
              if not oid.fullmatch(os.environ[name]):
                  raise SystemExit(f"{name} must be an exact lowercase commit SHA")
          if not repository.fullmatch(os.environ["PRODUCT_REPOSITORY"]):
              raise SystemExit("PRODUCT_REPOSITORY must use owner/name form")
          PY

      - name: Materialize product history on a clean worktree
        env:
          PRODUCT_REPOSITORY: ${{ inputs.product_repository }}
        run: |
          git clone --filter=blob:none \
            "https://github.com/${PRODUCT_REPOSITORY}.git" \
            "$RUNNER_TEMP/product"

      - name: Prepare CI-local request paths
        env:
          REQUEST_PATH: ${{ inputs.request_path }}
        run: |
          python checker/harness/ci/om_plan_ci.py prepare-request \
            --source "$GITHUB_WORKSPACE/request-source/$REQUEST_PATH" \
            --request-root "$GITHUB_WORKSPACE/request-source" \
            --output "$RUNNER_TEMP/run-request.yaml" \
            --product-repo "$RUNNER_TEMP/product" \
            --checker-repo "$GITHUB_WORKSPACE/checker"

      - name: Start protected plan session
        run: |
          python checker/harness/om_workflow.py plan-session-start \
            --state-root "$RUNNER_TEMP/om-plan-state" \
            --session-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --project-root "$GITHUB_WORKSPACE/checker"

      - name: Run trusted preflight
        run: |
          python checker/harness/om_workflow.py plan-preflight \
            --request "$RUNNER_TEMP/run-request.yaml" \
            --run-dir "$RUNNER_TEMP/trusted-run" \
            --state-root "$RUNNER_TEMP/om-plan-state" \
            --session-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --project-root "$GITHUB_WORKSPACE/checker" \
            > "$RUNNER_TEMP/preflight-result.json"

      - name: Capture protected digest and publish intent summary
        id: capture
        run: |
          python checker/harness/ci/om_plan_ci.py capture-preflight \
            --source "$RUNNER_TEMP/preflight-result.json" \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY" \
            --receipt "$RUNNER_TEMP/trusted-receipt/expected-input-lock-digest.txt"

      - name: Preserve trusted preflight run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: om-plan-trusted-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trusted-run/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: true

      - name: Preserve protected digest receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: om-plan-trusted-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trusted-receipt/expected-input-lock-digest.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  intent-review:
    if: >-
      github.ref == format('refs/heads/{0}',
      github.event.repository.default_branch)
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: none
      contents: none
    environment:
      name: om-plan-intent-review
      deployment: false
    steps:
      - name: Require explicitly configured protected environment
        env:
          INTENT_REVIEW_ENFORCED: ${{ vars.OM_PLAN_INTENT_REVIEW_ENFORCED }}
        run: |
          if test "$INTENT_REVIEW_ENFORCED" != "true"; then
            echo "om-plan-intent-review 환경의 required reviewers와" >&2
            echo "OM_PLAN_INTENT_REVIEW_ENFORCED=true 설정이 필요합니다." >&2
            exit 3
          fi

  untrusted-proposal:
    if: >-
      github.ref == format('refs/heads/{0}',
      github.event.repository.default_branch)
    needs: intent-review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: none
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}/checker/harness
    steps:
      - name: Check out trusted proposal packager
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: checker
          persist-credentials: false

      - name: Check out LLM proposal as untrusted data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.proposal_ref }}
          path: proposal-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: checker/harness/pyproject.toml

      - name: Install packager dependencies outside the checker worktree
        run: >-
          python -m pip install --disable-pip-version-check
          "PyYAML>=6.0" "jsonschema>=4.18" "pathspec>=0.11"

      - name: Package YAML and JSON proposal data only
        env:
          PROPOSAL_PATH: ${{ inputs.proposal_path }}
        run: |
          python checker/harness/ci/om_plan_ci.py package-proposal \
            --source "$GITHUB_WORKSPACE/proposal-source/$PROPOSAL_PATH" \
            --source-root "$GITHUB_WORKSPACE/proposal-source" \
            --output "$RUNNER_TEMP/untrusted-proposal"

      - name: Preserve untrusted proposal data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: om-plan-untrusted-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/untrusted-proposal/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  validate:
    if: >-
      github.ref == format('refs/heads/{0}',
      github.event.repository.default_branch)
    needs:
      - preflight
      - intent-review
      - untrusted-proposal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}/checker/harness
    steps:
      - name: Check out trusted validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: checker
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: checker/harness/pyproject.toml

      - name: Install validator dependencies outside the checker worktree
        run: >-
          python -m pip install --disable-pip-version-check
          "PyYAML>=6.0" "jsonschema>=4.18" "pathspec>=0.11"

      - name: Materialize product history for fresh recomputation
        env:
          PRODUCT_REPOSITORY: ${{ inputs.product_repository }}
        run: |
          git clone --filter=blob:none \
            "https://github.com/${PRODUCT_REPOSITORY}.git" \
            "$RUNNER_TEMP/product"

      - name: Download trusted preflight run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: om-plan-trusted-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trusted-run

      - name: Download untrusted proposal data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: om-plan-untrusted-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proposal-artifact

      - name: Install proposal as data into trusted run
        run: |
          python checker/harness/ci/om_plan_ci.py package-proposal \
            --source "$RUNNER_TEMP/proposal-artifact" \
            --source-root "$RUNNER_TEMP/proposal-artifact" \
            --output "$RUNNER_TEMP/trusted-run/proposal"

      - name: Rebind excluded repository paths on the fresh runner
        run: |
          python checker/harness/ci/om_plan_ci.py rebind-run-request \
            --run-dir "$RUNNER_TEMP/trusted-run" \
            --product-repo "$RUNNER_TEMP/product" \
            --checker-repo "$GITHUB_WORKSPACE/checker"

      - name: Rebind relocated run on fresh runner
        run: |
          python checker/harness/ci/om_plan_ci.py restore-run \
            --run-dir "$RUNNER_TEMP/trusted-run" \
            --state-root "$RUNNER_TEMP/om-plan-state" \
            --project-root "$GITHUB_WORKSPACE/checker" \
            --session-id "ci-validate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Execute fresh validation and preserve exact exit semantics
        env:
          EXPECTED_INPUT_LOCK_DIGEST: ${{ needs.preflight.outputs.input_lock_digest }}
        run: |
          python checker/harness/ci/om_plan_ci.py validate \
            --checker-root "$GITHUB_WORKSPACE/checker" \
            --run-dir "$RUNNER_TEMP/trusted-run" \
            --expected-input-lock-digest "$EXPECTED_INPUT_LOCK_DIGEST" \
            --captured-output "$RUNNER_TEMP/fresh-validation/stdout.json" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Preserve fresh CLI output as evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: om-plan-fresh-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fresh-validation/stdout.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false
